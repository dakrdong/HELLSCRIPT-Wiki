  let focusReturn=null;
  root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;focusReturn=b;const previousSelected=state.selected;let resetDetail=false;

  function layout(){root.dataset.device=designs.device;const stage=root.parentElement;stage.dataset.device=designs.device;stage.dataset.mode=root.dataset.mode;root.style.setProperty('--hs-embed-scale',String(stage.clientWidth/(designs.device==='portrait'?440:956)));const w=root.clientWidth,h=root.clientHeight,device=designs.device,portrait=device==='portrait'||device==='auto'&&h>w,phone=device==='portrait'||device==='landscape'||device==='auto'&&(portrait||h<=500&&w<=1100);root.dataset.layout=portrait?'portrait':'wide';root.dataset.phone=String(phone);const scale=phone?w/(portrait?440:956):1;root.style.setProperty('--hs-safe-top',phone&&portrait?62*scale+'px':'0px');root.style.setProperty('--hs-safe-right',phone&&!portrait?62*scale+'px':'0px');root.style.setProperty('--hs-safe-left',phone&&!portrait?62*scale+'px':'0px');root.style.setProperty('--hs-safe-bottom',phone?(portrait?34:21)*scale+'px':'0px');}
