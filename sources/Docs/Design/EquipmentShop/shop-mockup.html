 const initialBag=[{id:'owned-hood',key:'hood',base:9,grade:'magic',level:13,price:520},{id:'owned-coat',key:'leather',base:11,grade:'rare',level:14,price:1120},{id:'owned-ring',key:'ring',base:23,grade:'rare',level:15,price:1200,locked:true}];

 function remember(){window.openai?.setWidgetState?.({modelContent:{proposal:'equipment-shop-v1',language:state.lang,tab:state.tab,selected:state.selected,enhancementPreview:state.preview,scenario:designs.scenario},privateContent:{version:1,...state}})?.catch(()=>{});}

 const sprite=(index,extra='')=>`<span class="hs-sprite" aria-hidden="true" style="--hs-col:${index%6};--hs-row:${Math.floor(index/6)}">${extra}</span>`;
 function referenceLevel(item){return designs.scenario==='ceiling'?18:designs.scenario==='warehouse'&&state.compare==='best'&&item.id==='sword16'?17:item.refLevel;}
 function main(item,ref=false){const level=ref?referenceLevel(item):item.level;const base=ref?item.refMain:item.baseMain;return base*(1+.08*(level-1))*(ref?1:state.preview?1.05:1);}
 function metric(item){return item.type==='weapon'?'mainWeapon':item.type==='armor'?'mainArmor':'mainHealth';}
 function pct(item){return (main(item)/main(item,true)-1)*100;}
 function gain(item){let delta=pct(item);return (delta>=0?'+':'')+delta.toFixed(1)+'%';}
 function disabledPurchase(item){return state.sold.includes(item.id)?'sold':state.bag.length>=50?'full':state.gold<item.price?'insufficient':null;}
 function render(){
  root.dataset.mobile=state.mobile;root.dataset.density=designs.density;root.lang=state.lang;
  root.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));

  root.querySelector('.hs-filters').innerHTML=['all','weapon','armor','accessory'].map(k=>`<button type="button" class="cursor-interaction" data-filter="${k}" aria-pressed="${state.filter===k}">${t(k)}</button>`).join('');
  const shown=offers.filter(i=>state.filter==='all'||state.filter===i.type);
  root.querySelector('.hs-offers').innerHTML=shown.map(i=>`<button type="button" class="hs-offer cursor-interaction ${i.grade} ${state.sold.includes(i.id)?'sold':''}" data-offer="${i.id}" aria-pressed="${state.selected===i.id}">${sprite(i.base)}<span><strong>${t(i.key)}</strong><small>${t(i.grade)} · I${i.level} · ${t('required')} ${Math.ceil(i.level/2)}</small><span class="hs-offer-bottom"><span class="${i.badge==='slight'&&designs.scenario!=='ceiling'&&!(designs.scenario==='warehouse'&&i.id==='sword16')?'hs-good':''}">${state.sold.includes(i.id)?t('soldMini'):t(designs.scenario==='ceiling'||(designs.scenario==='warehouse'&&i.id==='sword16')?'alternative':i.badge)}</span><span class="hs-price">◈ ${num(i.price)}</span></span></span></button>`).join('')||`<p class="hs-empty">${t('empty')}</p>`;
  renderDetail();renderBag();renderAux();
 }
 function renderDetail(){
  const item=offers.find(i=>i.id===state.selected)||offers[0],delta=pct(item),reason=disabledPurchase(item);
  let note=state.preview?t('previewNote'):t('normalNote');

  root.querySelector('.hs-detail').innerHTML=`<button type="button" class="hs-mobile-back cursor-interaction" data-action="back-list">‹ ${t('backList')}</button><div class="hs-label">${t('offer')}</div><div class="hs-product">${sprite(item.base)}<div><div class="hs-name">${t(item.key)}</div><div class="hs-product-meta">${t(item.grade)} ${t(item.type)} · I${item.level}<br>${t('required')} ${Math.ceil(item.level/2)} · +${state.preview?1:0}</div></div></div><div class="hs-benefit ${delta<0?'hs-bad':''}"><i>${delta>0?'↑':delta<0?'↓':'−'}</i> ${t(metric(item))} ${gain(item)}</div><div class="hs-compare-switch"><button type="button" class="cursor-interaction" data-compare="current" aria-pressed="${state.compare==='current'}">${t('current')}</button><button type="button" class="cursor-interaction" data-compare="best" aria-pressed="${state.compare==='best'}">${t('best')}</button></div><table class="hs-table"><thead><tr><th>${t('sampleDisclaimer')}</th><th>${t(state.compare==='current'?'current':'best')}</th><th>${t(state.preview?'afterUpgrade':'compared')}</th></tr></thead><tbody><tr><td>${t(metric(item))}</td><td>${num(main(item,true))}</td><td class="${delta>0?'hs-good':delta<0?'hs-bad':''}">${num(main(item))}</td></tr><tr><td>${t('itemLevel')}</td><td>${referenceLevel(item)}</td><td>${item.level}</td></tr>${item.type==='weapon'?`<tr><td>${t('speed')}</td><td>1.00</td><td class="${item.base===2?'hs-bad':''}">${item.base===2?'0.85':'1.00'}</td></tr>`:''}</tbody></table><div class="hs-affix">${item.affixes.map(a=>`<span>${t(a[0])} +${num(a[1])}${a[2]||''}</span>`).join('')}</div><div class="hs-preview"><label><input type="checkbox" data-action="preview" ${state.preview?'checked':''}>${t('preview')}</label><span class="hs-preview-cost">◈ ${num(item.level*200)}<br>${t('materials')} 20</span></div><div class="hs-note">${note}</div><div class="hs-purchase"><div class="hs-total"><span>${t('cost')}</span><b>◈ ${num(item.price)}</b></div><button type="button" class="hs-primary cursor-interaction" data-action="purchase" ${reason?'disabled':''}>${t(reason||'buy')}</button><small>${t('one')}</small></div>`;
 }
 function renderBag(){
  root.querySelector('.hs-equipped').innerHTML=[1,10,12,14,16,18,20,23].map((b,n)=>sprite(b,`<span class="hs-slot-mark">${n===0?(designs.scenario==='ceiling'?'I18':'I15'):''}</span>`)).join('');

  root.querySelector('.hs-bag').innerHTML=Array.from({length:32},(_,n)=>{const i=state.bag[n];return `<span class="hs-cell" ${i?`aria-label="${t(i.key)}"`:'aria-hidden="true"'}>${i?sprite(i.base):''}</span>`;}).join('');

 }
 root.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.tab){state.tab=b.dataset.tab;state.auxId=null;}
  else if(b.dataset.filter){state.filter=b.dataset.filter;}
  else if(b.dataset.offer){state.selected=b.dataset.offer;state.mobile='detail';state.preview=false;}
  else if(b.dataset.compare){state.compare=b.dataset.compare;}
  else if(b.dataset.owned){state.auxId=b.dataset.owned;}
  else switch(b.dataset.action){
   case 'language':state.lang=state.lang==='ko'?'en':'ko';break;
   case 'close':state.closed=true;break;
   case 'open':state.closed=false;break;
   case 'back-list':state.mobile='list';break;
   case 'show-bag':state.tab='sell';state.auxId=null;break;
   case 'reset':reset();break;
   case 'purchase':{const item=offers.find(i=>i.id===state.selected);if(!item||disabledPurchase(item))break;state.gold-=item.price;state.sold.push(item.id);state.bag.push({...item,id:'purchased-'+item.id,price:(item.grade==='rare'?80:40)*item.level});state.status='success';break;}
   case 'sell':{const index=state.bag.findIndex(i=>i.id===state.auxId),item=state.bag[index];if(!item||item.locked||state.buyback.length>=12)break;state.gold+=item.price;state.buyback.unshift(item);state.bag.splice(index,1);state.auxId=null;state.status='soldToast';break;}
   case 'rebuy':{const index=state.buyback.findIndex(i=>i.id===state.auxId),item=state.buyback[index];if(!item||state.gold<item.price||state.bag.length>=50)break;state.gold-=item.price;state.bag.push(item);state.buyback.splice(index,1);state.auxId=null;state.status='backToast';break;}
