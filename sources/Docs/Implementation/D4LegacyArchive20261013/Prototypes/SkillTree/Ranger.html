<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark"><title>HELLSCRIPT · Skill trees</title>
  <link rel="icon" href="data:,"><link rel="stylesheet" href="styles.css">
</head>
<body data-class="Ranger">
  <div class="app">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="HELLSCRIPT Skill trees"><span class="brand-mark">H</span><span>HELLSCRIPT<small>SKILL ATLAS</small></span></a>
      <nav id="classNav" class="class-nav" aria-label="직업 선택"></nav>
      <button id="language" class="language" type="button" aria-label="Change language">EN</button>
    </header>
    <section class="class-intro" aria-labelledby="classTitle">
      <div><span class="eyebrow" data-i18n="eyebrow">직업별 성장 설계</span><h1 id="classTitle"></h1><p id="classSubtitle"></p></div>
      <div class="class-counts"><div><strong>16</strong><span data-i18n="active">액티브</span></div><div><strong>19</strong><span data-i18n="passive">패시브</span></div><div><strong>02</strong><span data-i18n="ultimate">궁극기</span></div></div>
    </section>
    <section class="growth-controls" data-i18n-label="growth" aria-label="성장 미리보기">
      <div class="level-block"><label for="level" data-i18n="heroLevel">플레이어 레벨</label><div class="level-line"><span>Lv.</span><input id="levelNumber" type="number" min="1" max="40" value="1" aria-label="플레이어 레벨"><span class="level-cap">/ 40</span><input id="level" type="range" min="1" max="40" value="1" aria-label="플레이어 레벨"></div></div>
      <div class="points-block"><span data-i18n="remaining">남은 강화 포인트</span><strong id="pointsRemaining">0 <small>/ 0</small></strong></div>
      <div class="plan-tools"><button id="undo" class="quiet" type="button" data-i18n="undo">되돌리기</button><button id="reset" class="quiet" type="button" data-i18n="reset">투자 초기화</button><button id="export" class="outline" type="button" data-i18n="export">빌드 저장</button><button id="import" class="quiet" type="button" data-i18n="import">불러오기</button><input id="importFile" type="file" accept="application/json,.json" hidden></div>
    </section>
    <main class="workspace">
      <section class="tree-panel" data-i18n-label="tree" aria-label="스킬 트리">
        <div class="tree-toolbar"><div class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="이름이나 효과로 찾기" aria-label="스킬 검색"></div><select id="kind" aria-label="스킬 종류"><option value="all">모든 스킬</option><option value="active">액티브</option><option value="passive">패시브</option><option value="ultimate">궁극기</option></select><span id="matchCount" class="match-count"></span><div class="zoom-tools"><button id="zoomOut" type="button" aria-label="축소">−</button><button id="zoomFit" type="button" data-i18n="fit">맞춤</button><button id="zoomIn" type="button" aria-label="확대">＋</button></div></div>
        <nav id="phaseNav" class="phase-nav" data-i18n-label="stages" aria-label="성장 구간"></nav>
        <div class="legend"><span><i class="shape active-shape"></i><span data-i18n="active">액티브</span></span><span><i class="shape passive-shape"></i><span data-i18n="passive">패시브</span></span><span><i class="shape ultimate-shape"></i><span data-i18n="ultimate">궁극기</span></span><span class="edge-key"><i></i><span data-i18n="allShort">직접 효과 연계</span></span><span id="unlockCount"></span></div>
        <div id="branchHeaders" class="branch-headers"></div>
        <div id="treeViewport" class="tree-viewport" tabindex="0" aria-label="스크롤 가능한 스킬 트리"><div id="treeSizer"><div id="treeCanvas" class="tree-canvas"></div></div></div>
        <footer class="tree-footer"><span data-i18n="treeHint">스킬을 선택하면 선행 경로와 효과를 확인할 수 있습니다.</span><button id="clearSelection" type="button" data-i18n="clearPath">경로 강조 해제</button></footer>
      </section>
      <div id="detailsBackdrop" class="details-backdrop" hidden></div>
      <aside id="inspector" class="inspector" aria-label="스킬 상세"><button id="closeDetails" class="close-details" type="button" aria-label="상세 닫기">×</button><div id="details"></div></aside>
    </main>
    <section class="loadout-section"><div class="loadout-title"><h2 data-i18n="loadout">전투 구성 미리보기</h2><span data-i18n="loadoutHint">해금과 장착은 별개입니다. 선행 스킬을 계속 장착할 필요는 없습니다.</span></div><div id="loadout" class="loadout"></div></section>
    <section class="bottom-info"><div class="examples"><span data-i18n="examples">추천 성장 경로</span><div id="examples"></div></div><details class="rules"><summary data-i18n="rules">성장 규칙 보기</summary><ul id="ruleList"></ul></details></section>
    <footer class="page-footer"><span data-i18n="scope">스킬 트리 설계안 · 이 페이지의 배분은 게임 저장에 반영되지 않습니다.</span><span>HELLSCRIPT / 111 SKILLS</span></footer>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <noscript>스킬 트리를 보려면 JavaScript를 활성화해 주세요. Enable JavaScript to view the skill trees.</noscript>
  <script src="catalog.js"></script><script src="engine.js"></script><script src="app.js"></script>
</body>
</html>
