  if (sh.scope === '@fine') {
    const g = [['dodge.* · survival.*', t('회피·생존 세부', 'Dodge and survival detail'), 14], ['loot.* filter', t('전리품 필터', 'Loot filters'), 10], ['bag.* cleanup', t('정리·보호·입고', 'Cleanup, protect, deposit'), 10], ['target.* track', t('상세 추적', 'Detailed tracking'), 6]];
    return `<div class="scrim" data-act="sheetclose"></div><div class="sheet" role="dialog" aria-modal="true"><div class="sh">${gi('skill-manage')}<div style="flex:1"><h3>${t('세밀한 사냥 조건', 'Fine hunting conditions')}</h3><small>${t('40개 옵션 · 숙련자용', '40 options · expert')}</small></div>${close}</div><div class="sb"><div class="stack">${g.map(x => `<button class="card advanced" data-act="toast" data-v="${t('세부 옵션 화면 (시연)', 'Detail screen (demo)')}"><span style="flex:1"><b>${x[1]}</b><br><span class="muted" style="font-size:11.5px">${t(x[2] + '개 옵션', x[2] + ' options')}</span></span><span class="go muted">›</span></button>`).join('')}</div></div></div>`;
  }
  const scope = sh.scope, isSkill = scope.startsWith('skill/'), list = isSkill ? D.policies[scope.slice(6)] : D.presets[scope];
  const cur = sh.pending, canCustom = has('r6');
  const title = isSkill ? L(node(scope.slice(6))) : t(...J[scope].t);
  const sub = isSkill ? t('이 스킬을 언제·어떻게 쓸지', 'When and how this skill is used') : t(...J[scope].q);
  const opts = list.map(p => `<button class="card opt ${cur === p.id ? 'sel' : ''}" data-act="pick" data-v="${p.id}" data-coach="opt-${p.id}"><span class="rd"></span><span class="tx"><b>${esc(L(p))}</b><span>${esc(S.lang === 'en' ? p.den : p.dko)}</span></span></button>`).join('')
    + (canCustom ? `<button class="card opt custom ${cur === '@custom' ? 'sel' : ''}" data-act="pick" data-v="@custom"><span class="rd"></span><span class="tx"><b>${t('직접 설정', 'Custom')}</b><span>${t('현재 값을 유지한 채 세부 옵션을 펼칩니다.', 'Keep the current values and open every option.')}</span></span></button>` : '');
  const custom = cur === '@custom' ? `<div class="card" style="margin-top:8px"><div class="tg"><span class="t">${t('시계 방향으로 선회', 'Orbit clockwise')}</span><button class="sw on" data-act="noop" role="switch" aria-checked="true"></button></div><div class="tg"><span class="t">${t('유지 거리', 'Keep distance')}</span><div class="sl" style="margin:0;flex:1"><input type="range" min="1" max="8" value="2"><output>2 m</output></div></div></div>` : '';
  const changed = cur !== sh.start;
  return `<div class="scrim" data-act="sheetclose"></div><div class="sheet" role="dialog" aria-modal="true"><div class="sh">${gi(isSkill ? 'nav-skills' : J[scope].icon)}<div style="flex:1"><h3>${esc(title)}</h3><small>${esc(sub)}</small></div>${close}</div>
    <div class="sb"><div class="stack">${opts}</div>${custom}</div><div class="sf"><span class="status">${t('적용 후 저장해야 사냥에 반영됩니다.', 'Apply, then Save to use it on a hunt.')}</span><button class="btn small" data-act="sheetclose">${t('취소', 'Cancel')}</button><button class="btn small primary" data-act="apply" data-coach="apply" ${changed ? '' : 'disabled'}>${t('적용', 'Apply')}</button></div></div>`;
}

// ---- coach (tutorial) layer
function coachTarget() {
  if (!S.coachOn) return null;
  const pro = prologue();
  if (pro === 'edict') {
    const s = coachState();
    if (S.sheet) { if (s === 2 && S.sheet.pending !== 'edge') return {sel: '[data-coach="opt-edge"]', ko: "'생존 우선 전투'를 고르세요.", en: "Pick 'Survival-first'."}; if (s === 2) return {sel: '[data-coach="apply"]', ko: '적용을 누르세요.', en: 'Press Apply.'}; return null; }
    if (s === 0) return S.selSkill !== 'W01' ? {sel: '[data-coach="node-W01"]', ko: '회오리를 눌러 고르세요.', en: 'Tap Whirlwind.'} : {sel: '[data-coach="plus"]', ko: '＋로 포인트 1을 써서 배우세요.', en: 'Spend 1 point with ＋.'};
    if (s === 1) return {sel: '[data-coach="equip"]', ko: '배운 스킬을 슬롯에 장착하세요.', en: 'Equip the skill to a slot.'};
    if (s === 2) return {sel: '[data-coach="policy-row"]', ko: '이 스킬을 어떻게 쓸지 고르세요.', en: 'Choose how it is used.'};
    if (s === 3) return {sel: '[data-coach="save"]', ko: '저장해야 칙령이 힘을 얻습니다.', en: 'Save to make the edict binding.'};
    return {sel: null, ko: '좋다. 이제 마물과 싸워 보라.', en: 'Good. Now fight the horde.', next: true};
  }
  if (pro === 'survival') {
    if (S.potionHp !== 60 && !dirtyCount()) return {sel: '[data-coach="potion-hp"]', ko: '물약을 마시는 HP 기준을 60%로 올려라.', en: 'Raise the potion threshold to 60%.'};
    if (S.potionHp !== 60) return {sel: '[data-coach="potion-hp"]', ko: '60%에 맞추어라.', en: 'Set it to 60%.'};
    if (dirtyCount()) return {sel: '[data-coach="save"]', ko: '저장하라.', en: 'Save it.'};
    return {sel: null, ko: '이제 수문장을 쓰러뜨려라.', en: 'Now defeat the gatekeeper.', next: true};
  }
  if (S.focus && !S.sheet) return {sel: `[data-coach="${S.focus}"]`, ko: (UL.find(u => u.focus === S.focus) || {ko: ['', '']}).ko[1], en: (UL.find(u => u.focus === S.focus) || {en: ['', '']}).en[1], soft: true};
  return null;
}
function drawCoach() {
  const c = coachTarget(), box = $('#screen'); if (!c) return '';
  const k = scale(), sr = box.getBoundingClientRect(), W = box.clientWidth, H = box.clientHeight;
  const label = pro => (prologue() ? t('칙령의 목소리', 'VOICE OF THE EDICT') : t('안내', 'GUIDE'));
  const bubble = (x, y) => `<div class="coach" style="left:${x}px;top:${y}px"><span class="halo"></span><div><div class="nm">${label()}</div><div class="tx">${esc(t(c.ko, c.en))}</div>${c.next ? `<button class="btn small primary" style="margin-top:6px" data-act="nextstage">${t('다음 단계 (시연)', 'Next step (demo)')}</button>` : ''}${c.soft ? `<div class="sub"><button class="btn small ghost" data-act="dismissfocus">${t('닫기', 'Dismiss')}</button></div>` : ''}</div></div>`;
  const el = c.sel && document.querySelector('#app ' + c.sel) || (c.sel && document.querySelector('#overlay ' + c.sel));
  if (!el) return c.sel ? '' : `<div class="blk" style="inset:0"></div>` + bubble(Math.max(10, W / 2 - 170), H / 2 - 40);
  const r = el.getBoundingClientRect(), x = (r.left - sr.left) / k, y = (r.top - sr.top) / k, w = r.width / k, h = r.height / k, p = 4;
  const hx = x - p, hy = y - p, hw = w + 2 * p, hh = h + 2 * p;
  const below = hy + hh + 90 < H, by = below ? hy + hh + 8 : Math.max(8, hy - 86), bx = Math.min(Math.max(8, hx), W - 350);
  const blk = c.soft ? '' : `<div class="blk" style="left:0;top:0;width:${W}px;height:${Math.max(0, hy)}px"></div><div class="blk" style="left:0;top:${hy + hh}px;width:${W}px;height:${Math.max(0, H - hy - hh)}px"></div><div class="blk" style="left:0;top:${hy}px;width:${Math.max(0, hx)}px;height:${hh}px"></div><div class="blk" style="left:${hx + hw}px;top:${hy}px;width:${Math.max(0, W - hx - hw)}px;height:${hh}px"></div>`;
  return blk + `<div class="hole" style="left:${hx}px;top:${hy}px;width:${hw}px;height:${hh}px"></div>` + bubble(bx, by);
}

// ------------------------------------------------------------------ render / events
const SIZES = {land: [956, 440], port: [440, 956], pc: [1600, 900]};
let fit = 1;
const scale = () => fit;
function layout() {
  const [w, h] = SIZES[S.device], st = $('#stage'), cap = S.device === 'port' ? 1.25 : 1.6;
  fit = Math.min(st.clientWidth / w, st.clientHeight / h, cap);
  const d = $('#device'); d.style.width = w + 'px'; d.style.height = h + 'px';
  d.style.transform = `translate(${Math.max(0, (st.clientWidth - w * fit) / 2)}px,${Math.max(0, (st.clientHeight - h * fit) / 2)}px) scale(${fit})`;
}
function render() {
  const keep = {}; document.querySelectorAll('[data-scroll]').forEach(e => keep[e.dataset.scroll] = e.scrollTop);
  let body = {overview: pageOverview, skills: pageSkills, combat: pageCombat, auto: pageAuto, presets: pagePresets}[S.tab]();
  $('#app').innerHTML = `<div class="win">${titlebar()}<div class="main">${nav()}<div class="page">${body}</div></div>${footer()}</div>`;
  $('#overlay').innerHTML = sheet();
  $('#overlay').insertAdjacentHTML('beforeend', drawCoach());
  document.querySelectorAll('[data-scroll]').forEach(e => { if (keep[e.dataset.scroll] != null) e.scrollTop = keep[e.dataset.scroll]; });
  document.documentElement.lang = S.lang;
  drawToolbar();
}
function drawToolbar() {
  if (Q.get('embed')) { $('#toolbar').hidden = true; $('#foot').hidden = true; return; }
  const dv = [['land', t('가로 956×440', 'Landscape 956×440')], ['port', t('세로 440×956', 'Portrait 440×956')], ['pc', 'PC 1600×900']];
  $('#toolbar').innerHTML = `<span class="brand">HELLSCRIPT<small>${t('사냥 칙령 시안', 'Hunt Edict mockup')}</small></span>
    <span class="grp"><label>${t('화면', 'Device')}</label>${dv.map(d => `<button class="${S.device === d[0] ? 'on' : ''}" data-pv="device" data-v="${d[0]}">${d[1]}</button>`).join('')}</span>
    <span class="grp"><label>${t('언어', 'Lang')}</label><button class="${S.lang === 'ko' ? 'on' : ''}" data-pv="lang" data-v="ko">한국어</button><button class="${S.lang === 'en' ? 'on' : ''}" data-pv="lang" data-v="en">English</button></span>
    <span class="grp"><label for="stg">${t('공개 단계', 'Unlock stage')}</label><select id="stg" data-pv="stage">${STAGES.map((s, i) => `<option value="${i}" ${i === S.stage ? 'selected' : ''}>${esc(L(s))}</option>`).join('')}</select></span>
    <span class="grp"><button class="${S.coachOn ? 'on' : ''}" data-pv="coach">${t('튜토리얼 안내선', 'Tutorial coach')} ${S.coachOn ? 'ON' : 'OFF'}</button><button data-pv="reset">${t('이 단계 초기화', 'Reset stage')}</button></span>`;
  $('#foot').textContent = t('시연 데이터입니다. 스킬·프리셋 이름과 설명은 게임 데이터를 그대로 읽고, 개요의 속도/안전 눈금·조언 내용·프리셋 슬롯은 시안용 예시입니다. 저장은 이 화면 안에서만 동작합니다.', 'Demo data. Skill and preset names come from the game; the speed/safety meters, advice and preset slots are illustrative. Saving only affects this page.');
}
let toastTimer;
function toast(msg) { const e = $('#toast'); e.textContent = msg; e.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => e.classList.remove('show'), 1800); }
function goTab(id, sub) { S.tab = id; if (sub) S.autoSub = sub; S.sheet = null; }
function act(a, v, el) {
  switch (a) {
    case 'tab': goTab(v); if (S.focus && !UL.find(u => u.focus === S.focus && u.tab === v)) S.focus = null; break;
    case 'sub': S.autoSub = v; break;
    case 'close': toast(t('창을 닫습니다 (시연)', 'Closes the window (demo)')); break;
    case 'toast': toast(v); return;
    case 'noop': return;
    case 'goskills': goTab('skills'); break;
    case 'autogo': goTab('auto', v); break;
    case 'trygo': { const u = newUnlock(); if (!u) break; S.dismissed[u.at] = 1; goTab(u.tab, u.sub); S.focus = u.focus; break; }
    case 'later': { const u = newUnlock(); if (u) S.dismissed[u.at] = 1; break; }
    case 'dismissfocus': S.focus = null; break;
    case 'nextstage': S.stage++; initStage(); break;
    case 'hp': S.potionHp = +el.value; if (S.focus === 'potionHp') S.focus = null; render(); const r = $('input[data-act=hp]'); if (r) r.focus(); return;
    case 'tg': S.tg[v] = !S.tg[v]; if (S.focus === v) S.focus = null; break;
    case 'style': { const s = D.styles.find(x => x.id === v); s.picks.forEach(([sc, id]) => S.sel[sc] = id); S.focus = null; break; }
    case 'advice': { const ad = advices()[+v]; if (ad.scope === 'potionHp') S.potionHp = ad.val; else S.sel[ad.scope] = ad.val; toast(t('편집본에 적용했습니다. 저장하면 반영됩니다.', 'Applied to the draft. Save to keep it.')); break; }
    case 'sheet': S.sheet = {scope: v, start: v === '@fine' ? null : (v.startsWith('skill/') ? S.policy[v.slice(6)] : S.sel[v]), pending: null}; S.sheet.pending = S.sheet.start; if (S.focus === v) S.focus = null; break;
    case 'sheetclose': S.sheet = null; break;
    case 'pick': S.sheet.pending = v; break;
    case 'apply': { const sc = S.sheet.scope; if (sc.startsWith('skill/')) S.policy[sc.slice(6)] = S.sheet.pending; else S.sel[sc] = S.sheet.pending === '@custom' ? S.sel[sc] : S.sheet.pending; S.sheet = null; break; }
    case 'node': S.selSkill = v; break;
    case 'rank': { const n = node(S.selSkill), d = +v, r = S.rank[n.id] || 0; if (d > 0 && !(canLearn(n) && r < n.max && points() > 0)) return; if (d < 0 && r <= 0) return; S.rank[n.id] = r + d; if (!S.rank[n.id]) { delete S.rank[n.id]; S.slots = S.slots.map(x => x === n.id ? null : x); } break; }
    case 'slot': S.target = S.target === +v ? null : +v; if (S.slots[+v] && S.target == null) S.slots[+v] = null; break;
    case 'equip': { const n = node(S.selSkill); if (!S.rank[n.id]) return; if (S.slots.includes(n.id)) S.slots = S.slots.map(x => x === n.id ? null : x); else { let i = S.target != null ? S.target : S.slots.indexOf(null); if (i < 0) { toast(t('빈 슬롯이 없습니다. 아래 슬롯을 눌러 비우세요.', 'No free slot. Tap a slot below to free it.')); return; } S.slots[i] = n.id; S.target = null; } break; }
    case 'save': S.saved = snapshot(); toast(t('칙령을 저장했습니다', 'Edict saved')); break;
    case 'revert': { const s = clone(S.saved); S.sel = s.sel; S.potionHp = s.potionHp; S.rank = s.rank; S.slots = s.slots; S.ult = s.ult; S.policy = s.policy; S.tg = s.tg; break; }
  }
  render();
}
document.addEventListener('click', e => {
  const pv = e.target.closest('[data-pv]');
  if (pv && pv.tagName === 'BUTTON') {
    const v = pv.dataset.v;
    if (pv.dataset.pv === 'device') S.device = v; else if (pv.dataset.pv === 'lang') S.lang = v;
    else if (pv.dataset.pv === 'coach') S.coachOn = !S.coachOn; else if (pv.dataset.pv === 'reset') initStage();
    layout(); render(); return;
  }
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'INPUT') return;
  act(el.dataset.act, el.dataset.v, el);
});
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.act === 'hp') act('hp', null, e.target); });
document.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.pv === 'stage') { S.stage = +e.target.value; initStage(); render(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) { S.sheet = null; render(); } });
addEventListener('resize', () => { layout(); render(); });
window.__edict = {S, STAGES, set: (o) => Object.assign(S, o), render, initStage, layout};
initStage();
if (Q.get('tab')) S.tab = Q.get('tab');
if (Q.get('sub')) S.autoSub = Q.get('sub');
if (Q.get('sheet')) { const v = Q.get('sheet'); S.sheet = {scope: v, start: v.startsWith('skill/') ? S.policy[v.slice(6)] : S.sel[v], pending: null}; S.sheet.pending = S.sheet.start; }
layout(); render();
})();
</script>
</body>
