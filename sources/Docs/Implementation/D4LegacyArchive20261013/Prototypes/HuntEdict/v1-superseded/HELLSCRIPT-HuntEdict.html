<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HELLSCRIPT 사냥 칙령 시안</title>
<style>:root{--void:#090807;--bg:#100f0d;--inset:#0c0b0a;--panel:#191713;--raised:#211e19;--hover:#2b2720;--sel:#33291b;--border:#3a3228;--edge:#5e4f3a;--gold-deep:#8a6b3c;--gold:#d3af72;--gold-bright:#f2d9a4;--text:#ece3cf;--muted:#a0978a;--faint:#6e675c;--success:#8fc07a;--danger:#df927b;--primary:#93632d;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{font:14px/1.45 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans CJK KR','Noto Sans KR',Arial,sans-serif;color:var(--text);background:#070605;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--border);background:var(--raised);padding:0;touch-action:manipulation;transition:background .15s,border-color .15s}
button:hover:not(:disabled){border-color:var(--gold-deep);background:var(--hover)}
button:disabled{cursor:not-allowed;opacity:.42}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4,p,ul{margin:0}ul{padding:0;list-style:none}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.gi{display:inline-block;width:18px;height:18px;flex:none;background:currentColor;-webkit-mask:var(--g) center/contain no-repeat;mask:var(--g) center/contain no-repeat}

/* ---------------------------------------------------------------- preview chrome (not part of the game) */
#toolbar{flex:none;display:flex;align-items:center;gap:10px 18px;padding:8px 16px;border-bottom:1px solid #2a2418;background:#0d0b09;flex-wrap:wrap;font-size:12px}
#toolbar .brand{font:15px Baskerville,Georgia,serif;letter-spacing:2px;color:var(--gold);white-space:nowrap}
#toolbar .brand small{font:11px 'Apple SD Gothic Neo',sans-serif;letter-spacing:0;color:var(--muted);margin-left:8px}
#toolbar .grp{display:flex;align-items:center;gap:4px}
#toolbar label{color:var(--muted);margin-right:4px}
#toolbar button,#toolbar select{font-size:12px;min-height:30px;padding:3px 10px;border:1px solid var(--border);background:var(--panel);color:var(--text)}
#toolbar button.on{border-color:var(--gold);color:var(--gold-bright);background:var(--sel)}
#toolbar select{max-width:260px}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#1a140d,#070605 70%)}
#device{position:absolute;left:0;top:0;transform-origin:0 0;border:1px solid #3a3228;box-shadow:0 24px 80px #000c}
#screen{position:relative;width:100%;height:100%;overflow:hidden;background:var(--void);container-type:size;container-name:scr}
#app{position:absolute;inset:0}
#foot{flex:none;padding:6px 16px;font-size:11px;color:var(--faint);border-top:1px solid #1d1912;background:#0a0908;line-height:1.5}

/* ---------------------------------------------------------------- window frame */
.win{position:absolute;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#14120f,#0f0e0b);border:1px solid var(--edge)}
.titlebar{flex:none;height:46px;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#1d1a15,#15130f)}
.titlebar h1{font-size:18px;font-weight:700;color:var(--gold-bright);display:flex;align-items:center;gap:8px;white-space:nowrap}
.titlebar h1 .gi{width:20px;height:20px;color:var(--gold)}
.titlebar .who{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.titlebar .grow{flex:1}
.xbtn{width:38px;height:34px;display:grid;place-items:center}
.main{flex:1;min-height:0;display:flex}
.footer{flex:none;height:54px;display:flex;align-items:center;gap:8px;padding:0 12px;border-top:1px solid var(--border);background:#12100d}
.footer .status{flex:1;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;min-width:0}
.footer .status b{color:var(--gold-bright);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none;box-shadow:0 0 8px var(--gold)}
.btn{min-height:40px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:13px;background:linear-gradient(180deg,#2a2620,#1e1b16);border-color:var(--edge)}
.btn.primary{background:linear-gradient(180deg,#a47232,#7a5226);border-color:var(--gold-deep);color:#fff1d2}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#b5813b,#8a5e2d)}
.btn.small{min-height:32px;padding:0 11px;font-size:12px}
.btn.ghost{background:transparent;border-color:var(--border)}
.btn .gi{width:15px;height:15px}

/* ---------------------------------------------------------------- navigation */
.nav{flex:none;display:flex;gap:4px;padding:8px;background:#0e0d0a;border-right:1px solid var(--border);width:136px;flex-direction:column;overflow:auto}
.tab{position:relative;display:flex;align-items:center;gap:9px;min-height:46px;padding:0 10px;text-align:left;font-weight:600;color:var(--muted);background:var(--panel);border-color:var(--border)}
.tab .gi{width:20px;height:20px}
.tab small{display:block;font-weight:400;font-size:10.5px;color:var(--faint);line-height:1.2}
.tab .lbl{display:flex;flex-direction:column;min-width:0}
.tab.on{color:var(--gold-bright);background:linear-gradient(90deg,var(--sel),#1f1a12);border-color:var(--gold-deep)}
.tab.on::before{content:"";position:absolute;left:-1px;top:6px;bottom:6px;width:3px;background:var(--gold)}
.tab.on small{color:var(--gold-deep)}
.newdot{position:absolute;right:8px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.tab.pulse{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 2px #d3af7255,0 0 14px #d3af7266}}
.page{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.scroll{overflow-y:auto;overflow-x:hidden;min-height:0;scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
.pad{padding:12px 14px 16px}

/* portrait: the five tabs become a top strip */
@container scr (max-width:700px){
  .main{flex-direction:column}
  .nav{width:auto;flex-direction:row;border-right:0;border-bottom:1px solid var(--border);padding:6px;gap:4px}
  .tab{flex:1;min-width:0;min-height:52px;flex-direction:column;justify-content:center;gap:2px;padding:4px 2px;text-align:center;font-size:12px}
  .tab small{display:none}
  .tab .gi{width:19px;height:19px}
  .tab.on::before{left:6px;right:6px;top:auto;bottom:-1px;width:auto;height:3px}
  .newdot{right:6px;top:6px}
  .titlebar .who{display:none}
}

/* ---------------------------------------------------------------- shared parts */
.eyebrow{font:600 10.5px Baskerville,Georgia,serif;letter-spacing:2.4px;color:var(--gold);text-transform:uppercase}
.sec{margin:0 0 16px}
.sec>h2{font-size:15px;font-weight:700;color:var(--gold-bright);display:flex;align-items:baseline;gap:8px;margin:0 0 3px}
.sec>h2 .n{font-size:11px;font-weight:500;color:var(--muted)}
.sec>.hint{font-size:12px;color:var(--muted);margin:0 0 8px}
.card{position:relative;background:linear-gradient(180deg,var(--raised),var(--panel));border:1px solid var(--border);padding:11px 12px}
.card.sel{border-color:var(--gold);background:linear-gradient(180deg,#352a1a,#241d13)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;line-height:1.4;padding:1px 8px;border:1px solid #8a6b3c66;color:var(--gold);background:#2a21124d;white-space:nowrap}
.chip.ok{color:var(--success);border-color:#8fc07a55;background:#1f2d1a55}
.chip.warn{color:var(--danger);border-color:#df927b55;background:#2d1a1555}
.chip.quiet{color:var(--muted);border-color:var(--border);background:transparent}
.bar{height:6px;background:var(--inset);border:1px solid var(--border);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-deep),var(--gold))}
.pips{display:flex;gap:2px}.pips i{width:12px;height:5px;background:var(--inset);border:1px solid var(--border)}.pips i.f{background:var(--gold);border-color:var(--gold)}

/* judgment card: the one pattern every setting uses (question -> current answer -> tap to change) */
.jc{width:100%;display:flex;align-items:center;gap:11px;text-align:left;padding:10px 12px;min-height:60px;background:linear-gradient(180deg,var(--raised),var(--panel))}
.jc .ico{flex:none;width:36px;height:36px;display:grid;place-items:center;background:var(--inset);border:1px solid var(--border);color:var(--gold)}
.jc .ico .gi{width:20px;height:20px}
.jc .tx{flex:1;min-width:0}
.jc .q{font-size:11px;color:var(--muted);letter-spacing:.2px}
.jc .a{font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.jc .d{font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.jc .go{flex:none;color:var(--faint);font-size:20px;line-height:1}
.jc.changed{border-left:3px solid var(--gold)}
.jc.focus{animation:ring 1.4s ease-in-out infinite;border-color:var(--gold)}
@keyframes ring{50%{box-shadow:0 0 0 3px #d3af7266,0 0 18px #d3af7255}}
.stack{display:flex;flex-direction:column;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@container scr (max-width:700px){.grid2.stackp{grid-template-columns:1fr}}

/* ---------------------------------------------------------------- overview */
.ov{flex:1;min-height:0;display:flex}
.ov>.col{min-width:0;min-height:0;flex:1}
.ov>.col+.col{border-left:1px solid var(--border)}
@container scr (max-width:700px){.ov{flex-direction:column;overflow-y:auto}.ov>.col{flex:none;overflow:visible!important}.ov>.col+.col{border-left:0}}
.hero{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.hero .seal{flex:none;width:52px;height:52px;display:grid;place-items:center;border:1px solid var(--edge);background:radial-gradient(circle,#3b2d18,#14100a);color:var(--gold-bright);border-radius:50%;box-shadow:0 0 14px #d3af7233}
.hero .seal .gi{width:28px;height:28px}
.hero h2{font-size:16px;color:var(--gold-bright)}
.hero p{font-size:12px;color:var(--muted)}
.summary{padding:0;overflow:hidden}
.summary .row{display:flex;gap:10px;padding:8px 12px;align-items:flex-start;border-top:1px solid var(--border)}
.summary .row:first-child{border-top:0}
.summary .row .gi{color:var(--gold);margin-top:2px}
.summary .row b{display:block;font-size:11px;color:var(--muted);font-weight:500}
.summary .row span{font-size:13px;color:var(--text)}
.summary .head{padding:9px 12px;background:#1c1710;font-size:12px;color:var(--gold)}
.style{display:flex;flex-direction:column;gap:4px;text-align:left;padding:10px 12px;min-height:84px}
.style .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.style .ds{font-size:11.5px;color:var(--muted);line-height:1.35}
.style.sel .nm{color:var(--gold-bright)}
.meters{display:flex;gap:14px;margin-top:2px;font-size:10.5px;color:var(--muted);align-items:center}
.meters span{display:flex;align-items:center;gap:5px}
.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@container scr (max-width:700px){.styles{grid-template-columns:1fr}.style{min-height:0}}
@container scr (min-width:700px) and (max-width:1100px){.styles{grid-template-columns:1fr}.style{min-height:0}}
.ovwrap{flex:1;min-height:0;display:flex;flex-direction:column}
.unlock{flex:none;display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--gold-deep);background:linear-gradient(90deg,#3a2d1a,#241c11);box-shadow:inset 0 -1px #d3af7233}
.unlock .tx{flex:1;min-width:0}
.unlock h3{font-size:13.5px;color:var(--gold-bright)}
.unlock p{font-size:12px;color:#d8ccb4;line-height:1.35}
.unlock .acts{display:flex;gap:6px;flex:none}
@container scr (max-width:700px){.unlock{flex-wrap:wrap}.unlock .acts{width:100%}.unlock .acts .btn{flex:1}}
.next{display:flex;gap:11px;align-items:center;border-style:dashed;background:transparent}
.next .gi{width:26px;height:26px;color:var(--faint)}
.next b{font-size:13px}.next small{display:block;font-size:11.5px;color:var(--muted)}
.advice{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px 12px;width:100%}
.advice .fact{font-size:12px;color:var(--muted)}
.advice .do{font-size:13px;font-weight:700;color:var(--gold-bright);display:flex;align-items:center;gap:6px}
.advice .why{font-size:11.5px;color:var(--muted)}
.slots{display:flex;gap:6px}
.slot{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;background:linear-gradient(180deg,var(--raised),var(--panel))}
.slot img,.slot .em{width:42px;height:42px;border:1px solid var(--edge);background:var(--inset);display:grid;place-items:center;color:var(--faint);font-size:11px}
.slot .nm{font-size:11px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .po{font-size:10px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.lock{opacity:.55}
.autos{display:flex;flex-direction:column}
.autos button{display:flex;align-items:center;gap:10px;padding:8px 12px;text-align:left;min-height:44px}
.autos button+button{margin-top:-1px}
.autos .gi{color:var(--gold)}
.autos .t{flex:1;font-size:13px;font-weight:600}
.autos .s{font-size:11.5px;color:var(--muted)}

/* ---------------------------------------------------------------- combat / auto pages */
.seg{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.seg button{min-height:34px;padding:0 13px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--panel)}
.seg button.on{color:var(--gold-bright);background:var(--sel);border-color:var(--gold-deep)}
.seg .newdot{position:static;display:inline-block;margin-left:7px;vertical-align:middle}
.sl{display:flex;align-items:center;gap:10px;margin-top:8px}
.sl input[type=range]{flex:1;accent-color:var(--gold);height:28px}
.sl output{min-width:48px;text-align:right;font-weight:700;color:var(--gold-bright)}
.advanced{display:flex;align-items:center;gap:10px;padding:10px 12px;width:100%;text-align:left;border-style:dashed;background:transparent}
.advanced .gi{color:var(--gold)}

/* ---------------------------------------------------------------- skills */
.sk{flex:1;min-height:0;display:flex;position:relative}
.sk .treewrap{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--border)}
.sk .side{flex:none;width:300px;display:flex;flex-direction:column;min-height:0}
@container scr (min-width:1200px){.sk .side{width:380px}}
@container scr (max-width:700px){.sk{flex-direction:column}.sk .treewrap{border-right:0;border-bottom:1px solid var(--border);flex:1 1 0}.sk .side{width:auto;flex:1 1 0}}
.pts{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);background:#14110d;flex:none}
.pts .gem{width:30px;height:30px;display:grid;place-items:center;background:radial-gradient(circle,#4a3519,#1a130a);border:1px solid var(--gold-deep);border-radius:50%;font-weight:700;color:var(--gold-bright);font-size:14px}
.pts .l{font-size:12px;color:var(--muted);line-height:1.25}.pts .l b{color:var(--text);font-size:13px}
.tree{position:relative;transform-origin:0 0}
.tree svg{position:absolute;left:0;top:0;pointer-events:none}
.nd{position:absolute;width:56px;height:56px;padding:0;border-radius:50%;border:2px solid var(--edge);background:var(--inset);overflow:visible;transform:translate(-50%,-50%)}
.nd img{width:100%;height:100%;border-radius:50%;display:block}
.nd.passive{border-radius:12px}.nd.passive img{border-radius:10px}
.nd.lock img{filter:grayscale(1) brightness(.4)}
.nd.lock{border-color:var(--border)}
.nd.can{border-color:var(--gold-deep)}
.nd.has{border-color:var(--gold)}
.nd.sel{box-shadow:0 0 0 3px #d3af7299,0 0 20px #d3af7266}
.nd.eq::after{content:"";position:absolute;right:-4px;top:-4px;width:14px;height:14px;background:var(--gold);border:2px solid var(--void);border-radius:50%}
.nd .rk{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);font-size:10px;line-height:1;padding:2px 5px;background:#0c0b0a;border:1px solid var(--edge);color:var(--gold-bright);white-space:nowrap}
.nd .lv{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);font-size:10px;line-height:1;padding:2px 5px;background:#0c0b0a;border:1px solid var(--border);color:var(--faint);white-space:nowrap}
.band{position:absolute;left:0;right:0;font-size:11px;color:var(--gold-deep);letter-spacing:1.5px;border-top:1px dashed #5e4f3a66;padding-top:2px;pointer-events:none}
.bh{position:absolute;font-size:12px;font-weight:700;color:var(--gold);text-align:center;transform:translateX(-50%);white-space:nowrap}
.detail{padding:12px 14px}
.detail .hd{display:flex;gap:11px;align-items:center;margin-bottom:8px}
.detail .hd img{width:54px;height:54px;border:2px solid var(--edge);border-radius:50%}
.detail .hd.passive img{border-radius:12px}
.detail h3{font-size:16px;color:var(--gold-bright)}
.detail .meta{font-size:11.5px;color:var(--muted)}
.detail .ds{font-size:12.5px;color:#d8ccb4;margin:6px 0 10px;line-height:1.5}
.rankbar{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.rankbar .sq{width:38px;height:38px;font-size:18px}
.rankbar .v{flex:1;text-align:center;font-weight:700}
.eqbar{flex:none;border-top:1px solid var(--border);padding:8px 10px;background:#12100d}
.eqbar h4{font-size:11px;color:var(--muted);font-weight:500;margin-bottom:6px;display:flex;justify-content:space-between}
.eqrow{display:flex;gap:6px}
.eqs{flex:1;aspect-ratio:1;max-width:58px;position:relative;display:grid;place-items:center;background:var(--inset);border:1px solid var(--edge);color:var(--faint);font-size:12px}
.eqs img{width:100%;height:100%;display:block}
.eqs.ult{border-color:var(--gold-deep);margin-left:auto}
.eqs.tgt{border-color:var(--gold);box-shadow:0 0 0 2px #d3af7288}
.eqs small{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:9px;color:var(--faint)}
.steps{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border);background:#1b150d;flex:none;align-items:center;font-size:12px;overflow:hidden}
.steps .st{display:flex;align-items:center;gap:6px;color:var(--faint);white-space:nowrap}
.steps .st i{width:20px;height:20px;border-radius:50%;border:1px solid var(--edge);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700}
.steps .st.on{color:var(--gold-bright)}.steps .st.on i{background:var(--gold);color:#1a1208;border-color:var(--gold)}
.steps .st.done{color:var(--success)}.steps .st.done i{border-color:var(--success);color:var(--success)}
.steps .ar{color:var(--faint)}

/* ---------------------------------------------------------------- presets */
.pslot{display:flex;align-items:center;gap:10px;padding:9px 12px}
.pslot .no{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--edge);background:var(--inset);font-weight:700;color:var(--gold)}
.pslot .tx{flex:1;min-width:0}.pslot .tx b{display:block;font-size:13.5px}.pslot .tx small{font-size:11.5px;color:var(--muted)}

/* ---------------------------------------------------------------- sheet (preset picker) */
#overlay{position:absolute;inset:0;pointer-events:none}
#overlay>*{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(5,4,3,.72);animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 24px));max-height:calc(100% - 20px);display:flex;flex-direction:column;background:linear-gradient(180deg,#1c1913,#13110d);border:1px solid var(--edge);box-shadow:0 20px 60px #000d;animation:pop .16s}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}}
@container scr (max-width:700px){.sheet{top:auto;bottom:0;transform:translateX(-50%);width:100%;max-height:86%;animation:rise .2s}@keyframes rise{from{transform:translate(-50%,40px);opacity:0}}}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)}
.sheet .sh .gi{width:22px;height:22px;color:var(--gold)}
.sheet .sh h3{font-size:15px;color:var(--gold-bright)}.sheet .sh small{display:block;color:var(--muted);font-size:11.5px}
.sheet .sb{padding:10px 12px;overflow:auto;min-height:0}
.sheet .sf{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--border);background:#100e0b}
.sheet .sf .status{flex:1;font-size:12px;color:var(--muted)}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;padding:11px 12px}
.opt .rd{flex:none;width:20px;height:20px;border:2px solid var(--edge);border-radius:50%;margin-top:1px;display:grid;place-items:center}
.opt.sel .rd{border-color:var(--gold)}.opt.sel .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold)}
.opt .tx b{display:block;font-size:14px}.opt .tx span{font-size:12px;color:var(--muted);line-height:1.4}
.opt.custom{border-style:dashed;background:transparent}
.tg{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--border);font-size:13px}
.tg:first-child{border-top:0}.tg .t{flex:1}
.sw{position:relative;width:42px;height:24px;border:1px solid var(--edge);background:var(--inset);border-radius:12px;padding:0}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:.15s}
.sw.on{background:#4b3a1b;border-color:var(--gold)}.sw.on::after{left:20px;background:var(--gold-bright)}

/* ---------------------------------------------------------------- tutorial coach layer */
.blk{position:absolute;background:rgba(4,3,2,.78);z-index:50}
.hole{position:absolute;z-index:51;border:2px solid var(--gold);box-shadow:0 0 0 3px #d3af7255,0 0 24px #d3af7288;pointer-events:none!important;animation:ring 1.4s ease-in-out infinite}
.coach{position:absolute;z-index:52;max-width:min(340px,calc(100% - 20px));display:flex;gap:10px;padding:10px 12px;background:linear-gradient(180deg,#2b2214,#1a140b);border:1px solid var(--gold);box-shadow:0 8px 30px #000b;pointer-events:auto}
.coach .halo{flex:none;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#fff6d8 0,#e9c777 38%,#6b4a1b 70%,transparent 72%);box-shadow:0 0 18px #f2d9a4aa}
.coach .nm{font-size:10.5px;letter-spacing:1.6px;color:var(--gold);margin-bottom:2px}
.coach .tx{font-size:13px;line-height:1.45;color:var(--text)}
.coach .sub{font-size:11px;color:var(--muted);margin-top:4px}
#toast{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);z-index:80;padding:8px 16px;background:#2b2214;border:1px solid var(--gold);color:var(--gold-bright);font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}

@container scr (min-width:700px){.stack.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px}.stack.cards .card:not(.jc){grid-column:1/-1}}
.tab small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>

<main id="stage"><div id="device"><div id="screen"><div id="app"></div><div id="overlay"></div><div id="toast" role="status" aria-live="polite"></div></div></div></main>
<footer id="foot"></footer>
<script>window.DATA={"branches":[{"ko":"회전과 출혈","en":"Whirlwind & blood"},{"ko":"돌파와 제압","en":"Impact & control"},{"ko":"수호와 함성","en":"Guard & warcry"}],"phases":[{"from":1,"to":9,"name":{"ko":"전투의 기초","en":"Foundations"},"note":{"ko":"핵심 공격과 첫 연계","en":"Core attacks and first synergies"}},{"from":10,"to":19,"name":{"ko":"생존과 운용","en":"Survival"},"note":{"ko":"이동 · 방어 · 자원 관리","en":"Movement, defence and resource control"}},{"from":20,"to":29,"name":{"ko":"전투 방식 확립","en":"Specialisation"},"note":{"ko":"상태 부여 후 연계와 회수","en":"Apply conditions, then combine and recover"}},{"from":30,"to":39,"name":{"ko":"빌드의 완성","en":"Mastery"},"note":{"ko":"복합 연계와 강화 패시브","en":"Advanced combinations and supporting passives"}},{"from":40,"to":40,"name":{"ko":"궁극의 선택","en":"Ascendancy"},"note":{"ko":"궁극기 1개와 최종 패시브","en":"One equipped ultimate and its final passive"}}],"presets":{"position.engage":[{"id":"balanced","ko":"가까운 적과 균형 전투","en":"Balanced engagement","dko":"적에게 접근한 뒤 2m 거리를 기준으로 선회합니다.","den":"Approach enemies, then orbit at a preferred distance of 2 m."},{"id":"close","ko":"중앙 돌파","en":"Push into the pack","dko":"적 무리의 중심을 향해 접근합니다. 근접 광역 공격에 맞는 배치입니다.","den":"Close in toward the pack center for melee area attacks."},{"id":"ranged","ko":"안전 거리 유지","en":"Keep your distance","dko":"기본 공격 사거리를 기준으로 적과 거리를 유지합니다.","den":"Keep enemies at your basic attack range."},{"id":"mobile-crossfire","ko":"사선 선회","en":"Orbit for crossfire","dko":"대상과 4m 거리를 두고 선회하여 쇠뇌의 교차각과 잔상 이동을 만듭니다. 잔상 행군·교차 쇠뇌에 권장합니다.","den":"Orbit at 4m to create ballista crossfire angles and afterimage movement. Recommended for Afterimage March and Crossfire Ballista."}],"position.surrounded":[{"id":"hold","ko":"현재 무리와 전투","en":"Fight the current pack","dko":"추가로 적을 모으지 않고 현재 위치에서 전투를 이어 갑니다.","den":"Fight the current pack without gathering more enemies."},{"id":"escape","ko":"포위되면 이탈","en":"Escape encirclement","dko":"포위되면 이탈을 시도하고 추가 적을 유인하지 않습니다.","den":"Attempt to escape when surrounded without drawing in more enemies."},{"id":"gather","ko":"세 마리씩 몰이","en":"Gather small packs","dko":"최대 5초 동안 적 세 마리를 모으고 포위되면 외곽으로 이동합니다.","den":"Gather three enemies for up to 5 seconds; move to the edge if surrounded."}],"target.default":[{"id":"nearest","ko":"가까운 적부터","en":"Nearest enemy first","dko":"가까운 적부터 공격하고 보스전에서는 보스를 우선합니다.","den":"Attack the nearest enemy; prioritize the boss in boss fights."},{"id":"priority","ko":"위험한 적 우선","en":"Dangerous enemies first","dko":"지원형·원거리 적을 우선하고 위험한 시전을 방해합니다.","den":"Prioritize support and ranged enemies and interrupt dangerous casts."},{"id":"pack","ko":"밀집 무리 정리","en":"Clear dense packs","dko":"밀집한 적을 먼저 노리고 보스전에서는 주변 적부터 처리합니다.","den":"Target dense packs and clear adds first during boss fights."}],"target.switch":[{"id":"balanced","ko":"일반 추적","en":"Balanced pursuit","dko":"우선순위에 따라 대상을 바꾸며 최대 30m·20초까지 추적합니다.","den":"Follow target priority and pursue for up to 30 m or 20 seconds."},{"id":"short","ko":"짧게 추적","en":"Short pursuit","dko":"적을 10m·5초까지만 추적하고 시야에서 사라지면 중단합니다.","den":"Pursue for up to 10 m or 5 seconds; stop when the target leaves sight."},{"id":"finish","ko":"한 대상 마무리","en":"Finish one target","dko":"대상이 쓰러질 때까지 유지하고 고블린은 최대 40m·30초까지 추적합니다.","den":"Keep attacking until the target dies; pursue goblins for up to 40 m or 30 seconds."}],"common.order":[{"id":"survival","ko":"생존 후 전투","en":"Survive, then fight","dko":"긴급 생존과 회피를 가장 먼저 검토합니다.","den":"Check emergency survival and dodging before other actions."},{"id":"combat","ko":"전투 후 회수","en":"Fight, then collect","dko":"생존·회피 다음에 공격을 검토하고 전리품은 그 뒤에 회수합니다.","den":"After survival and dodging, attack before collecting loot."},{"id":"recovery","ko":"회수 먼저 정리","en":"Collect before advancing","dko":"생존·회피 다음에 회수 행동을 검토하고 남은 적을 공격합니다.","den":"After survival and dodging, consider collection before attacking remaining enemies."}],"survival.lowHp":[{"id":"careful","ko":"생존 우선","en":"Survival first","dko":"HP 45%에서 후퇴하고 75%까지 회복한 뒤 복귀합니다. 치명적 피해와 지속 피해에도 대응합니다.","den":"Retreat at 45% HP and return at 75%; respond to lethal and ongoing damage."},{"id":"balanced","ko":"균형 생존","en":"Balanced survival","dko":"HP 30%에서 후퇴하고 55%에서 복귀합니다. 치명적 피해를 피합니다.","den":"Retreat at 30% HP and return at 55%; react to lethal damage."},{"id":"emergency","ko":"위급할 때만 후퇴","en":"Emergency retreat","dko":"HP 20% 이하나 치명적 위험에만 대응하고 40%에서 복귀합니다.","den":"React at 20% HP or to lethal danger; return at 40% HP."}],"survival.potion":[{"id":"balanced","ko":"균형 보급","en":"Balanced supplies","dko":"HP 40%·자원 30%에서 물약을 사용합니다. 성소에서 방문당 500금화까지 보충합니다.","den":"Use potions at 40% HP or 30% resource. Restock up to 500 gold per sanctuary visit."},{"id":"careful","ko":"넉넉한 생존 보급","en":"Extra survival supplies","dko":"HP 60%·자원 45%에서 사용합니다. 목표 수량을 채운 뒤 출정하며 구매 후 500금화를 남깁니다.","den":"Use at 60% HP or 45% resource. Wait for target stocks before departure and retain 500 gold."},{"id":"frugal","ko":"물약 절약","en":"Conserve potions","dko":"HP 25%·자원 15%에서 사용하고 자동 구매를 끕니다. HP 물약이 없으면 대기합니다.","den":"Use at 25% HP or 15% resource without automatic purchases; wait if HP potions run out."}],"dodge.ground.policy":[{"id":"all","ko":"모든 예고 회피","en":"Avoid all warnings","dko":"지속 장판·범위 공격·직접 타격의 회피를 항상 시도합니다.","den":"Always attempt to evade ground, area and direct attacks."},{"id":"balanced","ko":"큰 피해 위주 회피","en":"Avoid heavy damage","dko":"예상 HP 손실이 10% 이상인 공격을 회피합니다.","den":"Evade attacks expected to remove at least 10% of maximum HP."},{"id":"attack","ko":"공격 유지 우선","en":"Maintain attacks","dko":"장판은 피하고 범위·직접 공격은 예상 HP 손실 25%부터 피합니다.","den":"Always evade ground hazards; evade area and direct attacks from 25% expected HP loss."}],"dodge.control":[{"id":"careful","ko":"제어와 중첩 피해 회피","en":"Avoid control and overlapping damage","dko":"기절·빙결·속박·끌어당김과 1초 내 합산 피해 15%에 대응합니다. 필요하면 공격을 취소합니다.","den":"React to control effects and 15% combined damage within 1 second; cancel interruptible attacks."},{"id":"balanced","ko":"걷기 우선 회피","en":"Walk away first","dko":"걷기로 위험을 피하고 기절·빙결과 합산 피해 25%에 대응합니다.","den":"Prefer walking; react to stun, freeze and 25% combined damage."},{"id":"finish","ko":"현재 공격 마무리","en":"Finish the current attack","dko":"공격을 마친 뒤 걷기로 회피합니다. 합산 피해 기준은 40%입니다.","den":"Finish the current attack before walking away; use a 40% combined damage threshold."}],"survival.defenseSkill":[{"id":"walk","ko":"보행 후퇴","en":"Retreat on foot","dko":"지정 스킬 없이 보행 후퇴를 우선합니다.","den":"Prioritize walking away without assigning a survival skill."},{"id":"defend","ko":"방어 후 이탈","en":"Defend, then escape","dko":"장착한 생존기를 지정해 방어 후 이탈합니다. 사용할 수 없으면 걷기로 후퇴합니다.","den":"Assign equipped survival skills, defend, then escape; walk if skills are unavailable."},{"id":"escape","ko":"이탈기 우선","en":"Escape skill first","dko":"장착한 회피기를 우선하고 이탈용 자원을 남깁니다. 회피기가 없으면 걷기로 후퇴합니다.","den":"Prioritize an equipped escape skill and reserve its resource; walk if none is available."}],"loot.NORMAL":[{"id":"all","ko":"전투 후 모두 회수","en":"Collect all after combat","dko":"모든 등급의 장비를 전투가 끝난 뒤 회수합니다.","den":"Collect equipment of every rarity after combat."},{"id":"rare","ko":"희귀 이상 회수","en":"Rare and better","dko":"일반·마법 장비는 두고 희귀 이상만 전투 후 회수합니다.","den":"Leave normal and magic equipment; collect rare and better items after combat."},{"id":"legendary","ko":"전설·세트 집중","en":"Focus on legendary and set items","dko":"희귀 이하 장비는 두고 전설·세트 장비만 우선 회수합니다.","den":"Leave lower rarities and prioritize legendary and set items."}],"loot.class":[{"id":"all","ko":"모든 장비 확인","en":"Consider all equipment","dko":"직업과 부위를 가리지 않고 레벨 1 이상 장비를 검토합니다.","den":"Consider all classes and slots from item level 1."},{"id":"own","ko":"내 직업 중심","en":"My class first","dko":"내 직업 장비를 검토하되 전설·세트는 직업 필터의 예외로 둡니다.","den":"Filter for your class, with exceptions for legendary and set items."},{"id":"weapons","ko":"무기 성장 집중","en":"Focus on weapons","dko":"무기만 검토하되 전설·세트는 부위 필터의 예외로 둡니다.","den":"Consider weapons, with slot-filter exceptions for legendary and set items."}],"loot.gold":[{"id":"balanced","ko":"이동과 회수 균형","en":"Balanced collection","dko":"금화는 지나가며, 재료·보석·코어는 전투 후 회수합니다.","den":"Collect gold on your path and materials, gems and cores after combat."},{"id":"all","ko":"자원 우선 회수","en":"Prioritize resources","dko":"금화·재료·보석·코어를 모두 우선 회수합니다.","den":"Prioritize collecting gold, materials, gems and cores."},{"id":"path","ko":"가는 길에서만","en":"Collect along the way","dko":"자원을 향한 우회보다 진행을 우선하고 지나가는 경로에서 회수합니다.","den":"Collect resources along your route instead of taking detours."}],"loot.distance":[{"id":"balanced","ko":"전투 후 안전 회수","en":"Safe collection","dko":"최대 20m까지 회수하고 위험이 해소되기를 기다립니다. 종료 전 남은 전리품을 확인합니다.","den":"Collect within 20 m after danger clears and check remaining loot before leaving."},{"id":"near","ko":"가까운 것만 빠르게","en":"Nearby loot only","dko":"8m 안에서 안전한 경로로 회수하고 종료 시 남은 전리품은 두고 갑니다.","den":"Collect within 8 m along safe paths; leave remaining loot when finishing."},{"id":"thorough","ko":"남김없이 회수","en":"Thorough collection","dko":"40m 안의 전리품을 위험이 해소된 뒤 회수하고 종료 전에도 확인합니다.","den":"Wait for safety and collect loot within 40 m, including a final check before leaving."}],"bag.trigger":[{"id":"full","ko":"가득 차면 귀환","en":"Return when full","dko":"가방이 가득 차면 정리를 위해 귀환합니다.","den":"Return to tidy your bag when it is full."},{"id":"early","ko":"미리 공간 확보","en":"Make room early","dko":"빈칸이 다섯 개 이하가 되면 정리를 위해 귀환합니다.","den":"Return to tidy your bag when five or fewer slots remain."},{"id":"replace","ko":"가치 높은 장비로 교체","en":"Replace lower-value items","dko":"가방이 차면 등급·레벨·가격으로 가치를 비교해 교체합니다. 불가능하면 귀환합니다.","den":"When full, replace items by rarity, level and price; return if no replacement is possible."}],"bag.cleanupAt":[{"id":"keep","ko":"모두 보관","en":"Keep everything","dko":"자동 판매·분해 없이 장비를 가방에 보관합니다.","den":"Keep equipment in your bag without automatic selling or salvaging."},{"id":"sell","ko":"일반·마법 장비 판매","en":"Sell normal and magic items","dko":"균열 종료 후 일반·마법 장비만 판매합니다. 희귀·전설·세트는 보관합니다.","den":"After each rift, sell normal and magic items; keep rare, legendary and set items."},{"id":"salvage","ko":"일반·마법 장비 분해","en":"Salvage normal and magic items","dko":"균열 종료 후 일반·마법 장비만 분해합니다. 희귀·전설·세트는 보관합니다.","den":"After each rift, salvage normal and magic items; keep rare, legendary and set items."}],"bag.protectEnhanced":[{"id":"invested","ko":"투자한 장비 보호","en":"Protect invested equipment","dko":"강화하거나 보석을 장착한 장비를 자동 정리에서 보호합니다.","den":"Protect enhanced and socketed equipment from automatic cleanup."},{"id":"all","ko":"전설·세트까지 보호","en":"Protect effects and sets too","dko":"투자 장비와 지정 가능한 모든 전설 효과·세트를 보호합니다.","den":"Protect invested equipment and all selectable legendary effects and sets."},{"id":"base","ko":"기본 보호만 적용","en":"Use base protections","dko":"추가 보호 필터를 끕니다. 잠금·장착 등 서비스의 기본 보호는 유지됩니다.","den":"Disable additional filters; service protections such as locked and equipped items still apply."}],"bag.warehouseFull":[{"id":"keep","ko":"보관 후 중단","en":"Keep items and stop","dko":"창고가 차면 가방에 보관하고 공간이 부족하면 반복을 중단합니다.","den":"Keep items in the bag if storage is full and stop repeating when space is insufficient."},{"id":"stop","ko":"정리 화면에서 대기","en":"Wait for manual cleanup","dko":"창고나 가방 공간이 부족하면 반복을 중단하고 정리를 기다립니다.","den":"Stop repeating and wait for cleanup when storage or bag space is insufficient."},{"id":"limited","ko":"획득을 줄이고 계속","en":"Continue with limited loot","dko":"창고가 차면 가방에 보관하고 정리 후에도 부족하면 획득을 제한해 계속합니다.","den":"Keep items in the bag if storage is full; continue with limited loot if cleanup leaves too little space."}],"explore.mode":[{"id":"balanced","ko":"오른쪽 벽 따라 탐색","en":"Follow the right wall","dko":"오른쪽 벽을 따라 탐색하고 현재 전투·회수를 마친 뒤 보스로 이동합니다.","den":"Follow the right wall, then finish current combat and collection before heading to the boss."},{"id":"rush","ko":"보스 빠르게 진행","en":"Rush the boss","dko":"감지한 적을 찾아 진행하고 보스가 열리면 바로 향합니다. 45초 이하에서는 우회를 줄입니다.","den":"Advance toward detected enemies and head straight to the unlocked boss; reduce detours below 45 seconds."},{"id":"thorough","ko":"구석까지 탐색","en":"Explore thoroughly","dko":"가까운 미탐색 지역과 상자를 우선하고 보스가 열려도 추가로 탐색합니다.","den":"Prioritize nearby unexplored areas and chests; continue exploring after the boss unlocks."}],"explore.chests":[{"id":"path","ko":"이동 경로에서 개봉","en":"Open chests on the way","dko":"일반·봉인 상자를 경로에서 열고 최대 12m까지 우회합니다.","den":"Open normal and sealed chests along the route, with detours up to 12 m."},{"id":"all","ko":"상자 우선 탐색","en":"Prioritize chests","dko":"일반·봉인 상자를 우선 개봉하고 보스 처치 후에도 최대 25m까지 확인합니다.","den":"Prioritize normal and sealed chests, including after the boss, with detours up to 25 m."},{"id":"skip","ko":"상자 우회 생략","en":"Skip chest detours","dko":"일반·봉인 상자 이용을 끄고 진행에 집중합니다.","den":"Disable normal and sealed chest collection to focus on progress."}],"explore.cursedChest":[{"id":"skip","ko":"저주 상자 피하기","en":"Avoid cursed chests","dko":"저주 상자를 열지 않습니다.","den":"Do not open cursed chests."},{"id":"safe","ko":"여유 있을 때 도전","en":"Attempt with a safety margin","dko":"HP 85% 이상이고 120초 이상 남았을 때만 도전합니다. 장착한 생존기도 확인합니다.","den":"Attempt only with at least 85% HP and 120 seconds remaining; check an equipped survival skill."},{"id":"after","ko":"전투 후 도전","en":"Attempt after combat","dko":"현재 전투를 마친 뒤 저주 상자를 개봉합니다.","den":"Open cursed chests after finishing the current fight."}],"explore.shrine":[{"id":"found","ko":"발견한 성소 이용","en":"Use discovered shrines","dko":"발견한 성소를 이용하며 최대 12m까지 우회합니다.","den":"Use discovered shrines with detours up to 12 m."},{"id":"needed","ko":"필요할 때만 이용","en":"Use shrines when needed","dko":"필요한 효과의 성소만 최대 8m까지 우회해 이용합니다.","den":"Use shrines with needed effects, taking detours of up to 8 m."},{"id":"skip","ko":"성소 우회 생략","en":"Skip shrines","dko":"성소 이용을 끄고 탐색과 전투에 집중합니다.","den":"Skip shrines to focus on exploration and combat."}],"repeat.enabled":[{"id":"once","ko":"한 판씩 플레이","en":"One run at a time","dko":"자동 반복을 끄고 한 판씩 직접 시작합니다.","den":"Disable automatic repetition and start each run yourself."},{"id":"farm","ko":"같은 단계 반복","en":"Repeat the same stage","dko":"성공하면 같은 단계를 반복하고 실패하면 중단합니다.","den":"Repeat the same stage on success and stop on failure."},{ trong targets","dko":"정예 또는 보스 방향을 우선하여 관통 사격을 사용합니다.","den":"Prioritise an elite or boss when aiming the piercing shot."}],"skill/A02":[{"id":"pack","ko":"무리 정리","en":"Clear a pack","dko":"부채꼴 범위에 여러 적이 들어오는 방향으로 사격합니다.","den":"Fire toward several enemies within the fan-shaped attack area."},{"id":"safe","ko":"먼 거리 사격","en":"Long-range fire","dko":"적과 거리를 벌리며 다중 사격을 사용합니다.","den":"Gain distance while using multi-shot."}],"skill/A03":[{"id":"pack","ko":"무리 중심 설치","en":"Place in the pack","dko":"적 무리가 모인 중심에 맹독 덫을 설치합니다.","den":"Place a poison trap in the centre of a group."},{"id":"renew","ko":"대상 발밑 설치","en":"Place under the target","dko":"현재 대상의 위치에 고정 덫을 설치합니다. 덫은 대상을 따라가지 않습니다.","den":"Place a stationary trap at the target position. The trap does not follow its target."},{"id":"defend","ko":"추격 경로에 설치","en":"Place along the approach","dko":"관찰한 적의 접근 경로에 덫을 설치합니다.","den":"Place a trap along the observed enemy approach path."}],"skill/A04":[{"id":"safe","ko":"안전 거리 복구","en":"Restore safe distance","dko":"접근한 적에게서 안전한 방향으로 후퇴합니다.","den":"Retreat in a safe direction from approaching enemies."},{"id":"trap-retreat","ko":"기존 덫 방향으로 후퇴","en":"Retreat toward an existing trap","dko":"이미 설치한 맹독 덫 방향으로 후퇴합니다. 전용 장비는 필요하지 않습니다.","den":"Retreat toward an already placed poison trap. No special equipment is required."},{"id":"escape","ko":"긴급 이탈용 보존","en":"Reserve for escape","dko":"평소에는 보존하고 전역 생존 조건을 만족할 때 이탈합니다.","den":"Reserve it until the global survival condition calls for an escape."}],"skill/A05":[{"id":"elite","ko":"강적 표식 유지","en":"Maintain a strong-target mark","dko":"정예 또는 보스에게 표식을 유지합니다. 재부여에는 실제 쿨타임이 적용됩니다.","den":"Maintain a mark on an elite or boss. Reapplication respects the actual cooldown."},{"id":"switch","ko":"현재 대상에 표식","en":"Mark the current target","dko":"현재 공격 대상에게 표식을 부여합니다. 대상 변경 시에도 쿨타임을 기다립니다.","den":"Mark the current attack target. A target switch still respects the cooldown."},{"id":"health","ko":"체력 높은 적에 표식","en":"Mark a high-health target","dko":"남은 체력이 많은 적에게 표식을 부여합니다.","den":"Mark an enemy with high remaining health."}],"skill/A06":[{"id":"steady","ko":"평소 사격 강화","en":"Empower regular shots","dko":"기본 사격을 그림자 추가 공격으로 강화합니다.","den":"Empower basic shots with shadow follow-up attacks."},{"id":"elite","ko":"정예 관통 연계","en":"Elite piercing combination","dko":"정예를 향한 관통 사격이 준비됐을 때 사격을 강화합니다.","den":"Empower shots when piercing fire at an elite is ready."}],"skill/A07":[{"id":"opportunity","ko":"연속 사격 우선","en":"Prioritise repeated shots","dko":"준비되면 바로 연속 사격합니다.","den":"Fire repeated shots whenever ready."},{"id":"setup","ko":"자원 40% 남기기","en":"Keep 40% resources","dko":"사용 후에도 자원 40%가 남을 때만 사용합니다.","den":"Use it only when at least 40% resources will remain afterward."}],"skill/A08":[{"id":"opportunity","ko":"기회가 생기면 조준","en":"Aim when an opportunity appears","dko":"준비되면 바로 조준합니다.","den":"Aim as soon as the skill is ready."},{"id":"setup","ko":"표식·먼 거리 조준","en":"Aim at a distant marked target","dko":"표식 대상과 7m 이상 거리이며 가까운 위협이 없을 때 조준합니다.","den":"Aim at a marked target at least 7m away when there is no nearby threat."}],"skill/A09":[{"id":"opportunity","ko":"바로 이동 봉쇄","en":"Restrict movement immediately","dko":"준비되면 바로 가시 덫을 설치합니다.","den":"Place a thorn trap whenever ready."},{"id":"setup","ko":"제어 없는 적 우선","en":"Prioritise uncontrolled enemies","dko":"둔화·속박·기절·빙결이 없는 대상에게 먼저 설치합니다.","den":"Prioritise targets without slow, root, stun or freeze."}],"skill/A10":[{"id":"opportunity","ko":"먼저 둔화시키기","en":"Slow enemies first","dko":"바로 덫을 사용하여 둔화를 부여합니다.","den":"Use the trap immediately to slow enemies."},{"id":"setup","ko":"중독 후 빙결","en":"Freeze after poisoning","dko":"중독된 적에게 덫을 사용하여 추가 빙결을 일으킵니다.","den":"Use the trap against poisoned enemies to also freeze them."}],"skill/A11":[{"id":"opportunity","ko":"근접 위협 떼어내기","en":"Divert nearby threats","dko":"3m 안으로 접근한 일반 적의 시선을 미끼로 돌립니다.","den":"Divert nearby normal enemies within 3m toward the decoy."},{"id":"setup","ko":"무리의 시선 끌기","en":"Divert a threatening pack","dko":"영웅 주변 3m 안에 일반 적 세 명 이상이 있을 때 사용합니다.","den":"Use it when at least three normal enemies threaten the hero within 3m."}],"skill/A12":[{"id":"opportunity","ko":"근접 위협에서 벗어나기","en":"Escape nearby threats","dko":"적이 3m 안으로 접근하면 피해 감소와 이동 속도 증가를 얻습니다.","den":"Gain damage reduction and movement speed when enemies approach within 3m."},{"id":"setup","ko":"체력 위기 대응","en":"Respond to a health crisis","dko":"체력이 40% 이하일 때 사용합니다. 은신이나 무적은 아닙니다.","den":"Use it at 40% health or below. It does not grant invisibility or invulnerability."}],"skill/A13":[{"id":"opportunity","ko":"중독 없는 적에게 사용","en":"Poison a new target","dko":"자신의 독화살 중독이 없는 적에게 사용합니다.","den":"Use it on an enemy without your poison-arrow damage over time."},{"id":"setup","ko":"표식 대상 집중 중독","en":"Poison the marked target","dko":"사냥꾼의 표식이 붙은 적을 기다렸다 사용합니다.","den":"Wait for a hunter-marked enemy before firing."}],"skill/A14":[{"id":"opportunity","ko":"한 명부터 발사","en":"Fire at even one enemy","dko":"적 한 명에게도 바로 발사합니다.","den":"Fire immediately even at a single enemy."},{"id":"setup","ko":"세 명 모이면 분열","en":"Split when three gather","dko":"대상 주변 3m 안에 추가 적 두 명이 모이면 발사합니다.","den":"Fire when two additional enemies are within 3m of the target."}],"skill/A15":[{"id":"opportunity","ko":"가능하면 바로 사용","en":"Use when available","dko":"적이 보이면 쇠뇌를 빠르게 설치합니다. 짧은 교전은 남은 사격을 낭비합니다.","den":"Places the ballista as soon as a target appears. Short fights waste remaining shots."},{"id":"setup","ko":"정예·보스에게 사용","en":"Use against elites and bosses","dko":"오래 싸울 정예·보스에게 설치합니다. 일반 적을 정리할 추가 사격이 줄어듭니다.","den":"Deploys for longer elite or boss fights. Loses extra shots during ordinary clearing."}],"skill/A16":[{"id":"opportunity","ko":"자원 부족 시 보충","en":"Restore low resources","dko":"자원 30% 이하에서 보충하고 다음 유료 스킬 비용을 줄입니다.","den":"Restore resources at 30% or below and discount the next paid skill."},{"id":"setup","ko":"유료 사격 전에 준비","en":"Prepare before a paid shot","dko":"유료 스킬이 준비됐을 때 먼저 사용합니다.","den":"Prepare when a paid skill is ready."}],"skill/A17":[{"id":"opportunity","ko":"강적 집중 소탕","en":"Suppress a strong target","dko":"정예 또는 보스가 포함된 고정 영역을 여러 번 타격합니다.","den":"Strike a fixed area containing an elite or boss repeatedly."},{"id":"setup","ko":"제어된 무리 소탕","en":"Suppress a controlled pack","dko":"제어된 적 세 명 이상이 포함된 고정 영역을 여러 번 타격합니다.","den":"Strike a fixed area containing at least three controlled enemies repeatedly."}],"skill/A18":[{"id":"opportunity","ko":"이동 사격","en":"Mobile shots","dko":"대상이 보이면 시작합니다. 선회 이동으로 잔상을 만들고 다음 직접 사격에 씁니다. 제자리에 서 있으면 추가 화살이 생기지 않습니다.","den":"Activate on a visible target; orbit to leave images and use them on the next direct shot. Standing still produces no extra arrows."},{"id":"setup","ko":"사용 후 자원 70% 보존","en":"Leave 70% resource after casting","dko":"자원이 70% 이상일 때 추격을 시작합니다. 자원 회복을 기다리며 공격 창을 놓칩니다.","den":"Starts pursuit with at least 70% resource. Misses damage windows while waiting for resource."}],"skill/M01":[{"id":"steady","ko":"꾸준히 발사","en":"Steady fire","dko":"준비될 때마다 화염구를 발사합니다. 이동하는 적에게는 예측 조준을 사용합니다.","den":"Fire whenever ready, using predictive aim for moving enemies."},{"id":"pack","ko":"폭발 효율 우선","en":"Prioritise blast coverage","dko":"폭발 범위에 적 무리가 모일 때 발사합니다.","den":"Fire once a group gathers inside the blast area."},{"id":"elite","ko":"강적 우선 화력","en":"Prioritise strong targets","dko":"정예 또는 보스를 우선하여 조준합니다.","den":"Prioritise an elite or boss when aiming."}],"skill/M02":[{"id":"area","ko":"새 영역 확보","en":"Cover a new area","dko":"기존 눈보라와 겹치지 않게 새 적을 덮는 위치를 선택합니다.","den":"Cover new enemies while avoiding unnecessary overlap with an existing blizzard."},{"id":"target-zone","ko":"대상 위치에 재설치","en":"Recast at the target","dko":"교전 대상의 위치에 고정 눈보라를 다시 설치합니다. 장판은 대상을 따라가지 않습니다.","den":"Recast a stationary blizzard at the combat target. The area does not follow it."},{"id":"defend","ko":"접근 경로에 설치","en":"Cover the approach","dko":"적이 접근하는 경로에 고정 눈보라를 설치합니다.","den":"Place a stationary blizzard on the enemy approach path."}],"skill/M03":[{"id":"steady","ko":"단독 적도 공격","en":"Attack isolated enemies","dko":"고립된 적 한 명에게도 연쇄 번개를 사용합니다.","den":"Use chain lightning even on a single isolated enemy."},{"id":"linked","ko":"연결 무리 집중","en":"Wait for linked enemies","dko":"적들이 실제 연결 거리 안으로 모이면 공격합니다.","den":"Attack when enemies gather within the actual chaining distance."}],"skill/M04":[{"id":"survival","ko":"위기 탈출용 보존","en":"Reserve for emergencies","dko":"전역 생존 조건을 만족할 때 안전한 곳으로 순간이동합니다.","den":"Teleport to safety when the global survival condition is met."},{"id":"distance","ko":"교전 거리 복구","en":"Restore combat distance","dko":"평상시에도 적과 교전 거리를 조절합니다.","den":"Adjust combat distance even outside an emergency."},{"id":"sparse","ko":"적이 적은 곳으로 탈출","en":"Escape to a sparse area","dko":"피해 위험이 없는 후보 중 적이 적은 곳을 선택합니다.","den":"Choose a low-density destination among candidates without predicted damage."}],"skill/M05":[{"id":"prevent","ko":"피격 미리 대비","en":"Prepare for incoming damage","dko":"공격 예고에 맞춰 보호막을 먼저 사용합니다. 마지막 속성에 따른 첫 흡수 반응을 함께 사용합니다.","den":"Use the shield in anticipation of an attack. The first absorption also reacts to the remembered element."},{"id":"chain","ko":"속성 흡수 대비","en":"Prepare elemental absorption","dko":"다른 보호막이 없을 때 새 교전에 보호막을 준비합니다. 이전 속성 공격의 첫 흡수 반응을 활용하며 공격을 받아 버티는 위치 설정과 연계합니다.","den":"Prepare a shield for a new encounter when no other shield remains. Use the preceding element on its first absorption with a position policy that accepts shielded hits."},{"id":"emergency","ko":"긴급 생존용 보존","en":"Reserve for survival","dko":"체력이 낮아진 긴급 상황까지 보존합니다. 마지막 속성에 따른 첫 흡수 반응을 함께 사용합니다.","den":"Reserve it for a low-health emergency. The first absorption also reacts to the remembered element."}],"skill/M06":[{"id":"here","ko":"제자리 위기 제어","en":"Control danger in place","dko":"현재 위치에서 가까운 위험 시전을 제어합니다.","den":"Control a nearby dangerous cast from the current position."},{"id":"approach","ko":"접근 후 무리 빙결","en":"Approach and freeze a pack","dko":"안전하게 접근할 수 있는 적 두 명 이상을 범위에 넣고 빙결합니다.","den":"Approach safely and freeze at least two enemies within range."}],"skill/M07":[{"id":"opportunity","ko":"즉시 관통 발사","en":"Pierce immediately","dko":"적 한 명에게도 발사하고 관통 후 화상을 남깁니다.","den":"Fire even at one target, leaving burns after piercing."},{"id":"setup","ko":"세 명 관통 대기","en":"Wait to pierce three","dko":"실제 사선에 적 세 명이 들어오면 발사합니다.","den":"Fire when three enemies enter the actual line of fire."}],"skill/M08":[{"id":"opportunity","ko":"바로 화염 지대 만들기","en":"Create a fire area immediately","dko":"바로 장벽을 설치합니다. 영역 안에 머문 시간만큼 피해를 줍니다.","den":"Place the wall immediately. Damage depends on time actually spent in its area."},{"id":"setup","ko":"제어된 적에게 겹치기","en":"Overlap controlled enemies","dko":"제어된 적이 실제 장벽 영역에 포함되게 설치합니다.","den":"Place the wall so a controlled target is inside its actual area."}],"skill/M09":[{"id":"opportunity","ko":"먼저 둔화시키기","en":"Slow enemies first","dko":"빙하창 자체로 적에게 둔화를 부여합니다.","den":"Apply slowing with the ice spear itself."},{"id":"setup","ko":"둔화 후 빙결","en":"Freeze slowed enemies","dko":"이미 둔화된 적에게 사용하여 빙결합니다.","den":"Use it on an already slowed enemy to freeze it."}],"skill/M10":[{"id":"opportunity","ko":"귀환 회수","en":"Recover the return","dko":"대상이 보이면 왕복 경로를 쏘고 안전한 시전 위치에서 마나 회수를 노립니다. 회수 위치가 위험하거나 3m보다 멀면 회수를 포기합니다.","den":"Fire on sight and seek the safe cast location to recover mana on return. Give up recovery if the location is dangerous or farther than 3m."},{"id":"setup","ko":"제어 사격","en":"Control shots","dko":"제어된 대상만 쏩니다. 회수 이동을 생략하고 현재 전투 위치를 유지합니다. 시전 위치를 벗어나면 회수 마나를 잃을 수 있습니다.","den":"Shoot controlled targets only and hold combat position instead of moving for pickup. Moving away from the cast location can lose the mana refund."}],"skill/M11":[{"id":"opportunity","ko":"지속 피해용 설치","en":"Deploy for lasting damage","dko":"구체의 지속 피해와 종료 폭발을 사용합니다.","den":"Use the orb for periodic damage and an expiry blast."},{"id":"setup","ko":"연쇄 번개 준비 후 설치","en":"Deploy with chain lightning ready","dko":"연쇄 번개의 쿨타임과 자원을 확보한 뒤 설치하고 실제 사용으로 충전합니다.","den":"Deploy once chain lightning is ready and affordable, then charge it with actual casts."}],"skill/M12":[{"id":"opportunity","ko":"가능하면 바로 사용","en":"Use when available","dko":"사선이 열리면 바로 공격합니다. 연쇄 적중 후 자원 회수 기회를 놓칠 수 있습니다.","den":"Attacks whenever a firing line is open. Can miss the resource refund after Chain Lightning."},{"id":"setup","ko":"연쇄 전에 접지","en":"Ground before chaining","dko":"M03이 준비되고 두 기술의 마나가 있을 때 먼저 중계창을 설치합니다. 창 설치에 먼저 행동과 마나를 씁니다.","den":"Place the relay first when M03 is ready and mana covers both skills. Spends an action and mana on setup first."}],"skill/M13":[{"id":"native","ko":"안전한 자리에서 짧게 회복","en":"Recover briefly in safety","dko":"자원 35% 이하에서 주변이 안전할 때 50%까지 회복합니다.","den":"Recover to 50% from at most 35% resources when the surroundings are safe."},{"id":"hold","ko":"피격 감수 빠른 회복","en":"Recover while accepting damage","dko":"피격 중에도 제자리에서 50%까지 회복합니다. 전역 긴급 대응은 충전을 중단할 수 있습니다.","den":"Recover in place to 50% even while taking damage. Global emergency responses can interrupt charging."},{"id":"retreat","ko":"거리 확보 후 충분히 회복","en":"Gain distance and recover fully","dko":"5m 거리 확보를 최대 2초 시도한 뒤 90%까지 회복합니다. 위험이 다시 가까워지면 중단합니다.","den":"Try for up to two seconds to gain 5m of space, then recover to 90%. Stop if danger approaches again."}],"skill/M14":[{"id":"opportunity","ko":"보호막이 없을 때 설치","en":"Deploy without a shield","dko":"보호막이 없는 교전에서 결계를 설치합니다.","den":"Deploy the ward in combat when no shield remains."},{"id":"setup","ko":"체력 위기 때 설치","en":"Deploy in a health crisis","dko":"체력 50% 이하에서 결계를 설치합니다. 결계 안에서 피해 감소와 보호막을 얻습니다.","den":"Deploy at 50% health or below for a shield and damage reduction inside the ward."}],"skill/M15":[{"id":"opportunity","ko":"자원 부족 시 보충","en":"Restore low resources","dko":"자원 30% 이하에서 보충합니다.","den":"Restore resources at 30% or below."},{"id":"setup","ko":"세 원소 할인 준비","en":"Prepare three elemental discounts","dko":"화염·냉기·번개의 유료 일반 스킬을 갖추면 사용합니다. 각 원소의 첫 사용에 할인이 소비됩니다.","den":"Use it with paid fire, cold and lightning skills equipped. Each element consumes its discount on its first use."}],"skill/M16":[{"id":"opportunity","ko":"한 명부터 끌어모으기","en":"Gather even one enemy","dko":"한 명에게도 사용하여 최초 끌어당김과 지속 피해를 줍니다.","den":"Use it even on one enemy for an initial pull and lasting damage."},{"id":"setup","ko":"세 명 이상 집결","en":"Gather three or more","dko":"실제 영역에 적 세 명 이상이 모이면 사용합니다.","den":"Use it when three or more enemies gather inside the actual area."}],"skill/M17":[{"id":"opportunity","ko":"강적 집중 붕괴","en":"Collapse a strong target","dko":"정예 또는 보스를 포함해 화염·냉기·번개 순서로 타격합니다.","den":"Strike an elite or boss with fire, cold and lightning in order."},{"id":"group","ko":"네 명 이상 광역 붕괴","en":"Collapse a group of four","dko":"영역 안의 적 네 명 이상에게 세 원소 타격을 가합니다.","den":"Strike at least four enemies in the area with all three elements."}],"skill/M18":[{"id":"opportunity","ko":"강적 앞에서 즉시 강화","en":"Empower immediately against strong targets","dko":"강적 앞에서 즉시 보호막·공격 강화·비용 감소를 얻습니다.","den":"Immediately gain a shield, attack power and reduced costs against a strong target."},{"id":"setup","ko":"세 원소 준비 후 강화","en":"Empower when three elements are ready","dko":"세 원소 스킬의 쿨타임과 필요한 자원을 확보한 뒤 강화하고 원소 순환 폭발을 일으킵니다.","den":"Empower once all three elemental skills are ready and affordable, then trigger elemental-cycle bursts."}],"skill/W01":[{"id":"center","ko":"빠른 중앙 침투","en":"Quick central entry","dko":"적 무리의 중심으로 이동하며 회전합니다.","den":"Move into the centre of the pack while spinning."},{"id":"edge","ko":"생존 우선 전투","en":"Survival first","dko":"적 무리의 가장자리를 유지하며 회전합니다.","den":"Spin while staying at the edge of the pack."},{"id":"stand","ko":"제자리 집중 회전","en":"Stationary spin","dko":"현재 자리에서 3초씩 끊어 회전합니다.","den":"Spin in place in three-second bursts."}],"skill/W02":[{"id":"advance","ko":"빠른 무리 진입","en":"Quick pack entry","dko":"가까운 적 두 명 이상을 향해 바로 도약합니다.","den":"Leap directly into a nearby pack of at least two enemies."},{"id":"space","ko":"거리 확보 후 강타","en":"Leap after spacing","dko":"6m 거리를 최대 2초 동안 확보한 뒤 도약합니다. 확보하지 못해도 현재 거리에서 공격합니다.","den":"Try to gain 6m of space for up to two seconds before leaping. Attack from the current distance if spacing fails."},{"id":"escape","ko":"긴급 이탈용 보존","en":"Reserve for escape","dko":"평소에는 보존하고 전역 생존 조건에 따라 안전한 곳으로 이탈합니다.","den":"Reserve it for escaping to safety when the global survival condition is met."}],"skill/W03":[{"id":"group","ko":"무리 한 번에 분쇄","en":"Crush a pack","dko":"여러 적을 포함하는 방향으로 분쇄 일격을 사용합니다.","den":"Aim the crushing strike through several enemies."},{"id":"elite","ko":"강적 우선 타격","en":"Strike strong enemies","dko":"정예 또는 보스를 우선하여 공격 방향을 정합니다.","den":"Prioritise an elite or boss when choosing the strike direction."}],"skill/W04":[{"id":"group","ko":"무리 제어","en":"Control a pack","dko":"가까운 적 두 명 이상을 기절시킵니다.","den":"Stun at least two nearby enemies."},{"id":"interrupt","ko":"위험 시전 차단","en":"Interrupt a threat","dko":"범위 안에서 실제 위험 시전을 준비하는 적을 방해합니다.","den":"Interrupt an enemy preparing a dangerous cast within range."},{"id":"retreat","ko":"후퇴 지원","en":"Cover a retreat","dko":"위기 상황에서 추격자를 제어하고 거리를 벌립니다.","den":"Control pursuers and gain distance in an emergency."}],"skill/W05":[{"id":"prevent","ko":"위험 미리 대비","en":"Prepare for damage","dko":"피격 예고에 맞춰 미리 보호막을 사용합니다.","den":"Use a shield in anticipation of incoming damage."},{"id":"chain","ko":"보호막 이어 쓰기","en":"Chain shields","dko":"다른 보호막과 도약 방어 효과가 끝난 뒤 필요한 시점에 사용합니다.","den":"Wait for the other shield and leap defence to end before using it when needed."},{"id":"emergency","ko":"긴급 생존용 보존","en":"Reserve for survival","dko":"체력이 낮아진 긴급 상황에서 사용합니다.","den":"Use it in a low-health emergency."}],"skill/W06":[{"id":"resource","ko":"자원 보충 집중","en":"Restore resources","dko":"공격할 자원이 부족할 때 함성으로 자원을 보충합니다.","den":"Restore resources with a shout when paid attacks cannot be afforded."},{"id":"strong","ko":"강적전 공격 강화","en":"Empower strong-enemy fights","dko":"정예 또는 보스가 공격 범위에 들어오면 함성으로 공격을 강화합니다.","den":"Empower attacks once an elite or boss enters attack range."}],"skill/W07":[{"id":"native","ko":"낙인 유지","en":"Maintain the brand","dko":"같은 적의 낙인이 끝나갈 때 갱신합니다.","den":"Refresh the brand as it expires on the same target."},{"id":"opportunity","ko":"자원 부족 시 낙인","en":"Brand when resources are low","dko":"자원이 50% 이하일 때 낙인을 사용합니다.","den":"Apply the brand when resources are at 50% or below."}],"skill/W08":[{"id":"opportunity","ko":"가까운 적도 즉시 끌기","en":"Pull even nearby enemies","dko":"거리가 가까워도 준비되면 적을 끌어옵니다.","den":"Pull the enemy when ready, even at close range."},{"id":"setup","ko":"먼 적을 끌어오기","en":"Pull distant enemies","dko":"4m 이상 떨어진 적을 기다렸다 끌어옵니다.","den":"Wait for an enemy at least 4m away before pulling."}],"skill/W09":[{"id":"native","ko":"무리·강적 우선 출혈","en":"Bleed packs or strong targets","dko":"강적 또는 가까운 적 세 명 이상에게 출혈을 부여합니다.","den":"Apply bleeding to a strong target or at least three nearby enemies."},{"id":"opportunity","ko":"한 명부터 출혈","en":"Bleed a single enemy","dko":"자신의 출혈이 없는 적 한 명에게도 사용합니다.","den":"Use it even on one target without your bleeding effect."}],"skill/W10":[{"id":"opportunity","ko":"출혈 즉시 회수","en":"Reap bleeding immediately","dko":"자신이 만든 출혈을 바로 회수해 추가 피해와 회복을 얻습니다.","den":"Immediately reap your bleeding for extra damage and healing."},{"id":"setup","ko":"출혈 끝·위기에 회수","en":"Reap near expiry or in danger","dko":"출혈이 1초 이하로 남거나 체력이 40% 이하일 때 회수합니다.","den":"Reap when bleeding has at most one second left or health is at 40% or below."}],"skill/W11":[{"id":"opportunity","ko":"가능하면 바로 사용","en":"Use when available","dko":"짧은 거리도 전진해 피해 감소를 확보합니다. 이동기를 일찍 소비하고 위치가 바뀝니다.","den":"Uses even a short advance for mitigation. Spends mobility early and changes position."},{"id":"setup","ko":"먼 적에게 사용","en":"Use against distant enemies","dko":"멀어진 적에게 접근할 때만 전진합니다. 붙어 있는 동안 방어·자원 회복 기회가 줄어듭니다.","den":"Advances only to close a gap. Loses mitigation and resource opportunities while close."}],"skill/W12":[{"id":"opportunity","ko":"공격 예고에 맞춰 방어","en":"Defend against a windup","dko":"준비 동작을 보이는 적 앞에서 자세를 취합니다. 반격은 실제 막기 성공 시 발생합니다.","den":"Take the stance against an enemy winding up. A counter requires an actual successful block."},{"id":"setup","ko":"체력 절반에서 방어","en":"Defend at half health","dko":"체력이 50% 이하일 때 사용합니다. 반격은 실제 막기 성공 시 발생합니다.","den":"Use it at 50% health or below. A counter requires a successful block."}],"skill/W13":[{"id":"opportunity","ko":"한 명부터 끌어모으기","en":"Gather even one enemy","dko":"근처 적 한 명에게도 고리를 사용합니다.","den":"Use the ring even on a single nearby enemy."},{"id":"setup","ko":"세 명 이상 모으기","en":"Gather three or more","dko":"실제 공격 범위에 적 세 명 이상이 모이면 사용합니다.","den":"Use it when at least three enemies are within the actual area."}],"skill/W14":[{"id":"opportunity","ko":"즉시 파동 발사","en":"Fire a wave immediately","dko":"먼저 보이는 적에게 파동을 발사합니다.","den":"Fire the wave at the first available enemy."},{"id":"setup","ko":"세 명 관통 대기","en":"Wait to pierce three","dko":"실제 직선 공격 범위에 적 세 명이 들어오면 발사합니다.","den":"Fire when three enemies are in the actual line attack."}],"skill/W15":[{"id":"opportunity","ko":"자원 30% 이하에서","en":"Below 30% resource","dko":"자원이 충분히 빈 뒤 회복해 넘침을 줄입니다. 회복이 시작되기 전 공격이 끊길 수 있습니다.","den":"Waits for low resource to reduce overflow. Attacks can stop before recovery starts."},{"id":"setup","ko":"자원 75% 이하에서","en":"Below 75% resource","dko":"자원이 75% 이하부터 회복을 미리 시작합니다. 전투가 끊기면 남은 회복을 낭비합니다.","den":"Starts recovery early below 75% resource. Wastes recovery if combat stops."}],"skill/W16":[{"id":"opportunity","ko":"보호막이 없을 때 사용","en":"Use without a shield","dko":"보호막이 없는 교전에서 사용합니다.","den":"Use it in combat when no shield remains."},{"id":"setup","ko":"둔화 해제용 보존","en":"Reserve to remove slowing","dko":"적에게 둔화를 받은 뒤 보호막을 만들고 둔화를 해제합니다.","den":"After being slowed by an enemy, create a shield and remove the slowing."}],"skill/W17":[{"id":"opportunity","ko":"강적전 지원","en":"Support strong-enemy fights","dko":"정예 또는 보스 앞에서 선조의 지속 공격과 피해 감소를 받습니다. 선조는 적의 공격을 대신 받지 않습니다.","den":"Gain ancestral attacks and damage reduction against an elite or boss. Ancestors do not absorb enemy attacks."},{"id":"setup","ko":"위기 생존 지원","en":"Support in a health crisis","dko":"체력이 50% 이하일 때 선조를 불러 공격과 생존을 보완합니다.","den":"Summon ancestors at 50% health or below to support attacks and survival."}],"skill/W18":[{"id":"elite","ko":"강적 집중 심판","en":"Judge a strong target","dko":"정예 또는 보스를 포함하는 범위에 심판을 사용합니다.","den":"Use judgement in an area including an elite or boss."},{"id":"opportunity","ko":"네 명 이상 광역 심판","en":"Judge a group of four","dko":"범위 안의 적 네 명 이상에게 광역 심판을 사용합니다.","den":"Use area judgement on at least four enemies within range."},{"id":"setup","ko":"함성 후 심판","en":"Judge after a shout","dko":"전투 함성 효과가 활성화된 뒤 심판을 사용합니다. 이후 분쇄 일격과 지면 강타도 강화됩니다.","den":"Use judgement after battle shout becomes active. Crushing strike and ground slam are then empowered."}]},"styles":[{"id":"aggressive","ko":"공격적","en":"Aggressive","dko":"적 무리를 빠르게 정리합니다. 큰 피해만 피하고 HP 20% 이하에서만 물러나므로 사냥이 빨라지지만 받는 피해가 늘어납니다.","den":"Clears packs quickly. It only avoids heavy hits and falls back only below 20% HP, so hunts go faster but you take more damage.","picks":[["position.engage","close"],["position.surrounded","hold"],["target.default","pack"],["survival.lowHp","emergency"],["survival.potion","balanced"],["dodge.ground.policy","attack"],["dodge.control","finish"]]},{"id":"balanced","ko":"균형","en":"Balanced","dko":"공격과 생존을 고르게 챙깁니다. HP를 10% 이상 깎는 공격을 피하고 HP 30%에서 물러나 회복합니다. 처음이라면 이 방식을 권장합니다.","den":"Balances offense and survival. It avoids attacks that would take 10% HP or more and falls back at 30% HP to recover. Recommended if you are new.","picks":[["position.engage","balanced"],["position.surrounded","hold"],["target.default","nearest"],["survival.lowHp","balanced"],["survival.potion","balanced"],["dodge.ground.policy","balanced"],["dodge.control","balanced"]]},{"id":"careful","ko":"신중","en":"Careful","dko":"위험을 먼저 피합니다. 예고된 공격을 모두 피하고 HP 45%에서 물러나며 물약을 넉넉히 챙깁니다. 사냥은 느려지지만 잘 쓰러지지 않습니다.","den":"Puts safety first. It dodges every telegraphed attack, falls back at 45% HP and carries extra potions. Hunts are slower, but you rarely fall.","picks":[["position.enga bmxl773wd5e/X0bgMgKXEbiMwGUELiNwGYE5RuD/Aa929bc4i98yAAAAAElFTkSuQmCC"}],"policies":{"W01":[{"id":"center","ko":"빠른 중앙 침투","en":"Quick central entry","dko":"적 무리의 중심으로 이동하며 회전합니다.","den":"Move into the centre of the pack while spinning."},{"id":"edge","ko":"생존 우선 전투","en":"Survival first","dko":"적 무리의 가장자리를 유지하며 회전합니다.","den":"Spin while staying at the edge of the pack."},{"id":"stand","ko":"제자리 집중 회전","en":"Stationary spin","dko":"현재 자리에서 3초씩 끊어 회전합니다.","den":"Spin in place in three-second bursts."}],"W02":[{"id":"advance","ko":"빠른 무리 진입","en":"Quick pack entry","dko":"가까운 적 두 명 이상을 향해 바로 도약합니다.","den":"Leap directly into a nearby pack of at least two enemies."},{"id":"space","ko":"거리 확보 후 강타","en":"Leap after spacing","dko":"6m 거리를 최대 2초 동안 확보한 뒤 도약합니다. 확보하지 못해도 현재 거리에서 공격합니다.","den":"Try to gain 6m of space for up to two seconds before leaping. Attack from the current distance if spacing fails."},{"id":"escape","ko":"긴급 이탈용 보존","en":"Reserve for escape","dko":"평소에는 보존하고 전역 생존 조건에 따라 안전한 곳으로 이탈합니다.","den":"Reserve it for escaping to safety when the global survival condition is met."}],"W03":[{"id":"group","ko":"무리 한 번에 분쇄","en":"Crush a pack","dko":"여러 적을 포함하는 방향으로 분쇄 일격을 사용합니다.","den":"Aim the crushing strike through several enemies."},{"id":"elite","ko":"강적 우선 타격","en":"Strike strong enemies","dko":"정예 또는 보스를 우선하여 공격 방향을 정합니다.","den":"Prioritise an elite or boss when choosing the strike direction."}],"W04":[{"id":"group","ko":"무리 제어","en":"Control a pack","dko":"가까운 적 두 명 이상을 기절시킵니다.","den":"Stun at least two nearby enemies."},{"id":"interrupt","ko":"위험 시전 차단","en":"Interrupt a threat","dko":"범위 안에서 실제 위험 시전을 준비하는 적을 방해합니다.","den":"Interrupt an enemy preparing a dangerous cast within range."},{"id":"retreat","ko":"후퇴 지원","en":"Cover a retreat","dko":"위기 상황에서 추격자를 제어하고 거리를 벌립니다.","den":"Control pursuers and gain distance in an emergency."}],"W05":[{"id":"prevent","ko":"위험 미리 대비","en":"Prepare for damage","dko":"피격 예고에 맞춰 미리 보호막을 사용합니다.","den":"Use a shield in anticipation of incoming damage."},{"id":"chain","ko":"보호막 이어 쓰기","en":"Chain shields","dko":"다른 보호막과 도약 방어 효과가 끝난 뒤 필요한 시점에 사용합니다.","den":"Wait for the other shield and leap defence to end before using it when needed."},{"id":"emergency","ko":"긴급 생존용 보존","en":"Reserve for survival","dko":"체력이 낮아진 긴급 상황에서 사용합니다.","den":"Use it in a low-health emergency."}],"W06":[{"id":"resource","ko":"자원 보충 집중","en":"Restore resources","dko":"공격할 자원이 부족할 때 함성으로 자원을 보충합니다.","den":"Restore resources with a shout when paid attacks cannot be afforded."},{"id":"strong","ko":"강적전 공격 강화","en":"Empower strong-enemy fights","dko":"정예 또는 보스가 공격 범위에 들어오면 함성으로 공격을 강화합니다.","den":"Empower attacks once an elite or boss enters attack range."}],"W07":[{"id":"native","ko":"낙인 유지","en":"Maintain the brand","dko":"같은 적의 낙인이 끝나갈 때 갱신합니다.","den":"Refresh the brand as it expires on the same target."},{"id":"opportunity","ko":"자원 부족 시 낙인","en":"Brand when resources are low","dko":"자원이 50% 이하일 때 낙인을 사용합니다.","den":"Apply the brand when resources are at 50% or below."}],"W08":[{"id":"opportunity","ko":"가까운 적도 즉시 끌기","en":"Pull even nearby enemies","dko":"거리가 가까워도 준비되면 적을 끌어옵니다.","den":"Pull the enemy when ready, even at close range."},{"id":"setup","ko":"먼 적을 끌어오기","en":"Pull distant enemies","dko":"4m 이상 떨어진 적을 기다렸다 끌어옵니다.","den":"Wait for an enemy at least 4m away before pulling."}],"W09":[{"id":"native","ko":"무리·강적 우선 출혈","en":"Bleed packs or strong targets","dko":"강적 또는 가까운 적 세 명 이상에게 출혈을 부여합니다.","den":"Apply bleeding to a strong target or at least three nearby enemies."},{"id":"opportunity","ko":"한 명부터 출혈","en":"Bleed a single enemy","dko":"자신의 출혈이 없는 적 한 명에게도 사용합니다.","den":"Use it even on one target without your bleeding effect."}],"W11":[{"id":"opportunity","ko":"가능하면 바로 사용","en":"Use when available","dko":"짧은 거리도 전진해 피해 감소를 확보합니다. 이동기를 일찍 소비하고 위치가 바뀝니다.","den":"Uses even a short advance for mitigation. Spends mobility early and changes position."},{"id":"setup","ko":"먼 적에게 사용","en":"Use against distant enemies","dko":"멀어진 적에게 접근할 때만 전진합니다. 붙어 있는 동안 방어·자원 회복 기회가 줄어듭니다.","den":"Advances only to close a gap. Loses mitigation and resource opportunities while close."}],"W10":[{"id":"opportunity","ko":"출혈 즉시 회수","en":"Reap bleeding immediately","dko":"자신이 만든 출혈을 바로 회수해 추가 피해와 회복을 얻습니다.","den":"Immediately reap your bleeding for extra damage and healing."},{"id":"setup","ko":"출혈 끝·위기에 회수","en":"Reap near expiry or in danger","dko":"출혈이 1초 이하로 남거나 체력이 40% 이하일 때 회수합니다.","den":"Reap when bleeding has at most one second left or health is at 40% or below."}],"W12":[{"id":"opportunity","ko":"공격 예고에 맞춰 방어","en":"Defend against a windup","dko":"준비 동작을 보이는 적 앞에서 자세를 취합니다. 반격은 실제 막기 성공 시 발생합니다.","den":"Take the stance against an enemy winding up. A counter requires an actual successful block."},{"id":"setup","ko":"체력 절반에서 방어","en":"Defend at half health","dko":"체력이 50% 이하일 때 사용합니다. 반격은 실제 막기 성공 시 발생합니다.","den":"Use it at 50% health or below. A counter requires a successful block."}],"W13":[{"id":"opportunity","ko":"한 명부터 끌어모으기","en":"Gather even one enemy","dko":"근처 적 한 명에게도 고리를 사용합니다.","den":"Use the ring even on a single nearby enemy."},{"id":"setup","ko":"세 명 이상 모으기","en":"Gather three or more","dko":"실제 공격 범위에 적 세 명 이상이 모이면 사용합니다.","den":"Use it when at least three enemies are within the actual area."}],"W14":[{"id":"opportunity","ko":"즉시 파동 발사","en":"Fire a wave immediately","dko":"먼저 보이는 적에게 파동을 발사합니다.","den":"Fire the wave at the first available enemy."},{"id":"setup","ko":"세 명 관통 대기","en":"Wait to pierce three","dko":"실제 직선 공격 범위에 적 세 명이 들어오면 발사합니다.","den":"Fire when three enemies are in the actual line attack."}],"W15":[{"id":"opportunity","ko":"자원 30% 이하에서","en":"Below 30% resource","dko":"자원이 충분히 빈 뒤 회복해 넘침을 줄입니다. 회복이 시작되기 전 공격이 끊길 수 있습니다.","den":"Waits for low resource to reduce overflow. Attacks can stop before recovery starts."},{"id":"setup","ko":"자원 75% 이하에서","en":"Below 75% resource","dko":"자원이 75% 이하부터 회복을 미리 시작합니다. 전투가 끊기면 남은 회복을 낭비합니다.","den":"Starts recovery early below 75% resource. Wastes recovery if combat stops."}],"W16":[{"id":"opportunity","ko":"보호막이 없을 때 사용","en":"Use without a shield","dko":"보호막이 없는 교전에서 사용합니다.","den":"Use it in combat when no shield remains."},{"id":"setup","ko":"둔화 해제용 보존","en":"Reserve to remove slowing","dko":"적에게 둔화를 받은 뒤 보호막을 만들고 둔화를 해제합니다.","den":"After being slowed by an enemy, create a shield and remove the slowing."}],"W17":[{"id":"opportunity","ko":"강적전 지원","en":"Support strong-enemy fights","dko":"정예 또는 보스 앞에서 선조의 지속 공격과 피해 감소를 받습니다. 선조는 적의 공격을 대신 받지 않습니다.","den":"Gain ancestral attacks and damage reduction against an elite or boss. Ancestors do not absorb enemy attacks."},{"id":"setup","ko":"위기 생존 지원","en":"Support in a health crisis","dko":"체력이 50% 이하일 때 선조를 불러 공격과 생존을 보완합니다.","den":"Summon ancestors at 50% health or below to support attacks and survival."}],"W18":[{"id":"elite","ko":"강적 집중 심판","en":"Judge a strong target","dko":"정예 또는 보스를 포함하는 범위에 심판을 사용합니다.","den":"Use judgement in an area including an elite or boss."},{"id":"opportunity","ko":"네 명 이상 광역 심판","en":"Judge a group of four","dko":"범위 안의 적 네 명 이상에게 광역 심판을 사용합니다.","den":"Use area judgement on at least four enemies within range."},{"id":"setup","ko":"함성 후 심판","en":"Judge after a shout","dko":"전투 함성 효과가 활성화된 뒤 심판을 사용합니다. 이후 분쇄 일격과 지면 강타도 강화됩니다.","den":"Use judgement after battle shout becomes active. Crushing strike and ground slam are then empowered."}]},"glyphs":{"nav-skills":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADgAAAA4CAYAAACohjseAAAAAXNSR0IArs4c6QAAAHhlWElmTU0AKgAAAAgABAEaAAUAAAABAAAAPgEbAAUAAAABAAAARgEoAAMAAAABAAIAAIdpAAQAAAABAAAATgAAAAAAAABIAAAAAQAAAEgAAAABAAOgAQADAAAAAQABAACgAgAEAAAAAQAAADigAwAEAAAAAQAAADgAAAAAPthcZAAAAAlwSFlzAAALEwAACxMBAJqcGAAABPFJREFUaAXtmLmLFUEQxr1YcEUQNfBaD7xWE80MBENFM13B1EgQ0URDEa9MRQMT/wBRNDRVQTRYr8hbFAMNVFCERfFgWX/fY2opent6582befuCKfhe11R319FdU93zpk1rqFmBZgWaFWhWoFmBqVuBsbGxGZ1aR8dMML2Mno6N5xmVQ+AM/Q9ot+WNS8mZtwycY8wwuAt/GPSl5nStD0e2gJ9AdAvMa8c44zeA5yCkawj629FV6ViMa+fOgi/A6C/MK1Bo function initStage() {
  const h = hero();
  S.sel = clone(DEF); S.potionHp = h.pro ? 40 : 60; S.tg = {equip: false, supply: false};
  S.policy = {W01: 'center', W02: 'advance', W03: 'group', W04: 'group', W05: 'prevent', W17: 'opportunity'};
  S.rank = {}; S.slots = [null, null, null, null]; S.ult = null; S.selSkill = 'W01'; S.target = null;
  if (!h.pro) {
    let pts = h.lvl - 2;
    for (const n of D.nodes.slice().sort((a, b) => a.level - b.level)) {
      if (n.level > h.lvl || n.kind === 'ultimate' || n.parents.some(p => !S.rank[p])) continue;
      const r = Math.min(n.max, 1 + ((h.lvl - n.level) >> 2), pts); if (r > 0) { S.rank[n.id] = r; pts -= r; }
    }
    const acts = D.nodes.filter(n => n.kind === 'active' && S.rank[n.id]).sort((a, b) => a.level - b.level).slice(0, 4);
    acts.forEach((n, i) => S.slots[i] = n.id);
    S.policy.W01 = 'edge';
  }
  S.saved = snapshot(); S.tab = h.pro === 'survival' ? 'combat' : h.pro === 'edict' ? 'skills' : 'overview';
  S.autoSub = 'loot'; S.sheet = null; S.focus = null; S.dismissed = {}; S.done = false; S.styleApplied = null;
  S.advice = {};
}
const snapshot = () => clone({sel: S.sel, potionHp: S.potionHp, rank: S.rank, slots: S.slots, ult: S.ult, policy: S.policy, tg: S.tg});
function dirtyCount() {
  const a = snapshot(), b = S.saved; let n = 0;
  for (const k of Object.keys(a.sel)) if (a.sel[k] !== b.sel[k]) n++;
  for (const k of Object.keys(a.policy)) if (a.policy[k] !== b.policy[k]) n++;
  for (const k of Object.keys(a.tg)) if (a.tg[k] !== b.tg[k]) n++;
  if (a.potionHp !== b.potionHp) n++;
  const ids = new Set([...Object.keys(a.rank), ...Object.keys(b.rank)]);
  for (const k of ids) if ((a.rank[k] || 0) !== (b.rank[k] || 0)) n++;
  a.slots.forEach((v, i) => { if (v !== b.slots[i]) n++; });
  if (a.ult !== b.ult) n++;
  return n;
}
