<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HELLSCRIPT 사냥 칙령 시안 v2</title>
<style>:root{color-scheme:dark;--void:#090807;--bg:#100f0d;--inset:#0c0b0a;--panel:#191713;--raised:#211e19;--hover:#2b2720;--sel:#33291b;--border:#3a3228;--edge:#5e4f3a;--gold-deep:#8a6b3c;--gold:#d3af72;--gold-bright:#f2d9a4;--text:#ece3cf;--muted:#a0978a;--faint:#6e675c;--success:#8fc07a;--danger:#df927b;--primary:#93632d;--resource:#8fb8d6;--defeat-panel:#2c1113;--defeat-border:#9b4645;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{font:12px/1.4 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans CJK KR','Noto Sans KR',Arial,sans-serif;color:var(--text);background:#070605;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--border);background:var(--raised);padding:0;touch-action:manipulation;transition:background .12s,border-color .12s}
button:hover:not(:disabled){border-color:var(--gold-deep);background:var(--hover)}
button:disabled,button[aria-disabled=true]{cursor:not-allowed;opacity:.45}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
h1,h2,h3,h4,p{margin:0}
.muted{color:var(--muted)}.faint{color:var(--faint)}.gold{color:var(--gold)}.ok{color:var(--success)}.bad{color:var(--danger)}
.mono{font-variant-numeric:tabular-nums}
.gi{display:inline-block;width:18px;height:18px;flex:none;background:currentColor;-webkit-mask:var(--g) center/contain no-repeat;mask:var(--g) center/contain no-repeat}
.sv{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}

/* ------------------------------------------------------------ preview chrome (not part of the game) */
#toolbar{flex:none;display:flex;align-items:center;gap:6px 14px;padding:6px 12px;border-bottom:1px solid #2a2418;background:#0d0b09;flex-wrap:wrap;font-size:11px}
#toolbar .brand{font:14px Baskerville,Georgia,serif;letter-spacing:2px;color:var(--gold);white-space:nowrap}
#toolbar .brand small{font:10px 'Apple SD Gothic Neo',sans-serif;letter-spacing:0;color:var(--muted);margin-left:6px}
#toolbar .grp{display:flex;align-items:center;gap:3px}
#toolbar label{color:var(--muted);margin-right:3px}
#toolbar button,#toolbar select{font-size:11px;min-height:26px;padding:2px 8px;border:1px solid var(--border);background:var(--panel);color:var(--text)}
#toolbar button.on{border-color:var(--gold);color:var(--gold-bright);background:var(--sel)}
#toolbar select{max-width:230px}
#toolbar .gate{font:10px ui-monospace,Menlo,monospace;color:var(--muted);padding:2px 6px;border:1px dashed var(--border);max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toolbar .gate.warn{color:var(--danger);border-color:var(--danger)}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#1a140d,#070605 70%)}
#device{position:absolute;left:0;top:0;transform-origin:0 0;border:1px solid #3a3228;box-shadow:0 24px 80px #000c;background:#000}
#screen{position:relative;width:100%;height:100%;overflow:hidden;background:var(--void)}
#foot{flex:none;padding:5px 12px;font-size:10px;color:var(--faint);border-top:1px solid #1d1912;background:#0a0908;line-height:1.5}

/* ------------------------------------------------------------ the world behind the window (stand-in for the game) */
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 40% 70%,#27303a 0,#10151b 55%,#07090c 100%);overflow:hidden}
.bg::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,#ffffff06 0 2px,transparent 2px 46px),repeating-linear-gradient(25deg,#00000030 0 2px,transparent 2px 60px)}
.bg .hint{position:absolute;left:14px;top:12px;font-size:11px;color:#8a95a3;letter-spacing:.3px}
.dock{position:absolute;right:8px;top:48px;display:flex;flex-direction:column;gap:8px}
.dockbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#3b2d18,#14100a);border:1px solid var(--edge);color:var(--gold-bright);box-shadow:0 0 12px #d3af7222}
.dockbtn .gi{width:26px;height:26px}
.dockbtn.dim{opacity:.45;border-color:var(--border)}

/* ------------------------------------------------------------ window frame */
#app{position:absolute;left:0;top:0;transform-origin:0 0;container-type:size;container-name:win;--cap:0px;overflow:hidden}
#world{position:absolute;inset:0}
.win{position:absolute;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#15130f,#0f0e0b);border:1px solid var(--edge)}
.hdr{flex:none;height:36px;display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#1e1b16,#15130f)}
.hdr h1{font-size:15px;font-weight:700;color:var(--gold-bright);display:flex;align-items:center;gap:7px;white-space:nowrap;margin:0}
.hdr h1 .gi{width:17px;height:17px;color:var(--gold)}
.hdr .who{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hdr .grow{flex:1}
.xbtn{width:34px;height:30px;display:grid;place-items:center}
.xbtn .gi{width:14px;height:14px}
.main{flex:1;min-height:0;display:flex}
.foot{flex:none;height:48px;display:flex;align-items:center;gap:8px;padding:0 10px;border-top:1px solid var(--border);background:#12100d}
.foot .status{flex:1;min-width:0;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px;overflow:hidden}
.foot .status b{color:var(--gold-bright);font-weight:600;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none;box-shadow:0 0 7px var(--gold)}
.btn{min-height:34px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:12px;background:linear-gradient(180deg,#2a2620,#1e1b16);border-color:var(--edge);white-space:nowrap}
.btn.primary{background:linear-gradient(180deg,#a47232,#7a5226);border-color:var(--gold-deep);color:#fff1d2}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#b5813b,#8a5e2d)}
.btn.small{min-height:28px;padding:0 10px;font-size:11px}
.btn.ghost{background:transparent}
.btn.sq{width:34px;padding:0;font-size:17px}
.btn .gi{width:14px;height:14px}
.dim{opacity:.45;pointer-events:none;filter:saturate(.6)}

/* ------------------------------------------------------------ main tabs */
.tabs{flex:none;display:flex;flex-direction:column;gap:1px;padding:4px;width:172px;background:#0e0d0a;border-right:1px solid var(--border);overflow:hidden}
.tab{position:relative;flex:1 1 0;max-height:52px;min-height:28px;display:flex;align-items:center;gap:8px;padding:0 8px;text-align:left;font-weight:600;font-size:11.5px;color:var(--muted);background:var(--panel)}
.tab .gi{width:17px;height:17px}
.tab .lbl{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.tab .lbl small{font-weight:400;font-size:9.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .lbl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs:not(.roomy) .tab .lbl small{display:none}
.tab.on{color:var(--gold-bright);background:linear-gradient(90deg,var(--sel),#1f1a12);border-color:var(--gold-deep)}
.tab.on::before{content:"";position:absolute;left:-1px;top:5px;bottom:5px;width:3px;background:var(--gold)}
.tab.on small{color:var(--gold-deep)}
.newdot{position:absolute;right:7px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 7px var(--gold)}
.tabs.solo{width:48px;padding:4px}.tabs.solo .tab{justify-content:center;padding:0}.tabs.solo .lbl{display:none}
.tabs.solo .tab{max-height:48px}
@container win (max-width:699px){
  .main{flex-direction:column}
  .tabs{width:auto;flex-direction:row;flex-wrap:wrap;gap:3px;border-right:0;border-bottom:1px solid var(--border);padding:4px;display:grid;grid-template-columns:repeat(var(--cols,5),1fr)}
  .tab{max-height:none;min-height:36px;justify-content:center;flex-direction:column;gap:1px;padding:3px 2px;font-size:11px;text-align:center}
  .tab .lbl small{display:none}
  .tab .lbl{align-items:center}
  .tab.on::before{left:6px;right:6px;top:auto;bottom:-1px;width:auto;height:3px}
  .tabs.solo{width:auto;display:flex;justify-content:center;padding:3px}.tabs.solo .tab{flex:none;flex-direction:row;gap:7px;padding:0 16px;min-height:30px}.tabs.solo .lbl{display:flex}
  .hdr .who{display:none}
}

/* ------------------------------------------------------------ option area */
.area{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding-top:var(--cap)}
.page{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{overflow-y:auto;overflow-x:hidden;min-height:0;scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
.pad{padding:8px 10px 12px}
.eyebrow{font:600 10px Baskerville,Georgia,serif;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
h2.sec{font-size:13px;font-weight:700;color:var(--gold-bright);margin:0 0 4px}
p.hint{font-size:11px;color:var(--muted);margin:0 0 6px}
.card{position:relative;background:linear-gradient(180deg,var(--raised),var(--panel));border:1px solid var(--border);padding:8px 10px}
.card.sel{border-color:var(--gold);background:linear-gradient(180deg,#352a1a,#241d13)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;line-height:1.4;padding:0 7px;border:1px solid #8a6b3c66;color:var(--gold);background:#2a21124d;white-space:nowrap;border-radius:2px}
.chip.ok{color:var(--success);border-color:#8fc07a55;background:#1f2d1a55}
.chip.warn{color:var(--danger);border-color:#df927b55;background:#2d1a1555}
.chip.quiet{color:var(--muted);border-color:var(--border);background:transparent}
.chip.new{color:#1a1208;background:var(--gold);border-color:var(--gold);font-weight:700;letter-spacing:.4px}
.bar{height:5px;background:var(--inset);border:1px solid var(--border);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-deep),var(--gold))}

/* ------------------------------------------------------------ group pages (the summary editor) */
.ed{flex:1;min-height:0;display:flex;flex-direction:column;padding:6px 8px 0}
.ed-top{flex:none;display:flex;gap:6px;height:30px;margin-bottom:5px}
.ed-top .search{flex:1;min-width:0;background:var(--inset);border:1px solid var(--border);padding:0 9px;font-size:11.5px}
.ed-top .search::placeholder{color:var(--faint)}
.ed-top .btn{min-height:30px;font-size:10.5px;padding:0 10px}
.chips{flex:none;display:grid;grid-template-columns:repeat(var(--gcols,3),minmax(0,1fr));gap:4px;margin-bottom:5px}
.gchip{position:relative;min-width:0;display:flex;align-items:center;gap:7px;min-height:44px;padding:4px 8px 4px 7px;text-align:left;background:var(--panel);color:var(--muted)}
.gchip .t{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.gchip .t b{font-size:11px;font-weight:600;white-space:normal;color:inherit;overflow-wrap:anywhere}
.gchip .t small{font-size:9.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gchip.on{color:var(--gold-bright);background:linear-gradient(180deg,#352a1a,#241d13);border-color:var(--gold-deep)}
.gchip.on .t small{color:var(--gold-deep)}
.gchip .mark{position:absolute;right:5px;top:3px;display:flex;gap:3px;align-items:center;font-size:10px;color:var(--gold)}
.gchip .mark .newdot{position:static;width:7px;height:7px}
.gchip.focus,.focusring{animation:ring 1.4s ease-in-out infinite;border-color:var(--gold)}
@keyframes ring{50%{box-shadow:0 0 0 3px #d3af7266,0 0 16px #d3af7255}}
.ed-scroll{flex:1;min-height:0;padding:2px 2px 10px}
.gdesc{font-size:11.5px;color:var(--muted);margin:3px 0 7px;line-height:1.45}
.qp{margin-bottom:8px}
.qp .cap{font-size:10.5px;color:var(--muted);margin-bottom:3px}
.well{display:flex;align-items:center;width:100%;min-height:34px;padding:4px 10px;text-align:left;background:var(--inset);border:1px solid var(--border);font-size:12px;gap:8px}
.well .v{flex:1;min-width:0}
.well .go{color:var(--faint);font-size:15px;line-height:1}
.well:hover:not(:disabled){border-color:var(--gold-deep);background:#14110d}
.qp .well{min-height:36px;font-size:13px;font-weight:600}
.qp .qd{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}
.sect{font-size:12px;font-weight:700;color:var(--gold);margin:9px 0 3px}
.opt{display:flex;flex-direction:column;gap:2px;padding:6px 0 7px;border-top:1px solid #2a2418}
.opt:first-of-type{border-top:0}
.opt .row{display:flex;align-items:center;gap:8px;min-height:36px}
.opt .lb{flex:1;min-width:0;font-size:12px;color:var(--text);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.opt .lb.off{color:var(--muted)}
.opt .well{width:auto;min-width:128px;max-width:58%;flex:none;min-height:32px;font-size:11.5px}
.opt.changed{box-shadow:inset 3px 0 0 var(--gold);padding-left:8px}
.opt .why{font-size:10px;color:var(--faint);margin-left:0}
.help{width:22px;height:22px;font-size:11px;border-radius:50%;flex:none;color:var(--muted)}
.empty{font-size:11.5px;color:var(--muted);padding:12px 4px}

/* ------------------------------------------------------------ overview */
.ov{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 10px;gap:8px;overflow-y:auto}
.modeline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.modeline .msg{font-size:11px;color:var(--muted);flex:1;min-width:180px}
.modeline .msg.on{color:var(--success)}
.styles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.style{display:flex;flex-direction:column;gap:5px;text-align:left;padding:9px 10px;min-height:92px}
.style .nm{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.style .ds{font-size:11px;color:var(--muted);line-height:1.4}
.style.sel .nm{color:var(--gold-bright)}
.style .facts{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}
.teaser{display:flex;gap:12px;align-items:center;border-style:dashed;background:linear-gradient(90deg,#1a1610,#13110d)}
.teaser .num{flex:none;width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--gold-deep);border-radius:50%;font:700 15px Baskerville,Georgia,serif;color:var(--gold-bright);background:radial-gradient(circle,#3b2d18,#14100a)}
.teaser .tx{flex:1;min-width:0}
.teaser .tx b{display:block;font-size:12.5px}
.teaser .tx small{display:block;font-size:11px;color:var(--muted)}
.teaser .bar{margin-top:5px;max-width:260px}
.teaser .pages{flex:none;text-align:right;font-size:10.5px;color:var(--muted);line-height:1.3}
.teaser .pages b{display:block;font-size:14px;color:var(--gold-bright);font-weight:600}
@container win (max-width:699px){.styles{grid-template-columns:1fr}.style{min-height:0}}
@container win (min-width:700px) and (max-width:860px){.style .ds{font-size:10.5px}}

/* ------------------------------------------------------------ skills */
.sk{flex:1;min-height:0;display:flex;padding:4px 8px 6px;gap:6px}
.skmain{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.panel{background:linear-gradient(180deg,#191611,#13110d);border:1px solid var(--border)}
.pts{flex:none;height:30px;display:flex;align-items:center;padding:0 10px;font-size:12px;color:var(--gold)}
.pts b{margin-left:6px;font-size:13px;color:var(--gold-bright)}
.skl{flex:1;min-height:0;padding:0 6px 6px}
.skcard{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:5px 8px;text-align:left;margin-bottom:4px;background:linear-gradient(180deg,var(--raised),var(--panel))}
.skcard img{width:32px;height:32px;border:1px solid var(--edge);background:var(--inset);flex:none;border-radius:50%}
.skcard.passive img{border-radius:6px}
.skcard .t{flex:1;min-width:0}
.skcard .t b{display:block;font-size:12.5px}
.skcard .t small{font-size:10.5px;color:var(--muted)}
.skcard.on{border-color:var(--gold);background:linear-gradient(180deg,#352a1a,#241d13)}
.skcard.eq .t small{color:var(--success)}
.side{flex:none;width:260px;display:flex;flex-direction:column;gap:6px;min-height:0}
.insp{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.insp .body{flex:1;min-height:0;padding:8px 10px}
.insp .hd{display:flex;gap:9px;align-items:center;margin-bottom:6px;padding-right:26px}
.insp .hd img{width:38px;height:38px;border-radius:50%;border:2px solid var(--edge)}
.insp .hd.passive img{border-radius:8px}
.insp h3{font-size:14px;color:var(--gold-bright)}
.insp .meta{font-size:10.5px;color:var(--muted)}
.insp .ds{font-size:11.5px;line-height:1.5;color:#d8ccb4;margin:4px 0 6px}
.insp .req{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted);margin:2px 0}
.insp .req.met{color:var(--text)}
.insp .req i{font-style:normal;width:12px;text-align:center}
.insp .acts{flex:none;display:flex;gap:6px;padding:6px 8px;border-top:1px solid var(--border)}
.insp .acts .btn{min-height:32px}
.insp .acts .grow{flex:1}
.pips{display:flex;gap:3px;margin-top:3px}.pips i{width:10px;height:10px;transform:rotate(45deg) scale(.7);background:var(--inset);border:1px solid var(--border)}.pips i.f{background:var(--gold);border-color:var(--gold-bright)}
.insp .x{position:absolute;right:4px;top:4px;width:24px;height:24px;display:grid;place-items:center}
.insp .x .gi{width:11px;height:11px}
.insp .blank{display:grid;place-items:center;text-align:center;color:var(--muted);padding:16px;font-size:11.5px;flex:1}
.bar-eq{flex:none;padding:6px 8px 7px}
.bar-eq .hd{display:flex;align-items:center;margin-bottom:4px;font-size:11px;color:var(--gold)}
.bar-eq .hd .btn{margin-left:auto}
.slots{display:flex;gap:6px;justify-content:center}
.slotb{position:relative;width:54px;height:62px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0;background:transparent;border:0}
.slotb .ring{width:46px;height:46px;border-radius:50%;border:2px solid var(--edge);background:var(--void);display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 8px #000}
.slotb .ring img{width:100%;height:100%;display:block}
.slotb .ring.empty{border-style:dashed;color:var(--faint);font-size:11px}
.slotb.ult .ring{border-color:var(--gold-deep);transform:rotate(45deg) scale(.84);border-radius:10px}
.slotb.ult .ring>*{transform:rotate(-45deg) scale(1.18)}
.slotb .nm{font-size:9.5px;color:var(--muted);max-width:56px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slotb.tgt .ring{border-color:var(--gold);box-shadow:0 0 0 2px #d3af7288}
.slotb:hover:not(:disabled){background:transparent}
.slotb:hover:not(:disabled) .ring{border-color:var(--gold-deep)}
.slotb.lock{opacity:.5}
.railv{flex:none;width:70px;display:flex;flex-direction:column;gap:4px;padding:6px 3px;align-items:center}
.railv .slotb{width:62px}
@container win (max-width:699px){
  .sk{flex-direction:column}.side{width:auto;flex:none}.skl{min-height:120px}
  .insp{flex:none;max-height:240px}
}

/* ------------------------------------------------------------ policy page (use policy of one skill) */
.pol{flex:1;min-height:0;display:flex;padding:4px 8px 6px;gap:6px}
.pol .col{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;gap:5px}
.pol .top{flex:none;display:flex;align-items:center;gap:8px;height:30px}
.pol .top .nm{font-size:13px;font-weight:700;color:var(--gold-bright);display:flex;align-items:center;gap:7px}
.pol .top .nm img{width:22px;height:22px;border-radius:50%;border:1px solid var(--edge)}
.ptabs{flex:none;display:grid;grid-template-columns:repeat(var(--pc,3),minmax(0,1fr));gap:4px}
.ptab{display:flex;align-items:center;gap:6px;min-height:34px;padding:2px 6px 2px 9px;text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--panel)}
.ptab .t{flex:1;min-width:0}
.ptab.on{color:var(--gold-bright);background:linear-gradient(180deg,#352a1a,#241d13);border-color:var(--gold-deep)}
.radio{flex:none;width:22px;height:22px;border-radius:4px;border:1px solid var(--edge);background:var(--inset);display:grid;place-items:center;font-size:12px;color:var(--success);font-weight:700;padding:0}
.radio.act{border-color:var(--success)}
.plate{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.pexp{flex:1;min-height:0;display:flex;gap:8px;padding:8px;position:relative}
.pexp .info{flex:none;width:34%;min-width:150px;display:flex;flex-direction:column;gap:5px;min-height:0}
.pexp .info .st{font-size:10px;color:var(--muted)}
.pexp .info .st.ok{color:var(--success)}
.pexp .info .tx{font-size:12.5px;font-weight:600;line-height:1.4;color:var(--text)}
.pexp .info .note{font-size:10.5px;color:var(--muted);line-height:1.4}
.pexp .info .live{font-size:10.5px;color:var(--text);font-variant-numeric:tabular-nums}
.pexp .info .obs{margin-top:auto;display:flex;flex-direction:column;gap:5px}
.obsbar{height:5px;background:var(--inset);border:1px solid var(--border)}.obsbar>i{display:block;height:100%;background:var(--success);width:0}
.art{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;gap:4px}
.art .lbl{font-size:10px;color:var(--gold)}
.art .view{flex:1;min-height:90px;position:relative;background:#000;border:1px solid var(--border)}
.art canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.art .ctl{position:absolute;right:5px;top:5px;display:flex;gap:4px;z-index:2}
.art .ctl button{width:28px;height:26px;font-size:12px;background:#14110dcc}
.art .ctl button.on{border-color:var(--gold);color:var(--gold-bright)}
@container win (max-width:699px){
  .pol{flex-direction:column}.railv{flex-direction:row;width:auto;justify-content:center}
  .pexp{flex-direction:column}.pexp .info{width:auto;min-width:0}.art .view{min-height:150px;aspect-ratio:1.15}
}

/* ------------------------------------------------------------ presets page */
.pre{padding:8px 10px}
.pslot{display:flex;align-items:center;gap:8px;padding:5px 8px;margin-bottom:4px;min-height:38px}
.pslot .no{width:22px;font-weight:700;color:var(--gold)}
.pslot.cur .no{color:var(--success)}
.pslot .nm{flex:1;min-width:0}
.pslot .well{min-height:28px;max-width:220px;width:100%}

/* ------------------------------------------------------------ dialogs */
#overlay,#gate{position:absolute;inset:0;pointer-events:none}
#overlay>*{pointer-events:auto}
#gate>.blk,#gate>.hole,#gate>.softring,#gate>.caption{pointer-events:auto}
#gate>.hole,#gate>.softring,#gate>.caption{pointer-events:none!important}
.blocker{position:absolute;inset:0;background:rgba(0,0,0,.75)}
.dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(450px,calc(100% - 20px));max-height:calc(100% - 16px);display:flex;flex-direction:column;background:linear-gradient(180deg,#1c1913,#13110d);border:1px solid var(--edge);box-shadow:0 14px 44px #000d}
.dlg .dh{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-bottom:1px solid var(--border)}
.dlg .dh h3{flex:1;font-size:14px;color:var(--gold-bright)}
.dlg .db{padding:8px 12px;overflow:auto;min-height:0}
.dlg .df{display:flex;gap:8px;justify-content:flex-end;padding:7px 12px;border-top:1px solid var(--border);background:#100e0b}
.qchoice{display:block;width:100%;text-align:left;padding:9px 11px;margin-bottom:5px;min-height:56px}
.qchoice b{display:block;font-size:13px}
.qchoice span{font-size:11px;color:var(--muted);line-height:1.4}
.qchoice.sel{border-color:var(--gold);background:linear-gradient(180deg,#352a1a,#241d13)}
.qchoice.sel b{color:var(--gold-bright)}
.qchoice.custom{border-style:dashed}
.numrow{display:flex;gap:6px;align-items:center}
.numrow input{flex:1;min-width:0;height:36px;background:var(--inset);border:1px solid var(--border);padding:0 10px;font-size:15px;text-align:center}
.numrow .btn.sq{min-height:36px;height:36px}
.range{font-size:11px;color:var(--muted);margin:6px 0 3px}
.err{font-size:11px;color:var(--danger);min-height:16px}
.vals{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.vals button{min-height:26px;padding:0 10px;font-size:11px}
.pickrow{display:flex;align-items:center;gap:8px;width:100%;min-height:38px;padding:5px 11px;margin-bottom:4px;text-align:left;font-size:12.5px}
.pickrow.sel{border-color:var(--gold);background:linear-gradient(180deg,#352a1a,#241d13);color:var(--gold-bright)}
.pickrow .ck{width:16px;color:var(--gold)}
.bubble{position:absolute;display:flex;gap:2px;padding:5px;background:linear-gradient(180deg,var(--raised),var(--panel));border:1px solid var(--gold-deep);box-shadow:0 6px 20px #000b}
.bubble button{width:36px;height:36px;font-size:22px;background:transparent;border-color:transparent}
.bubble button img{width:30px;height:30px;display:block;margin:auto}
.bubble i{width:1px;background:var(--border);margin:6px 2px}

/* ------------------------------------------------------------ tutorial layers */
.blk{position:absolute;background:rgba(4,3,2,.8);z-index:60}
.hole{position:absolute;z-index:61;border:2px solid var(--gold);box-shadow:0 0 0 3px #d3af7255,0 0 22px #d3af7288;pointer-events:none!important;animation:ring 1.4s ease-in-out infinite}
.caption{position:absolute;z-index:62;display:flex;gap:10px;align-items:center;padding:6px 10px;background:linear-gradient(180deg,#2d2315,#1b150c);border-bottom:1px solid var(--gold);pointer-events:none}
.caption .halo{flex:none;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#fff6d8 0,#e9c777 36%,#6b4a1b 66%,transparent 70%);box-shadow:0 0 16px #f2d9a4aa}
.caption .nm{font-size:10px;letter-spacing:.3px;color:var(--gold)}
:lang(en) .caption .nm{letter-spacing:1.6px}
.caption .tx{font-size:12.5px;font-weight:600;line-height:1.35;color:var(--text)}
.caption.soft .halo{display:none}
.caption.soft{background:linear-gradient(180deg,#221b11,#15110b)}
.softring{position:absolute;z-index:61;border:2px solid var(--gold);box-shadow:0 0 0 3px #d3af7244,0 0 16px #d3af7266;pointer-events:none!important;animation:ring 1.4s ease-in-out infinite}
.beat{position:relative;flex:none;display:flex;gap:0;margin:0 0 5px;border:1px solid var(--gold-deep);background:linear-gradient(180deg,#2a2114,#1a1510)}
.beat.collapsed{width:100%;align-items:center;gap:8px;min-height:28px;padding:0 9px;text-align:left;font-size:11px}
.beat.collapsed .bn{color:var(--gold-bright);font-weight:700}
.beat.collapsed .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.beat.collapsed .tx b{color:var(--gold);font-weight:600;margin-right:4px}
.beat .dots{display:flex;gap:3px}.beat .dots i{width:6px;height:6px;border-radius:50%;background:var(--inset);border:1px solid var(--edge)}.beat .dots i.f{background:var(--gold);border-color:var(--gold)}.beat .dots i.d{background:var(--gold-deep);border-color:var(--gold-deep)}
.beat .chev,.beatx{color:var(--gold);font-size:12px}
.beatx{position:absolute;right:0;top:0;width:24px;height:22px;background:transparent;border:0}
.beat .b{flex:1;min-width:0;padding:4px 8px;border-left:1px solid #5e4f3a66;position:relative}
.beat .b:first-child{border-left:0}
.beat .b small{display:block;font-size:9px;letter-spacing:1px;color:var(--gold);text-transform:uppercase}
.beat .b span{display:block;font-size:11px;color:var(--text);line-height:1.3;max-height:2.6em;overflow:hidden}
.beat .b.now{background:#3a2d1a}
.beat .b.later span{color:var(--muted)}
@container win (max-width:699px){.beat{flex-direction:column}.beat .b{border-left:0;border-top:1px solid #5e4f3a66;padding:3px 8px}.beat .b:first-child{border-top:0}.beat .b span{max-height:none}}
.beat.collapsed{flex-direction:row!important}
.devbadge{position:absolute;left:6px;bottom:52px;z-index:90;font:10px ui-monospace,Menlo,monospace;color:#ffb0a0;background:#2b1210e0;border:1px solid var(--danger);padding:2px 6px}
#toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:80;padding:6px 14px;background:#2b2214;border:1px solid var(--gold);color:var(--gold-bright);font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}

.railv .btn{font-size:9.5px;padding:0 3px;min-height:36px;white-space:normal;line-height:1.15;width:100%}
</style>
</head>

hod","value":"SKILL_IF_NEEDED"},{"id":"dodge.interrupt","value":"CANCEL_ALLOWED"}],"choices":[]},{"id":"balanced","ko":"걷기 우선 회피","en":"Walk away first","dko":"걷기로 위험을 피하고 기절·빙결과 합산 피해 25%에 대응합니다.","den":"Prefer walking; react to stun, freeze and 25% combined damage.","values":[{"id":"dodge.control","value":"STUN,FREEZE"},{"id":"dodge.overlap","value":"ON"},{"id":"dodge.totalHpPercent","value":"25"}],"choices":[]},{"id":"finish","ko":"현재 공격 마무리","en":"Finish the current attack","dko":"공격을 마친 뒤 걷기로 회피합니다. 합산 피해 기준은 40%입니다.","den":"Finish the current attack before walking away; use a 40% combined damage threshold.","values":[{"id":"dodge.overlap","value":"ON"},{"id":"dodge.totalHpPercent","value":"40"}],"choices":[]}],"global/survival.defenseSkill":[{"id":"walk","ko":"보행 후퇴","en":"Retreat on foot","dko":"지정 스킬 없이 보행 후퇴를 우선합니다.","den":"Prioritize walking away without assigning a survival skill.","values":[{"id":"survival.order","value":"WALK,DEFENSE,ESCAPE"},{"id":"survival.fallback","value":"WALK"}],"choices":[]},{"id":"defend","ko":"방어 후 이탈","en":"Defend, then escape","dko":"장착한 생존기를 지정해 방어 후 이탈합니다. 사용할 수 없으면 걷기로 후퇴합니다.","den":"Assign equipped survival skills, defend, then escape; walk if skills are unavailable.","values":[{"id":"survival.defenseSkill","value":"@equipped"},{"id":"survival.escapeSkill","value":"@equipped"},{"id":"survival.fallbackSkill","value":"@equipped"},{"id":"survival.fallback","value":"WALK"},{"id":"survival.reserveSkill","value":"ON"},{"id":"survival.reserveResource","value":"ON"}],"choices":[]},{"id":"escape","ko":"이탈기 우선","en":"Escape skill first","dko":"장착한 회피기를 우선하고 이탈용 자원을 남깁니다. 회피기가 없으면 걷기로 후퇴합니다.","den":"Prioritize an equipped escape skill and reserve its resource; walk if none is available.","values":[{"id":"survival.defenseSkill","value":"@equipped"},{"id":"survival.escapeSkill","value":"@equipped"},{"id":"survival.order","value":"ESCAPE,WALK,DEFENSE"},{"id":"survival.fallback","value":"WALK"},{"id":"survival.reserveSkill","value":"ON" lures","value":"2"}],"choices":[]},{"id":"half-hour","ko":"30분 사냥","en":"A 30-minute session","dko":"30분 또는 연속 실패 3회에 도달하면 중단합니다.","den":"Stop after 30 minutes or 3 consecutive failures.","values":[{"id":"repeat.minutes","value":"30"}],"choices":[]},{"id":"unlimited","ko":"시간·횟수 제한 없음","en":"No time or run limit","dko":"시간·완료 횟수 목표 없이 진행하되 연속 실패 3회에는 중단합니다.","den":"Continue without time or completion limits, but stop after 3 consecutive failures.","values":[],"choices":[]}],"global/repeat.freeSlots":[{"id":"balanced","ko":"일반 준비","en":"Standard preparation","dko":"가방 여유 제한 없이 결과를 3초간 확인한 뒤 다음 판을 검토합니다.","den":"Review results for 3 seconds before the next run, with no minimum free-slot requirement.","values":[],"choices":[]},{"id":"space","ko":"가방 여유 확보","en":"Require bag space","dko":"빈칸 다섯 개를 확보하고 결과를 5초간 표시합니다.","den":"Require five free slots and show results for 5 seconds.","values":[{"id":"repeat.freeSlots","value":"5"},{"id":"repeat.resultSeconds","value":"5"}],"choices":[]},{"id":"fast","ko":"빠른 다음 판","en":"Quick next run","dko":"빈칸 한 개 이상을 확보하고 결과 대기를 1초로 줄입니다.","den":"Require at least one free slot and reduce the result wait to 1 second.","values":[{"id":"repeat.freeSlots","value":"1"},{"id":"repeat.resultSeconds","value":"1"}],"choices":[]}],"basic/WARRIOR":[{"id":"fill","ko":"스킬 사이 공격","en":"Fill between skills","dko":"기본 공격으로 스킬 사이의 빈 시간을 채웁니다.","den":"Use basic attacks to fill gaps between skills.","values":[],"choices":[]},{"id":"resource","ko":"자원 보충 우선","en":"Recover resources","dko":"기본 공격을 자원 보충에 맞추고 현재 대상을 우선합니다.","den":"Use basic attacks for resource recovery and favor the current target.","values":[{"id":"2","value":"RESOURCE"},{"id":"3","value":"CURRENT"}],"choices":[]},{"id":"finish","ko":"약한 적 마무리","en":"Finish weak enemies","dko":"남은 HP가 적은 대상을 기본 공격으로 마무리합니다.","den":"Finish low-health enemies with basic attacks.","values":[{"id":"2","value":"FINISH"},{"id":"3","value":"LOW_HP"}],"choices":[]}],"basic/RANGER":[{"id":"fill","ko":"스킬 사이 공격","en ll identities","dko":"선지급·설치·잔상 준비를 먼저 하고 공격합니다. 접지창은 연쇄 번개보다 먼저 시전하며 장착한 스킬만 순서에 넣습니다.","den":"Borrow and set up placements or afterimages before attacks. Place Grounding Spear before Chain Lightning; consider equipped skills only.","values":[],"choices":[]}],"skill/A01":[{"id":"steady","ko":"한 명도 빠르게 관통","en":"Quick single-target pierce","dko":"적 한 명만 보여도 관통 사격을 사용합니다.","den":"Fire a piercing shot even at a single enemy.","values":[{"id":"2","value":"ONE"},{"id":"3","value":"CURRENT"}],"choices":[]},{"id":"pack","ko":"두 명 이상 관통","en":"Pierce two or more","dko":"실제 사선에 적 두 명 이상이 들어오면 발사합니다.","den":"Fire once at least two enemies are on the actual line of fire.","values":[{"id":"2","value":"TWO"},{"id":"4","value":"MOST_HITS"}],"choices":[]},{"id":"elite","ko":"강적 우선 관통","en":"Prioritise strong targets","dko":"정예 또는 보스 방향을 우선하여 관통 사격을 사용합니다.","den":"Prioritise an elite or boss when aiming the piercing shot.","values":[{"id":"3","value":"ELITE"},{"id":"4","value":"TARGET"}],"choices":[]}],"skill/A02":[{"id":"pack","ko":"무리 정리","en":"Clear a pack","dko":"부채꼴 범위에 여러 적이 들어오는 방향으로 사격합니다.","den":"Fire toward several enemies within the fan-shaped attack area.","values":[],"choices":[]},{"id":"safe","ko":"먼 거리 사격","en":"Long-range fire","dko":"적과 거리를 벌리며 다중 사격을 사용합니다.","den":"Gain distance while using multi-shot.","values":[{"id":"2","value":"IMMEDIATE"},{"id":"4","value":"FAR"}],"choices":[]}],"skill/A03":[{"id":"pack","ko":"무리 중심 설치","en":"Place in the pack","dko":"적 무리가 모인 중심에 맹독 덫을 설치합니다.","den":"Place a poison trap in the centre of a group.","values":[],"choices":[]},{"id":"renew","ko":"대상 발밑 설치","en":"Place under the target","dko":"현재 대상의 위치에 고정 덫을 설치합니다. 덫은 대상을 따라가지 않습니다.","den":"Place a stationary trap at the target position. The trap does not follow its target.","values":[{"id":"2","value":"TARGET"},{"id":"3","value":"ONE"},{"id":"4","value":"REPLACE"},{"id":"5","value":"ALLOW"}],"choices":[]},{"id":"defend","ko":"추격 경로에 설치","en":"Place along the approach","dko":"관찰한 적의 접근 경로에 덫을 설치합니다.","den":"Place a trap along the observed enemy approach path.","values":[{"id":"2","value":"PATH"},{"id":"3","value":"ONE"}],"choices":[]}],"skill/A04":[{"id":"safe","ko":"안전 거리 복구","en":"Restore safe distance","dko":"접근한 적에게서 안전한 방향으로 후퇴합니다.","den":"Retreat in a safe direction from approaching enemies.","values":[{"id":"2","value":"DISTANCE"},{"id":"3","value":"SAFE"},{"id":"4","value":"RETREAT"}],"choices":[]},{"id":"trap-retreat","ko":"기존 덫 방향으로 후퇴","en":"Retreat toward an existing trap","dko":"이미 설치한 맹독 덫 방향으로 후퇴합니다. 전용 장비는 필요하지 않습니다.","den":"Retreat toward an already placed poison trap. No special equipment is required.","values":[{"id":"2","value":"DISTANCE"},{"id":"3","value":"OWN_TRAP"},{"id":"4","value":"RETREAT"}],"choices":[]},{"id":"escape","ko":"긴급 이탈용 보존","en":"Reserve for escape","dko":"평소에는 보존하고 전역 생존 조건을 만족할 때 이탈합니다.","den":"Reserve it until the global survival condition calls for an escape.","values":[{"id":"2","value":"OFF"}],"choices":[]}],"skill/A05":[{"id":"elite","ko":"강적 표식 유지","en":"Maintain a strong-target mark","dko":"정예 또는 보스에게 표식을 유지합니다. 재부여에는 실제 쿨타임이 적용됩니다.","den":"Maintain a mark on an elite or boss. Reapplication respects the actual cooldown.","values":[{"id":"2","value":"ELITE"},{"id":"3","value":"LONG_FIGHT"},{"id":"4","value":"KEEP"}],"choices":[]},{"id":"switch","ko":"현재 대상에 표식","en":"Mark the current target","dko":"현재 공격 대상에게 표식을 부여합니다. 대상 변경 시에도 쿨타임을 기다립니다.","den":"Mark the current attack target. A target switch still respects the cooldown.","values":[{"id":"2","value":"CURRENT"},{"id":"3","value":"IMMEDIATE"},{"id":"4","value":"NEW_TARGET"}],"choices":[]},{"id":"health","ko":"체력 높은 적에 표식","en":"Mark a high-health target","dko":"남은 체력이 많은 적에게 표식을 부여합니다.","den":"Mark an enemy with high remaining health.","values":[{"id":"2","value":"HIGH_HP"}],"choices":[]}],"skill/A06":[{"id":"steady","ko":"평소 사격 강화","en":"Empower regular shots","dko":"기본 사격을 그림자 추가 공격으로 강화합니다.","den":"Empower basic shots with shadow follow-up attacks.","values":[],"choices":[]},{"id":"elite","ko":"정예 관통 연계","en":"Elite piercing combination","dko":"정예를 향한 관통 사격이 준비됐을 때 사격을 강화합니다.","den":"Empower shots when piercing fire at an elite is ready.","values":[{"id":"2","value":"ELITE"},{"id":"3","value":"A01"},{"id":"4","value":"ELITE"}],"choices":[]}],"skill/A07":[{"id":"opportunity","ko":"연속 사격 우선","en":"Prioritise repeated shots","dko":"준비되면 바로 연속 사격합니다.","den":"Fire repeated shots whenever ready.","values":[],"choices":[{"id":"A07","choice":"opportunity"}]},{"id":"setup","ko":"자원 40% 남기기","en":"Keep 40% resources","dko":"사용 후에도 자원 40%가 남을 때만 사용합니다.","den":"Use it only when at least 40% resources will remain afterward.","values":[],"choices":[{"id":"A07","choice":"setup"}]}],"skill/A08":[{"id":"opportunity","ko":"기회가 생기면 조준","en":"Aim when an opportunity appears","dko":"준비되면 바로 조준합니다.","den":"Aim as soon as the skill is ready.","values":[],"choices":[{"id":"A08","choice":"opportunity"}]},{"id":"setup","ko":"표식·먼 거리 조준","en":"Aim at a distant marked target","dko":"표식 대상과 7m 이상 거리이며 가까운 위협이 없을 때 조준합니다.","den":"Aim at a marked target at least 7m away when there is no nearby threat.","values":[],"choices":[{"id":"A08","choice":"setup"}]}],"skill/A09":[{"id":"opportunity","ko":"바로 이동 봉쇄","en":"Restrict movement immediately","dko":"준비되면 바로 가시 덫을 설치합니다.","den":"Place a thorn trap whenever ready.","values":[],"choices":[{"id":"A09","choice":"opportunity"}]},{"id":"setup","ko":"제어 없는 적 우선","en":"Prioritise uncontrolled enemies","dko":"둔화·속박·기절·빙결이 없는 대상에게 먼저 설치합니다.","den":"Prioritise targets without slow, root, stun or freeze.","values":[],"choices":[{"id":"A09","choice":"setup"}]}],"skill/A10":[{"id":"opportunity","ko":"먼저 둔화시키기","en":"Slow enemies first","dko":"바로 덫을 사용하여 둔화를 부여합니다.","den":"Use the trap immediately to slow enemies.","values":[],"choices":[{"id":"A10","choice":"opportunity"}]},{"id":"setup","ko":"중독 후 빙결","en":"Freeze after poisoning","dko":"중독된 적에게 덫을 사용하여 추가 빙결을 일으킵니다.","den":"Use the trap against poisoned enemies to also freeze them.","values":[],"choices":[{"id":"A10","choice":"setup"}]}],"skill/A11":[{"id":"opportunity","ko":"근접 위협 떼어내기","en":"Divert nearby threats","dko":"3m 안으로 접근한 일반 적의 시선을 미끼로 돌립니다.","den":"Divert nearby normal enemies within 3m toward the decoy.","values":[],"choices":[{"id":"A11","choice":"opportunity"}]},{"id":"setup","ko":"무리의 시선 끌기","en":"Divert a threatening pack","dko":"영웅 주변 3m 안에 일반 적 세 명 이상이 있을 때 사용합니다.","den":"Use it when at least three normal enemies threaten the hero within 3m.","values":[],"choices":[{"id":"A11","choice":"setup"}]}],"skill/A12":[{"id":"opportunity","ko":"근접 위협에서 벗어나기","en":"Escape nearby threats","dko":"적이 3m 안으로 접근하면 피해 감소와 이동 속도 증가를 얻습니다.","den":"Gain damage reduction and movement speed when enemies approach within 3m.","values":[],"choices":[{"id":"A12","choice":"opportunity"}]},{"id":"setup","ko":"체력 위기 대응","en":"Respond to a health crisis","dko":"체력이 40% 이하일 때 사용합니다. 은신이나 무적은 아닙니다.","den":"Use it at 40% health or below. It does not grant invisibility or invulnerability.","values":[],"choices":[{"id":"A12","choice":"setup"}]}],"skill/A13":[{"id":"opportunity","ko":"중독 없는 적에게 사용","en":"Poison a new target","dko":"자신의 독화살 중독이 없는 적에게 사용합니다.","den":"Use it on an enemy without your poison-arrow damage over time.","values":[],"choices":[{"id":"A13","choice":"opportunity"}]},{"id":"setup","ko":"표식 대상 집중 중독","en":"Poison the marked target","dko":"사냥꾼의 표식이 붙은 적을 기다렸다 사용합니다.","den":"Wait for a hunter-marked enemy before firing.","values":[],"choices":[{"id":"A13","choice":"setup"}]}],"skill/A14":[{"id":"opportunity","ko":"한 명부터 발사","en":"Fire at even one enemy","dko":"적 한 명에게도 바로 발사합니다.","den":"Fire immediately even at a single enemy.","values":[],"choices":[{"id":"A14","choice":"opportunity"}]},{"id":"setup","ko":"세 명 모이면 분열","en":"Split when three gather","dko":"대상 주변 3m 안에 추가 적 두 명이 모이면 발사합니다.","den":"Fire when two additional enemies are within 3m of the target.","values":[],"choices":[{"id":"A14","choice":"setup"}]}],"skill/A15":[{"id":"opportunity","ko":"가능하면 바로 사용","en":"Use when available","dko":"적이 보이면 쇠뇌를 빠르게 설치합니다. 짧은 교전은 남은 사격을 낭비합니다.","den":"Places the ballista as soon as a target appears. Short fights waste remaining shots.","values":[],"choices":[{"id":"A15","choice":"opportunity"}]},{"id":"setup","ko":"정예·보스에게 사용","en":"Use against elites and bosses","dko":"오래 싸울 정예·보스에게 설치합니다. 일반 적을 정리할 추가 사격이 줄어듭니다.","den":"Deploys for longer elite or boss fights. Loses extra shots during ordinary clearing.","values":[],"choices":[{"id":"A15","choice":"setup"}]}],"skill/A16":[{"id":"opportunity","ko":"자원 부족 시 보충","en":"Restore low resources","dko":"자원 30% 이하에서 보충하고 다음 유료 스킬 비용을 줄입니다.","den":"Restore resources at 30% or below and discount the next paid skill.","values":[],"choices":[{"id":"A16","choice":"opportunity"}]},{"id":"setup","ko":"유료 사격 전에 준비","en":"Prepare before a paid shot","dko":"유료 스킬이 준비됐을 때 먼저 사용합니다.","den":"Prepare when a paid skill is ready.","values":[],"choices":[{"id":"A16","choice":"setup"}]}],"skill/A17":[{"id":"opportunity","ko":"강적 집중 소탕","en":"Suppress a strong target","dko":"정예 또는 보스가 포함된 고정 영역을 여러 번 타격합니다.","den":"Strike a fixed area containing an elite or boss repeatedly.","values":[],"choices":[{"id":"A17","choice":"opportunity"}]},{"id":"setup","ko":"제어된 무리 소탕","en":"Suppress a controlled pack","dko":"제어된 적 세 명 이상이 포함된 고정 영역을 여러 번 타격합니다.","den":"Strike a fixed area containing at least three controlled enemies repeatedly.","values":[],"choices":[{"id":"A17","choice":"setup"}]}],"skill/A18":[{"id":"opportunity","ko":"이동 사격","en":"Mobile shots","dko":"대상이 보이면 시작합니다. 선회 이동으로 잔상을 만들고 다음 직접 사격에 씁니다. 제자리에 서 있으면 추가 화살이 생기지 않습니다.","den":"Activate on a visible target; orbit to leave images and use them on the next direct shot. Standing still produces no extra arrows.","values":[],"choices":[{"id":"A18","choice":"opportunity"}]},{"id":"setup","ko":"사용 후 자원 70% 보존","en":"Leave 70% resource after casting","dko":"자원이 70% 이상일 때 추격을 시작합니다. 자원 회복을 기다리며 공격 창을 놓칩니다.","den":"Starts pursuit with at least 70% resource. Misses damage windows while waiting for resource.","values":[],"choices":[{"id":"A18","choice":"setup"}]}],"skill/M01":[{"id":"steady","ko":"꾸준히 발사","en":"Steady fire","dko":"준비될 때마다 화염구를 발사합니다. 이동하는 적에게는 예측 조준을 사용합니다.","den":"Fire whenever ready, using predictive aim for moving enemies.","values":[],"choices":[]},{"id":"pack","ko":"폭발 효율 우선","en":"Prioritise blast coverage","dko":"폭발 범위에 적 무리가 모일 때 발사합니다.","den":"Fire once a group gathers inside the blast area.","values":[{"id":"2","value":"GROUP"},{"id":"3","value":"DENSE"}],"choices":[]},{"id":"elite","ko":"강적 우선 화력","en":"Prioritise strong targets","dko":"정예 또는 보스를 우선하여 조준합니다.","den":"Prioritise an elite or boss when aiming.","values":[{"id":"3","value":"ELITE"}],"choices":[]}],"skill/M02":[{"id":"area","ko":"새 영역 확보","en":"Cover a new area","dko":"기존 눈보라와 겹치지 않게 새 적을 덮는 위치를 선택합니다.","den":"Cover new enemies while avoiding unnecessary overlap with an existing blizzard.","values":[],"choices":[]},{"id":"target-zone","ko":"대상 위치에 재설치","en":"Recast at the target","dko":"교전 대상의 위치에 고정 눈보라를 다시 설치합니다. 장판은 대상을 따라가지 않습니다.","den":"Recast a stationary blizzard at the combat target. The area does not follow it.","values":[{"id":"2","value":"KEEP_TARGET"},{"id":"3","value":"TARGET"},{"id":"4","value":"KEEP"},{"id":"5","value":"FIXED"}],"choices":[]},{"id":"defend","ko":"접근 경로에 설치","en":"Cover the approach","dko":"적이 접근하는 경로에 고정 눈보라를 설치합니다.","den":"Place a stationary blizzard on the enemy approach path.","values":[{"id":"3","value":"PATH"}],"choices":[]}],"skill/M03":[{"id":"steady","ko":"단독 적도 공격","en":"Attack isolated enemies","dko":"고립된 적 한 명에게도 연쇄 번개를 사용합니다.","den":"Use chain lightning even on a single isolated enemy.","values":[],"choices":[]},{"id":"linked","ko":"연결 무리 집중","en":"Wait for linked enemies","dko":"적들이 실제 연결 거리 안으로 모이면 공격합니다.","den":"Attack when enemies gather within the actual chaining distance.","values":[{"id":"2","value":"LINKED"}],"choices":[]}],"skill/M04":[{"id":"survival","ko":"위기 탈출용 보존","en":"Reserve for emergencies","dko":"전역 생존 조건을 만족할 때 안전한 곳으로 순간이동합니다.","den":"Teleport to safety when the global survival condition is met.","values":[{"id":"2","value":"SURVIVAL"}],"choices":[]},{"id":"distance","ko":"교전 거리 복구","en":"Restore combat distance","dko":"평상시에도 적과 교전 거리를 조절합니다.","den":"Adjust combat distance even outside an emergency.","values":[{"id":"2","value":"DISTANCE"}],"choices":[]},{"id":"sparse","ko":"적이 적은 곳으로 탈출","en":"Escape to a sparse area","dko":"피해 위험이 없는 후보 중 적이 적은 곳을 선택합니다.","den":"Choose a low-density destination among candidates without predicted damage.","values":[{"id":"2","value":"SURVIVAL"},{"id":"3","value":"SPARSE"},{"id":"4","value":"NO_DAMAGE"}],"choices":[]}],"skill/M05":[{"id":"prevent","ko":"피격 미리 대비","en":"Prepare for incoming damage","dko":"공격 예고에 맞춰 보호막을 먼저 사용합니다. 마지막 속성에 따른 첫 흡수 반응을 함께 사용합니다.","den":"Use the shield in anticipation of an attack. The first absorption also reacts to the remembered element.","values":[],"choices":[]},{"id":"chain","ko":"속성 흡수 대비","en":"Prepare elemental absorption","dko":"다른 보호막이 없을 때 새 교전에 보호막을 준비합니다. 이전 속성 공격의 첫 흡수 반응을 활용하며 공격을 받아 버티는 위치 설정과 연계합니다.","den":"Prepare a shield for a new encounter when no other shield remains. Use the preceding element on its first absorption with a position policy that accepts shielded hits.","values":[{"id":"2","value":"ENGAGE"},{"id":"3","value":"AFTER"}],"choices":[]},{"id":"emergency","ko":"긴급 생존용 보존","en":"Reserve for survival","dko":"체력이 낮아진 긴급 상황까지 보존합니다. 마지막 속성에 따른 첫 흡수 반응을 함께 사용합니다.","den":"Reserve it for a low-health emergency. The first absorption also reacts to the remembered element.","values":[{"id":"2","value":"EMERGENCY"}],"choices":[]}],"skill/M06":[{"id":"here","ko":"제자리 위기 제어","en":"Control danger in place","dko":"현재 위치에서 가까운 위험 시전을 제어합니다.","den":"Control a nearby dangerous cast from the current position.","values":[{"id":"3","value":"HERE"}],"choices":[]},{"id":"approach","ko":"접근 후 무리 빙결","en":"Approach and freeze a pack","dko":"안전하게 접근할 수 있는 적 두 명 이상을 범위에 넣고 빙결합니다.","den":"Approach safely and freeze at least two enemies within range.","values":[{"id":"2","value":"GROUP"},{"id":"3","value":"APPROACH"}],"choices":[]}],"skill/M07":[{"id":"opportunity","ko":"즉시 관통 발사","en":"Pierce immediately","dko":"적 한 명에게도 발사하고 관통 후 화상을 남깁니다.","den":"Fire even at one target, leaving burns after piercing.","values":[],"choices":[{"id":"M07","choice":"opportunity"}]},{"id":"setup","ko":"세 명 관통 대기","en":"Wait to pierce three","dko":"실제 사선에 적 세 명이 들어오면 발사합니다.","den":"Fire when three enemies enter the actual line of fire.","values":[],"choices":[{"id":"M07","choice":"setup"}]}],"skill/M08":[{"id":"opportunity","ko":"바로 화염 지대 만들기","en":"Create a fire area immediately","dko":"바로 장벽을 설치합니다. 영역 안에 머문 시간만큼 피해를 줍니다.","den":"Place the wall immediately. Damage depends on time actually spent in its area.","values":[],"choices":[{"id":"M08","choice":"opportunity"}]},{"id":"setup","ko":"제어된 적에게 겹치기","en":"Overlap controlled enemies","dko":"제어된 적이 실제 장벽 영역에 포함되게 설치합니다.","den":"Place the wall so a controlled target is inside its actual area.","values":[],"choices":[{"id":"M08","choice":"setup"}]}],"skill/M09":[{"id":"opportunity","ko":"먼저 둔화시키기","en":"Slow enemies first","dko":"빙하창 자체로 적에게 둔화를 부여합니다.","den":"Apply slowing with the ice spear itself.","values":[],"choices":[{"id":"M09","choice":"opportunity"}]},{"id":"setup","ko":"둔화 후 빙결","en":"Freeze slowed enemies","dko":"이미 둔화된 적에게 사용하여 빙결합니다.","den":"Use it on an already slowed enemy to freeze it.","values":[],"choices":[{"id":"M09","choice":"setup"}]}],"skill/M10":[{"id":"opportunity","ko":"귀환 회수","en":"Recover the return","dko":"대상이 보이면 왕복 경로를 쏘고 안전한 시전 위치에서 마나 회수를 노립니다. 회수 위치가 위험하거나 3m보다 멀면 회수를 포기합니다.","den":"Fire on sight and seek the safe cast location to recover mana on return. Give up recovery if the location is dangerous or farther than 3m.","values":[],"choices":[{"id":"M10","choice":"opportunity"}]},{"id":"setup","ko":"제어 사격","en":"Control shots","dko":"제어된 대상만 쏩니다. 회수 이동을 생략하고 현재 전투 위치를 유지합니다. 시전 위치를 벗어나면 회수 마나를 잃을 수 있습니다.","den":"Shoot controlled targets only and hold combat position instead of moving for pickup. Moving away from the cast location can lose the mana refund.","values":[],"choices":[{"id":"M10","choice":"setup"}]}],"skill/M11":[{"id":"opportunity","ko":"지속 피해용 설치","en":"Deploy for lasting damage","dko":"구체의 지속 피해와 종료 폭발을 사용합니다.","den":"Use the orb for periodic damage and an expiry blast.","values":[],"choices":[{"id":"M11","choice":"opportunity"}]},{"id":"setup","ko":"연쇄 번개 준비 후 설치","en":"Deploy with chain lightning ready","dko":"연쇄 번개의 쿨타임과 자원을 확보한 뒤 설치하고 실제 사용으로 충전합니다.","den":"Deploy once chain lightning is ready and affordable, then charge it with actual casts.","values":[],"choices":[{"id":"M11","choice":"setup"}]}],"skill/M12":[{"id":"opportunity","ko":"가능하면 바로 사용","en":"Use when available","dko":"사선이 열리면 바로 공격합니다. 연쇄 적중 후 자원 회수 기회를 놓칠 수 있습니다.","den":"Attacks whenever a firing line is open. Can miss the resource refund after Chain Lightning.","values":[],"choices":[{"id":"M12","choice":"opportunity"}]},{"id":"setup","ko":"연쇄 전에 접지","en":"Ground before chaining","dko":"M03이 준비되고 두 기술의 마나가 있을 때 먼저 중계창을 설치합니다. 창 설치에 먼저 행동과 마나를 씁니다.","den":"Place the relay first when M03 is ready and mana covers both skills. Spends an action and mana on setup first.","values":[],"choices":[{"id":"M12","choice":"setup"}]}],"skill/M13":[{"id":"native","ko":"안전한 자리에서 짧게 회복","en":"Recover briefly in safety","dko":"자원 35% 이하에서 주변이 안전할 때 50%까지 회복합니다.","den":"Recover to 50% from at most 35% resources when the surroundings are safe.","values":[],"choices":[{"id":"M13","choice":"native"},{"id":"M13:goal","choice":"short"}]},{"id":"hold","ko":"피격 감수 빠른 회복","en":"Recover while accepting damage","dko":"피격 중에도 제자리에서 50%까지 회복합니다. 전역 긴급 대응은 충전을 중단할 수 있습니다.","den":"Recover in place to 50% even while taking damage. Global emergency responses can interrupt charging.","values":[],"choices":[{"id":"M13","choice":"hold"},{"id":"M13:goal","choice":"short"}]},{"id":"retreat","ko":"거리 확보 후 충분히 회복","en":"Gain distance and recover fully","dko":"5m 거리 확보를 최대 2초 시도한 뒤 90%까지 회복합니다. 위험이 다시 가까워지면 중단합니다.","den":"Try for up to two seconds to gain 5m of space, then recover to 90%. Stop if danger approaches again.","values":[],"choices":[{"id":"M13","choice":"retreat"},{"id":"M13:goal","choice":"full"}]}],"skill/M14":[{"id":"opportunity","ko":"보호막이 없을 때 설치","en":"Deploy without a shield","dko":"보호막이 없는 교전에서 결계를 설치합니다.","den":"Deploy the ward in combat when no shield remains.","values":[],"choices":[{"id":"M14","choice":"opportunity"}]},{"id":"setup","ko":"체력 위기 때 설치","en":"Deploy in a health crisis","dko":"체력 50% 이하에서 결계를 설치합니다. 결계 안에서 피해 감소와 보호막을 얻습니다.","den":"Deploy at 50% health or below for a shield and damage reduction inside the ward.","values":[],"choices":[{"id":"M14","choice":"setup"}]}],"skill/M15":[{"id":"opportunity","ko":"자원 부족 시 보충","en":"Restore low resources","dko":"자원 30% 이하에서 보충합니다.","den":"Restore resources at 30% or below.","values":[],"choices":[{"id":"M15","choice":"opportunity"}]},{"id":"setup","ko":"세 원소 할인 준비","en":"Prepare three elemental discounts","dko":"화염·냉기·번개의 유료 일반 스킬을 갖추면 사용합니다. 각 원소의 첫 사용에 할인이 소비됩니다.","den":"Use it with paid fire, cold and lightning skills equipped. Each element consumes its discount on its first use.","values":[],"choices":[{"id":"M15","choice":"setup"}]}],"skill/M16":[{"id":"opportunity","ko":"한 명부터 끌어모으기","en":"Gather even one enemy","dko":"한 명에게도 사용하여 최초 끌어당김과 지속 피해를 줍니다.","den":"Use it even on one enemy for an initial pull and lasting damage.","values":[],"choices":[{"id":"M16","choice":"opportunity"}]},{"id":"setup","ko":"세 명 이상 집결","en":"Gather three or more","dko":"실제 영역에 적 세 명 이상이 모이면 사용합니다.","den":"Use it when three or more enemies gather inside the actual area.","values":[],"choices":[{"id":"M16","choice":"setup"}]}],"skill/M17":[{"id":"opportunity","ko":"강적 집중 붕괴","en":"Collapse a strong target","dko":"정예 또는 보스를 포함해 화염·냉기·번개 순서로 타격합니다.","den":"Strike an elite or boss with fire, cold and lightning in order.","values":[],"choices":[{"id":"M17","choice":"opportunity"}]},{"id":"group","ko":"네 명 이상 광역 붕괴","en":"Collapse a group of four","dko":"영역 안의 적 네 명 이상에게 세 원소 타격을 가합니다.","den":"Strike at least four enemies in the area with all three elements.","values":[],"choices":[{"id":"M17","choice":"group"}]}],"skill/M18":[{"id":"opportunity","ko":"강적 앞에서 즉시 강화","en":"Empower immediately against strong targets","dko":"강적 앞에서 즉시 보호막·공격 강화·비용 감소를 얻습니다.","den":"Immediately gain a shield, attack power and reduced costs against a strong target.","values":[],"choices":[{"id":"M18","choice":"opportunity"}]},{"id":"setup","ko":"세 원소 준비 후 강화","en":"Empower when three elements are ready","dko":"세 원소 스킬의 쿨타임과 필요한 자원을 확보한 뒤 강화하고 원소 순환 폭발을 일으킵니다.","den":"Empower once all three elemental skills are ready and affordable, then trigger elemental-cycle bursts.","values":[],"choices":[{"id":"M18","choice":"setup"}]}],"skill/W01":[{"id":"center","ko":"빠른 중앙 침투","en":"Quick central entry","dko":"적 무리의 중심으로 이동하며 회전합니다.","den":"Move into the centre of the pack while spinning.","values":[{"id":"2","value":"ANY"},{"id":"3","value":"CENTER"},{"id":"4","value":"CONTINUE"}],"choices":[]},{"id":"edge","ko":"생존 우선 전투","en":"Survival first","dko":"적 무리의 가장자리를 유지하며 회전합니다.","den":"Spin while staying at the edge of the pack.","values":[{"id":"2","value":"ANY"},{"id":"3","value":"EDGE"},{"id":"4","value":"CONTINUE"}],"choices":[]},{"id":"stand","ko":"제자리 집중 회전","en":"Stationary spin","dko":"현재 자리에서 3초씩 끊어 회전합니다.","den":"Spin in place in three-second bursts.","values":[{"id":"3","value":"STAND"},{"id":"4","value":"THREE_SECONDS"}],"choices":[]}],"skill/W02":[{"id":"advance","ko":"빠른 무리 진입","en":"Quick pack entry","dko":"가까운 적 두 명 이상을 향해 바로 도약합니다.","den":"Leap directly into a nearby pack of at least two enemies.","values":[{"id":"2","value":"ATTACK"},{"id":"3","value":"DENSE"},{"id":"4","value":"2"},{"id":"5","value":"GLOBAL"}],"choices":[]},{"id":"space","ko":"거리 확보 후 강타","en":"Leap after spacing","dko":"6m 거리를 최대 2초 동안 확보한 뒤 도약합니다. 확보하지 못해도 현재 거리에서 공격합니다.","den":"Try to gain 6m of space for up to two seconds before leaping. Attack from the current distance if spacing fails.","values":[{"id":"2","value":"ATTACK"},{"id":"3","value":"DENSE"},{"id":"4","value":"2"},{"id":"5","value":"GLOBAL"}],"choices":[{"id":"W02","choice":"space"}]},{"id":"escape","ko":"긴급 이탈용 보존","en":"Reserve for escape","dko":"평소에는 보존하고 전역 생존 조건에 따라 안전한 곳으로 이탈합니다.","den":"Reserve it for escaping to safety when the global survival condition is met.","values":[{"id":"2","value":"ESCAPE"},{"id":"3","value":"EDGE"}],"choices":[]}],"skill/W03":[{"id":"group","ko":"무리 한 번에 분쇄","en":"Crush a pack","dko":"여러 적을 포함하는 방향으로 분쇄 일격을 사용합니다.","den":"Aim the crushing strike through several enemies.","values":[{"id":"3","value":"MOST_HITS"},{"id":"4","value":"GROUP"}],"choices":[]},{"id":"elite","ko":"강적 우선 타격","en":"Strike strong enemies","dko":"정예 또는 보스를 우선하여 공격 방향을 정합니다.","den":"Prioritise an elite or boss when choosing the strike direction.","values":[{"id":"2","value":"ELITE"},{"id":"4","value":"READY"}],"choices":[]}],"skill/W04":[{"id":"group","ko":"무리 제어","en":"Control a pack","dko":"가까운 적 두 명 이상을 기절시킵니다.","den":"Stun at least two nearby enemies.","values":[],"choices":[]},{"id":"interrupt","ko":"위험 시전 차단","en":"Interrupt a threat","dko":"범위 안에서 실제 위험 시전을 준비하는 적을 방해합니다.","den":"Interrupt an enemy preparing a dangerous cast within range.","values":[{"id":"2","value":"INTERRUPT"}],"choices":[]},{"id":"retreat","ko":"후퇴 지원","en":"Cover a retreat","dko":"위기 상황에서 추격자를 제어하고 거리를 벌립니다.","den":"Control pursuers and gain distance in an emergency.","values":[{"id":"2","value":"RETREAT"},{"id":"4","value":"COMPLETE"}],"choices":[]}],"skill/W05":[{"id":"prevent","ko":"위험 미리 대비","en":"Prepare for damage","dko":"피격 예고에 맞춰 미리 보호막을 사용합니다.","den":"Use a shield in anticipation of incoming damage.","values":[],"choices":[]},{"id":"chain","ko":"보호막 이어 쓰기","en":"Chain shields","dko":"다른 보호막과 도약 방어 효과가 끝난 뒤 필요한 시점에 사용합니다.","den":"Wait for the other shield and leap defence to end before using it when needed.","values":[{"id":"3","value":"AFTER"},{"id":"4","value":"AFTER"}],"choices":[]},{"id":"emergency","ko":"긴급 생존용 보존","en":"Reserve for survival","dko":"체력이 낮아진 긴급 상황에서 사용합니다.","den":"Use it in a low-health emergency.","values":[{"id":"2","value":"EMERGENCY"}],"choices":[]}],"skill/W06":[{"id":"resource","ko":"자원 보충 집중","en":"Restore resources","dko":"공격할 자원이 부족할 때 함성으로 자원을 보충합니다.","den":"Restore resources with a shout when paid attacks cannot be afforded.","values":[{"id":"2","value":"RESOURCE"},{"id":"5","value":"ON"}],"choices":[]},{"id":"strong","ko":"강적전 공격 강화","en":"Empower strong-enemy fights","dko":"정예 또는 보스가 공격 범위에 들어오면 함성으로 공격을 강화합니다.","den":"Empower attacks once an elite or boss enters attack range.","values":[{"id":"2","value":"DAMAGE"},{"id":"3","value":"ELITE"},{"id":"4","value":"IN_RANGE"}],"choices":[]}],"skill/W07":[{"id":"native","ko":"낙인 유지","en":"Maintain the brand","dko":"같은 적의 낙인이 끝나갈 때 갱신합니다.","den":"Refresh the brand as it expires on the same target.","values":[],"choices":[{"id":"W07","choice":"native"}]},{"id":"opportunity","ko":"자원 부족 시 낙인","en":"Brand when resources are low","dko":"자원이 50% 이하일 때 낙인을 사용합니다.","den":"Apply the brand when resources are at 50% or below.","values":[],"choices":[{"id":"W07","choice":"opportunity"}]}],"skill/W08":[{"id":"opportunity","ko":"가까운 적도 즉시 끌기","en":"Pull even nearby enemies","dko":"거리가 가까워도 준비되면 적을 끌어옵니다.","den":"Pull the enemy when ready, even at close range.","values":[],"choices":[{"id":"W08","choice":"opportunity"}]},{"id":"setup","ko":"먼 적을 끌어오기","en":"Pull distant enemies","dko":"4m 이상 떨어진 적을 기다렸다 끌어옵니다.","den":"Wait for an enemy at least 4m away before pulling.","values":[],"choices":[{"id":"W08","choice":"setup"}]}],"skill/W09":[{"id":"native","ko":"무리·강적 우선 출혈","en":"Bleed packs or strong targets","dko":"강적 또는 가까운 적 세 명 이상에게 출혈을 부여합니다.","den":"Apply bleeding to a strong target or at least three nearby enemies.","values":[],"choices":[{"id":"W09","choice":"native"}]},{"id":"opportunity","ko":"한 명부터 출혈","en":"Bleed a single enemy","dko":"자신의 출혈이 없는 적 한 명에게도 사용합니다.","den":"Use it even on one target without your bleeding effect.","values":[],"choices":[{"id":"W09","choice":"opportunity"}]}],"skill/W10":[{"id":"opportunity","ko":"출혈 즉시 회수","en":"Reap bleeding immediately","dko":"자신이 만든 출혈을 바로 회수해 추가 피해와 회복을 얻습니다.","den":"Immediately reap your bleeding for extra damage and healing.","values":[],"choices":[{"id":"W10","choice":"opportunity"}]},{"id":"setup","ko":"출혈 끝·위기에 회수","en":"Reap near expiry or in danger","dko":"출혈이 1초 이하로 남거나 체력이 40% 이하일 때 회수합니다.","den":"Reap when bleeding has at most one second left or health is at 40% or below.","values":[],"choices":[{"id":"W10","choice":"setup"}]}],"skill/W11":[{"id":"opportunity","ko":"가능하면 바로 사용","en":"Use when available","dko":"짧은 거리도 전진해 피해 감소를 확보합니다. 이동기를 일찍 소비하고 위치가 바뀝니다.","den":"Uses even a short advance for mitigation. Spends mobility early and changes position.","values":[],"choices":[{"id":"W11","choice":"opportunity"}]},{"id":"setup","ko":"먼 적에게 사용","en":"Use against distant enemies","dko":"멀어진 적에게 접근할 때만 전진합니다. 붙어 있는 동안 방어·자원 회복 기회가 줄어듭니다.","den":"Advances only to close a gap. Loses mitigation and resource opportunities while close.","values":[],"choices":[{"id":"W11","choice":"setup"}]}],"skill/W12":[{"id":"opportunity","ko":"공격 예고에 맞춰 방어","en":"Defend against a windup","dko":"준비 동작을 보이는 적 앞에서 자세를 취합니다. 반격은 실제 막기 성공 시 발생합니다.","den":"Take the stance against an enemy winding up. A counter requires an actual successful block.","values":[],"choices":[{"id":"W12","choice":"opportunity"}]},{"id":"setup","ko":"체력 절반에서 방어","en":"Defend at half health","dko":"체력이 50% 이하일 때 사용합니다. 반격은 실제 막기 성공 시 발생합니다.","den":"Use it at 50% health or below. A counter requires a successful block.","values":[],"choices":[{"id":"W12","choice":"setup"}]}],"skill/W13":[{"id":"opportunity","ko":"한 명부터 끌어모으기","en":"Gather even one enemy","dko":"근처 적 한 명에게도 고리를 사용합니다.","den":"Use the ring even on a single nearby enemy.","values":[],"choices":[{"id":"W13","choice":"opportunity"}]},{"id":"setup","ko":"세 명 이상 모으기","en":"Gather three or more","dko":"실제 공격 범위에 적 세 명 이상이 모이면 사용합니다.","den":"Use it when at least three enemies are within the actual area.","values":[],"choices":[{"id":"W13","choice":"setup"}]}],"skill/W14":[{"id":"opportunity","ko":"즉시 파동 발사","en":"Fire a wave immediately","dko":"먼저 보이는 적에게 파동을 발사합니다.","den":"Fire the wave at the first available enemy.","values":[],"choices":[{"id":"W14","choice":"opportunity"}]},{"id":"setup","ko":"세 명 관통 대기","en":"Wait to pierce three","dko":"실제 직선 공격 범위에 적 세 명이 들어오면 발사합니다.","den":"Fire when three enemies are in the actual line attack.","values":[],"choices":[{"id":"W14","choice":"setup"}]}],"skill/W15":[{"id":"opportunity","ko":"자원 30% 이하에서","en":"Below 30% resource","dko":"자원이 충분히 빈 뒤 회복해 넘침을 줄입니다. 회복이 시작되기 전 공격이 끊길 수 있습니다.","den":"Waits for low resource to reduce overflow. Attacks can stop before recovery starts.","values":[],"choices":[{"id":"W15","choice":"opportunity"}]},{"id":"setup","ko":"자원 75% 이하에서","en":"Below 75% resource","dko":"자원이 75% 이하부터 회복을 미리 시작합니다. 전투가 끊기면 남은 회복을 낭비합니다.","den":"Starts recovery early below 75% resource. Wastes recovery if combat stops.","values":[],"choices":[{"id":"W15","choice":"setup"}]}],"skill/W16":[{"id":"opportunity","ko":"보호막이 없을 때 사용","en":"Use without a shield","dko":"보호막이 없는 교전에서 사용합니다.","den":"Use it in combat when no shield remains.","values":[],"choices":[{"id":"W16","choice":"opportunity"}]},{"id":"setup","ko":"둔화 해제용 보존","en":"Reserve to remove slowing","dko":"적에게 둔화를 받은 뒤 보호막을 만들고 둔화를 해제합니다.","den":"After being slowed by an enemy, create a shield and remove the slowing.","values":[],"choices":[{"id":"W16","choice":"setup"}]}],"skill/W17":[{"id":"opportunity","ko":"강적전 지원","en":"Support strong-enemy fights","dko":"정예 또는 보스 앞에서 선조의 지속 공격과 피해 감소를 받   const groupKey = g => g.ids[0], scopeOf = g => 'global/' + g.ids[0];

  const ruleOf = id => rules.find(r => r.ids.includes(id));

  // ------------------------------------------------------------ account and disclosure (HuntEdictProgression)

    for (const r of rules) if (r.stage >= 0 && (a.legacy || a.best >= r.stage && cond(r.condition))) r.ids.forEach(grant);
    if (a.legacy || a.best >= 2) grant('styles');

  const has = M.has = id => id !== 'autoEquip.preserveEffects' && acct.unlocks.has(id);

  M.condition = id => {

  };
  const SKIP = 'autoEquip.preserveEffects';
  M.newDraft = () => {
    const g = {};
    for (const o of D.options) g[o.id] = o.initial;
    g['potion.autoBuy'] = 'OFF'; g['autoEquip.enabled'] = 'OFF'; g['repeat.enabled'] = 'OFF'; g['bag.cleanupAt'] = 'OFF';

  M.starterButtonEnabled = W => {

        if (M.draft.actives[0] !== S.skill) return {name: 'edict-skill-equip', ko: '첫 스킬을 1번 슬롯에 장착하세요.', en: 'Equip your first skill to slot 1.'};

      if (W.managing) return !W.hasDialog ? {name: 'edict-active-slot-0', ko: '장착한 첫 스킬을 누르세요.', en: 'Tap your equipped first skill.'} : {name: 'edict-slot-policy', ko: '사용 방식을 열어 전투를 비교하세요.', en: 'Open its use policy to compare fights.'};
      if (W.policySkill !== S.skill) return {name: 'edict-policy-back', ko: '첫 스킬의 사용 방식을 여세요.', en: 'Open the first skill\'s use policy.'};
      const needed = step <= 0 ? S.start : S.pick;
      if (step === 3) return {name: 'starter-selection-area', ko: '두 방식을 확인했습니다. 원하는 방식을 활성화한 뒤 \'이 방식으로 사냥하기\'를 누르세요.', en: 'You have seen both. Activate the one you prefer, then press "Hunt this way".'};
      if (W.visiblePreset !== needed) return {name: 'edict-preset-tab-' + needed, ko: step === 1 ? '이제 방식 B를 눌러 같은 조건에서 비교하세요.' : '현재 구간의 사용 방식을 여세요.', en: step === 1 ? 'Now tap approach B to compare under the same conditions.' : 'Open the approach for this stretch.'};
      if (M.activePreset() !== needed) return {name: 'edict-preset-activate', ko: '이 사용 방식을 활성화해 저장하세요.', en: 'Activate this approach to save it.'};
      if (step === 1) return {name: 'edict-starter-next', ko: '방식 B 저장을 확인하고 비교를 시작하세요.', en: 'Confirm approach B is saved and start the comparison.'};

    }
    if (M.pro === 'survival') {

    const short = name === 'edict-save' ? T('저장하면 다음 사냥부터 적용됩니다.') : name.startsWith('edict-option-') ? T('이 항목을 눌러 값을 바꾸세요.') : name.startsWith('edict-quick-picker-') ? T('간편 프리셋을 눌러 하나 고르세요.') : T(f.body);

const captionText = () => { const g = currentGuide(); return g && W.open ? g.text : null; };

function contained(r, b) { return r.x >= b.x - 1 && r.y >= b.y - 1 && r.x + r.w <= b.x + b.w + 1 && r.y + r.h <= b.y + b.h + 1; }
function clipBounds(el) {
  let b = rel($('#app')); b = {x: 0, y: 0, w: metrics().lw, h: metrics().lh};
  for (let p = el.parentElement; p && p.id !== 'app'; p = p.parentElement)
    if (p.classList.contains('scroll') || p.classList.contains('area')) { const r = rel(p), x = Math.max(b.x, r.x), y = Math.max(b.y, r.y); b = {x, y, w: Math.min(b.x + b.w, r.x + r.w) - x, h: Math.min(b.y + b.h, r.y + r.h) - y}; }

// EnsureVisible (proposal): scroll the nearest scroll container so the designated control is inside its viewport.
function ensureVisible(el) {
  for (let p = el.parentElement; p && p.id !== 'app'; p = p.parentElement) {

let missingSince = 0, missingTimer = 0, lastName = '';
function drawGate() {
  const g = $('#gate'); g.innerHTML = ''; S.gateInfo = null;
  lessonTick();
  const guide = currentGuide(); if (!guide || guide.suppressed) { lastName = ''; return; }
  const m = metrics(); let h = '';
  const area = W.open ? ctlEl('Option area') : null;
  const ar = area ? rel(area) : null;
  // caption: docked in the reserved band at the top of the option area, so it never covers a control
  const cap = ar ? `left:${ar.x}px;top:${ar.y}px;width:${ar.w}px;height:${isLand() ? 44 : 58}px` : `left:50%;top:10px;transform:translateX(-50%);width:min(520px,calc(100% - 20px))`;
  h += `<div class="caption ${guide.hard ? '' : 'soft'}" data-ctl="edict-caption" style="${cap}"><span class="halo"></span><div><div class="nm">${guide.hard ? T('하늘의 목소리', 'VOICE OF THE EDICT') : T('안내', 'GUIDE')}</div><div class="tx">${esc(guide.text)}</div></div></div>`;
  let el = targetEl(guide.name);
  if (el && S.autoScroll && !contained(rel(el), clipBounds(el))) { ensureVisible(el); el = targetEl(guide.name); }
  const found = !!el, ok = found && (AREA[guide.name] || interactable(el));
  const r = found ? rel(el) : null, inView = found && contained(r, clipBounds(el));
  S.gateInfo = {name: guide.name, found, ok, inView, hard: guide.hard,
    text: `${guide.hard ? 'GATE' : 'RING'} ${guide.name} · ${found ? (ok ? 'ready' : 'disabled') : 'missing'}${found ? (inView ? ' · in view' : ' · OUT OF VIEW') : ''}`, warn: guide.hard && (!found || !ok || !inView)};
  if (guide.hard) {
    if (!found || !ok) {                                  // PrologueGate: input stays blocked for MissingGrace (2 s) while the target is missing
      if (guide.name !== lastName) { missingSince = performance.now(); clearTimeout(missingTimer); }
      const left = 2000 - (performance.now() - missingSince);
      if (left > 0) { h += `<div class="blk" style="inset:0;background:transparent"></div>`; clearTimeout(missingTimer); missingTimer = setTimeout(drawGate, left + 20); }
    } else {
      const p = 4, x = r.x - p, y = r.y - p, w = r.w + 2 * p, hh = r.h + 2 * p;
      h += `<div class="blk" style="left:0;top:0;width:${m.lw}px;height:${Math.max(0, y)}px"></div><div class="blk" style="left:0;top:${y + hh}px;width:${m.lw}px;height:${Math.max(0, m.lh - y - hh)}px"></div>
        <div class="blk" style="left:0;top:${y}px;width:${Math.max(0, x)}px;height:${hh}px"></div><div class="blk" style="left:${x + w}px;top:${y}px;width:${Math.max(0, m.lw - x - w)}px;height:${hh}px"></div>
        <div class="hole" style="left:${x}px;top:${y}px;width:${w}px;height:${hh}px"></div>`;
    }
  } else if (found) h += `<div class="softring" style="left:${r.x - 3}px;top:${r.y - 3}px;width:${r.w + 6}px;height:${r.h + 6}px"></div>`;
  lastName = guide.name;
  g.innerHTML = h;
}

// ---------------------------------------------------------------- N4: the three-beat strip (problem -> one fix -> what changed), content supplied by the tutorial
const BEATS = {
  E05: ['지난 사냥에서 HP가 14%까지 떨어진 뒤에야 물러났습니다.', 'Last hunt you only fell back once HP was down to 14%.'],
  E04: ['지난 사냥에서 위험한 마물을 두고 가까운 적만 쳤습니다.', 'Last hunt you hit the nearest enemies and left the dangerous one alone.'],
  E03: ["회오리가 '사거리 밖'으로 48회 막혔습니다.", "Whirlwind was blocked 48 times: out of range."],
  E07: ['장비를 모두 줍느라 제한 시간의 15%를 썼습니다.', 'Picking up every item cost 15% of the time limit.'],
  F05: ['쓰러지기 직전 5초에 HP가 14%까지 떨어졌습니다.', 'HP fell to 14% in the 5 seconds before you died.']
};
function beatStripHtml(tab) {
  const f = S.focusRule; if (!f) return '';
  const g = M.groups.find(x => x.ids.includes(f.focus)); if (!g || g.tab !== tab) return '';
  const b = BEATS[f.guide], problem = b ? T(b[0], b[1]) : F('{0}을(를) 아직 정하지 않았습니다.', T(f.title));
  const now = f.done ? 3 : 2;
  const fix = T(f.body), result = f.done ? F('저장했습니다. 다음 사냥에서 {0}의 변화를 관찰하세요.', T(f.title)) : T('저장하면 여기에 표시됩니다.', 'Shown here after you save.');
  const beats = [[1, T('겪은 문제', 'Problem'), problem], [2, T('고칠 한 가지', 'One fix'), fix], [3, T('달라진 점', 'What changed'), result]];
  const mark = n => '①②③'[n - 1];
  if (!S.stripOpen) {
    const cur = beats[now - 1];
    return `<button class="beat collapsed" data-ctl="edict-beat-strip" data-act="stripopen" aria-expanded="false"><span class="bn">${mark(now)}</span><span class="tx"><b>${esc(cur[1])}</b> ${esc(cur[2])}</span><span class="dots">${[1, 2, 3].map(n => `<i class="${n === now ? 'f' : n < now ? 'd' : ''}"></i>`).join('')}</span><span class="chev">▾</span></button>`;
  }
  return `<div class="beat" data-ctl="edict-beat-strip">${beats.map(([n, name, text]) => `<div class="b ${n === now ? 'now' : 'later'}"><small>${mark(n)} ${esc(name)}</small><span>${esc(text)}</span></div>`).join('')}
    <button class="beatx" data-act="stripopen" aria-expanded="true" aria-label="${T('접기', 'Collapse')}">▴</button></div>`;
}
// N6: one next action after a successful save
function afterSaved() {
  const f = S.focusRule;
  if (f && !f.done && M.practiced.has(f.guide)) { f.done = true; S.afterSave = M.has('details') ? {ko: '훈련장에서 확인', en: 'Check in training'} : {ko: '다음 사냥에서 관찰', en: 'Watch next hunt'}; }
  else if (!f) S.afterSave = null;

}
// the town notice card -> "Try configuring" (outside the edict window in the game)
function startNotice() {
  const rules = M.newRules().sort((a, b) => b.stage - a.stage);
  if (!rules.length) { toast(T('지금 안내할 새 문장이 없습니다.', 'No new sentence to announce.')); return; }
  const r = rules[0], info = ruleInfo(r);
  S.focusRule = {rule: r, ids: r.ids, done: false, ...info}; S.afterSave = null; S.stripOpen = false;

}

// ---------------------------------------------------------------- events and start-up
function requestClose() {
  if (M.dirty() && !M.pro) { W.dialog = {type: 'confirm', text: T('저장하지 않은 변경이 있습니다. 닫으시겠습니까?', 'You have unsaved changes. Close anyway?'), then: 'close'}; render(); return; }
  W.open = false; W.dialog = null; S.afterSave = null; render();
}
function handleBack() {
  if (W.dialog) { W.dialog = null; render(); return; }
  if (W.tab === 'skills' && !W.managing) { W.managing = true; render(); return; }
  requestClose();
}
function doSave() {
  M.save(); afterSaved(); toast(T('칙령을 저장했습니다', 'Edict saved')); render();

function act(a, v, el) {
  const d = W.dialog;
  switch (a) {
    case 'openwin': if (!W.open) { W.open = true; W.dialog = null; render(); } return;
    case 'close': requestClose(); return;
    case 'confirmyes': W.dialog = null; if (d && d.then === 'close') { M.revert(); W.open = false; } render(); return;
    case 'tab': selectTab(v); return;
    case 'group': selectGroup(v); return;
    case 'changedonly': W.changedOnly = !W.changedOnly; render(); return;
    case 'quickdlg': if (!locked()) { W.dialog = {type: 'quick', scope: v}; render(); } return;
    case 'quickpick': { const [scope, id] = v.split('|'); selectQuickPreset(scope, id); return; }

    case 'orderapply': M.setValue(d.id, d.order.join(',')); W.dialog = null; afterChange(); return;

    case 'numchip': d.text = String(v); d.err = ''; render(); return;
    case 'numapply': applyNumber(); return;
    case 'style': applyStyle(v); return;
    case 'modeswitch': M.acct.recommended = !M.acct.recommended; if (locked() && !['overview', 'skills', 'repeat'].includes(W.tab)) W.tab = 'overview'; render(); return;
    case 'save': doSave(); return;
    case 'revert': M.revert(); S.afterSave = null; render(); return;
    case 'aftersave': toast(S.afterSave ? T(S.afterSave.ko, S.afterSave.en) + ' (' + T('시연', 'demo') + ')' : ''); return;
    case 'stripopen': S.stripOpen = !S.stripOpen; render(); return;
    case 'toast': toast(v); return;
    case 'pslot': toast(T('선택했습니다 (시연)', 'Selected (demo)')); return;
    // skills
    case 'skillcard': { W.selectedSkill = v; const n = M.node(v); W.dialog = n.kind !== 'passive' ? {type: 'skillmenu', id: v, anchor: 'card'} : null; render(); return; }
    case 'inspclose': W.selectedSkill = null; W.pendingEquip = null; render(); return;
    case 'rankup': M.rankUp(W.selectedSkill); afterChange(); return;
    case 'rankdown': M.rankDown(W.selectedSkill); afterChange(); return;
    case 'equip': { const id = W.selectedSkill; if (M.equipped(id)) return; if (!M.equip(id)) W.pendingEquip = id; else W.pendingEquip = null; afterChange(); return; }
    case 'slot': onSlot(+v); return;
    case 'menuequip': skillAction('equip', v); return;
    case 'menuremove': skillAction('remove', v); return;
    case 'menupolicy': skillAction('policy', v); return;
    case 'commonpolicy': openSkillPolicy('BASIC'); return;
    case 'policyback': W.managing = true; render(); return;
    case 'ptab': ptabSelect(v); return;
    case 'pradio': if (el.getAttribute('aria-disabled') === 'true') return; W.visiblePreset = v; activatePreset(); return;
    case 'starternext': if (M.advanceLesson()) { W.preview = null; render(); } else toast(T('아직 진행할 수 없습니다', 'Not yet')); return;

    case 'prpause': if (W.preview) { W.preview.running = !W.preview.running; } render(); return;

function pv(kind, v, el) {

  else if (kind === 'autoscroll') S.autoScroll = !S.autoScroll;
  else if (kind === 'handoff') S.handoff = !S.handoff;
  else if (kind === 'open') { W.open = !W.open; W.dialog = null; }

  render();
}
function setStage(id) {

document.addEventListener('click', e => {
  const p = e.target.closest('[data-pv]');
  if (p && p.tagName === 'BUTTON') { pv(p.dataset.pv, p.dataset.v, p); return; }

document.addEventListener('input', e => {

});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.pv === 'stage') { setStage(t.value); return; }
  if (t.dataset && t.dataset.act === 'searchin') { W.search = t.value.trim(); render(); const s = document.querySelector('[data-ctl="edict-search"]'); if (s) s.focus(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && W.open && !(M.pro && S.coach)) handleBack();   // BackLocked during the forced lesson
  if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('role') === 'radio') { e.preventDefault(); e.target.click(); }

addEventListener('resize', () => { layout(); render(); });

// every control name that ever appears (the tests write them out as the machine-readable name contract)
window.__names = new Set();
const collectNames = () => document.querySelectorAll('[data-ctl]').forEach(n => window.__names.add(n.dataset.ctl));
new MutationObserver(collectNames).observe(document.body, {subtree: true, childList: true});

// test and debugging hooks
window.__edict = {M, W, S, D, render, act, setStage, ctl: ctlEl, gate: () => S.gateInfo, metrics, rel, focusGlobalOption, startNotice, layout, interactable, T,
  skipObservation: () => { if (W.preview) W.preview.sim.s1x = 9.98; }};

if (Q.get('open') === '1') W.open = true;
if (Q.get('locked') === '1') M.acct.recommended = true;
if (Q.get('tab')) { W.tab = Q.get('tab'); const gs = M.groupsOf(W.tab); if (gs.length) W.group[W.tab] = Q.get('group') || defaultGroup(W.tab, gs); }

if (Q.get('dialog') === 'quick' && Q.get('group')) W.dialog = {type: 'quick', scope: M.scopeOf(M.groupByKey(Q.get('group')))};

if (Q.get('skill')) { W.selectedSkill = Q.get('skill'); }

})();</script>
