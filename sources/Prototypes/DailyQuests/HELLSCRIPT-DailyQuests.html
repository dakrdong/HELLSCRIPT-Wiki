<script type="application/json" id="catalog">{"version":2,"quests":[{"id":"sell-equipment","activity":"SellEquipment","title":"장비 판매","target":30,"reward":20},{"id":"clear-rift","activity":"ClearRift","title":"균열 클리어","target":20,"reward":40},{"id":"enhance-equipment","activity":"EnhanceEquipment","title":"장비 강화","target":2,"reward":15},{"id":"spend-shop-gold","activity":"SpendShopGold","title":"상점 골드 사용","target":500,"reward":15},{"id":"use-potion","activity":"UsePotion","title":"물약 사용","target":10,"reward":10}]}</script>
<script>
(()=>{
 'use strict';
 const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);
 const catalog=JSON.parse($('catalog').textContent),sizes={portrait:[440,956],landscape:[956,440],pc169:[1600,900],pc1610:[1600,1000],pc219:[2100,900]};
 const strings={
  ko:{prototype:'일일 퀘스트 · HTML 시안',title:'일일 퀘스트',seven:'7일 출석',month:'28일 출석',received:'오늘 받은 심연 주화',dailyTotal:'하루 총 보상',completed:'목표 달성 {n} / 5',available:'수령 가능 {n}개',nothing:'수령할 보상이 없습니다',allClaimed:'오늘 보상 수령 완료',progress:'진행',reward:'주화',claim:'보상 수령',ongoing:'진행 중',claimed:'수령 완료',rules:'매일 같은 목표',rule1:'하루 총 100개',rule2:'추가 전체 완료 보상 없음',unlock:'강화는 기존 해금 조건 적용 · 저단계 장비도 가능',reset:'매일 00:00 KST 초기화',refresh:'새로고침',safe:'안전 영역',demoNote:'HTML 시안 · 예시 진행도 · 수령 동작은 이 화면에서만 시연됩니다.',close:'닫기',closed:'일일 퀘스트 시안을 닫았습니다.',reopen:'다시 열기',claimedToast:'심연 주화 {n}개를 받았습니다.',refreshed:'시연 진행도를 새로고침했습니다.',attendanceToast:'{name}은 기존 출석 화면으로 연결되는 탭입니다.',sample:['혼합 상태','처음 시작','모두 달성','모두 수령'],devices:['세로 440×956','가로 956×440','PC 16:9','PC 16:10','PC 21:9','현재 창'],questsLabel:'다섯 가지 일일 퀘스트',eventsLabel:'이벤트',sampleLabel:'시연 상태',deviceLabel:'화면 비율',summaryLabel:'오늘의 보상'},
  en:{prototype:'Daily Quests · HTML preview',title:'Daily Quests',seven:'7-day Login',month:'28-day Login',received:'Abyssal Coins claimed today',dailyTotal:'Daily total',completed:'Goals met {n} / 5',available:'{n} coins ready to claim',nothing:'No rewards ready to claim',allClaimed:'All daily rewards claimed',progress:'Progress',reward:'coins',claim:'Claim reward',ongoing:'In progress',claimed:'Claimed',rules:'Same goals each day',rule1:'100 coins per day',rule2:'No extra all-complete bonus',unlock:'Enhancement follows existing unlocks · Low-level gear counts',reset:'Resets daily at 00:00 KST',refresh:'Refresh',safe:'Safe area',demoNote:'HTML preview · Sample progress · Claims affect this preview only.',close:'Close',closed:'Daily Quest preview closed.',reopen:'Open again',claimedToast:'Claimed {n} Abyssal Coins.',refreshed:'Sample progress refreshed.',attendanceToast:'{name} links to the existing login reward screen.',sample:['Mixed states','Fresh start','All goals met','All claimed'],devices:['Portrait 440×956','Landscape 956×440','PC 16:9','PC 16:10','PC 21:9','Current window'],questsLabel:'Five daily quests',eventsLabel:'Events',sampleLabel:'Sample state',deviceLabel:'Screen ratio',summaryLabel:'Today’s rewards'}
 };
 const questText={
  'sell-equipment':{icon:'sell',ko:['장비 판매','실제 판매 수량 · 자동·창고 판매 포함'],en:['Sell equipment','Equipment actually sold, including auto and storage sales.']},
  'clear-rift':{icon:'rift',ko:['균열 클리어','전리품 정리까지 완료 · 훈련·튜토리얼·중도 귀환 제외'],en:['Clear rifts','Finish loot cleanup. Training, tutorial and early returns excluded.']},
  'enhance-equipment':{icon:'enhance',ko:['장비 강화','완료한 강화 단계 수 · +10은 10단계'],en:['Enhance equipment','Count completed enhancement levels. +10 counts as 10.']},
  'spend-shop-gold':{icon:'shop',ko:['상점 골드 사용','실제 결제 골드 · 무료 보급·강화·재련 제외'],en:['Spend shop gold','Actual shop payments. Free supplies, enhancement and reforging excluded.']},
  'use-potion':{icon:'potion',ko:['물약 사용','실제 소비 수량 · 훈련·튜토리얼·취소·실패 제외'],en:['Use potions','Actual consumption. Training, tutorial, cancelled or failed uses excluded.']}
 };
 let language=params.get('lang')==='en'?'en':'ko',device=params.get('device')||'landscape',sample=params.get('sample')||'mixed',progress=[],claimed=[],toastTimeout;
 const embed=params.get('embed')==='1';document.body.classList.toggle('embed',embed);if(embed)device='auto';
 const text=(key,n)=>strings[language][key].replace('{n}',n??'');
 const icon=name=>`<svg aria-hidden="true"><use href="#icon-${name}"/></svg>`;
 function setSample(){
  if(sample==='start'){progress=catalog.quests.map(()=>0);claimed=catalog.quests.map(()=>false)}
  else if(sample==='ready'||sample==='claimed'){progress=catalog.quests.map(q=>q.target);claimed=catalog.quests.map(()=>sample==='claimed')}
  else{sample='mixed';progress=[0,1,2,500,10];claimed=[false,false,false,true,true]}
 }
 function render(){
  const s=strings[language];document.documentElement.lang=language;document.title=`HELLSCRIPT · ${s.prototype}`;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=s[el.dataset.i18n]);
  $('language').value=language;$('sample').value=sample;Array.from($('sample').options).forEach((o,i)=>o.textContent=s.sample[i]);
  Array.from($('devices').children).forEach((b,i)=>{b.textContent=s.devices[i];b.setAttribute('aria-pressed',String(b.dataset.device===device))});
  $('close').setAttribute('aria-label',s.close);$('devices').setAttribute('aria-label',s.deviceLabel);$('sample').setAttribute('aria-label',s.sampleLabel);document.querySelector('.tabs').setAttribute('aria-label',s.eventsLabel);document.querySelector('.summary').setAttribute('aria-label',s.summaryLabel);$('quests').setAttribute('aria-label',s.questsLabel);
  const received=catalog.quests.reduce((n,q,i)=>n+(claimed[i]?q.reward:0),0),ready=catalog.quests.reduce((n,q,i)=>n+(!claimed[i]&&progress[i]>=q.target?q.reward:0),0),done=catalog.quests.filter((q,i)=>progress[i]>=q.target).length;
  $('received').textContent=received;$('received-fill').style.width=received+'%';const track=document.querySelector('.daily-track');track.setAttribute('aria-valuenow',received);track.setAttribute('aria-label',s.received);
  $('completed').textContent=text('completed',done);$('claimable-summary').textContent=received===100?s.allClaimed:ready?text('available',ready):s.nothing;$('claimable-summary').style.color=ready?'var(--claimable)':'var(--muted)';
  $('quests').innerHTML=catalog.quests.map((q,i)=>{
   const qt=questText[q.id],state=claimed[i]?'claimed':progress[i]>=q.target?'claimable':'ongoing',p=progress[i].toLocaleString(language==='ko'?'ko-KR':'en-US'),target=q.target.toLocaleString(language==='ko'?'ko-KR':'en-US');
   return `<article class="quest ${state}" data-quest="${q.id}" aria-labelledby="quest-${i}"><div class="quest-head"><div class="quest-icon">${icon(qt.icon)}</div><h2 id="quest-${i}">${qt[language][0]}</h2></div><p class="description">${qt[language][1]}</p><div class="quest-progress"><div class="progress-copy"><span>${s.progress}</span><strong>${p} <small>/ ${target}</small></strong></div><div class="bar" role="progressbar" aria-label="${qt[language][0]} ${s.progress}" aria-valuemin="0" aria-valuemax="${q.target}" aria-valuenow="${progress[i]}"><span style="width:${100*progress[i]/q.target}%"></span></div></div><div class="quest-bottom"><div class="reward" aria-label="${s.reward} ${q.reward}">${icon('coin')}<strong>${q.reward}</strong><small>${s.reward}</small></div><button class="claim" data-claim="${i}" ${state!=='claimable'?'disabled':''} aria-label="${qt[language][0]}: ${s[state==='claimable'?'claim':state]}">${claimed[i]?icon('check'):''}${s[state==='claimable'?'claim':state]}</button></div></article>`;
  }).join('')+`<aside class="rules"><div class="rules-title">${icon('info')}<span>${s.rules}</span></div><p><strong>${s.rule1}</strong> · ${s.rule2}</p><p class="unlock-note">${s.unlock}</p></aside>`;
  fit();
 }
 function fit(){
  const r=$('stage').getBoundingClientRect(),dim=sizes[device]||[r.width,r.height],w=dim[0],h=dim[1],scale=embed?1:Math.min(1,(r.width-12)/w,(r.height-12)/h);
  $('device').style.width=w+'px';$('device').style.height=h+'px';$('device').style.transform=`translate(-50%,-50%) scale(${Math.max(.1,scale)})`;
  $('dimensions').textContent=`${Math.round(w)} × ${Math.round(h)}`;
  const safe=$('safe').checked,portrait=w<h,zone=$('safe-zone');
  zone.style.setProperty('--safe-top',safe&&portrait?'24px':'0px');zone.style.setProperty('--safe-bottom',safe&&portrait?'20px':safe?'10px':'0px');zone.style.setProperty('--safe-left',safe&&!portrait?'28px':'0px');zone.style.setProperty('--safe-right',safe&&!portrait?'28px':'0px');
 }
 function showToast(value){clearTimeout(toastTimeout);$('toast').textContent=value;toastTimeout=setTimeout(()=>$('toast').textContent='',2400)}
 $('devices').addEventListener('click',e=>{const b=e.target.closest('[data-device]');if(b){device=b.dataset.device;render()}});
 $('language').addEventListener('change',e=>{language=e.target.value;render()});$('sample').addEventListener('change',e=>{sample=e.target.value;setSample();render()});$('safe').addEventListener('change',fit);$('safe').checked=params.get('safe')==='1';
 $('quests').addEventListener('click',e=>{const b=e.target.closest('[data-claim]');if(!b)return;const i=Number(b.dataset.claim);if(claimed[i]||progress[i]<catalog.quests[i].target)return;claimed[i]=true;render();showToast(text('claimedToast',catalog.quests[i].reward));$('quests').querySelector(`[data-claim="${i}"]`).focus()});
 $('refresh').addEventListener('click',()=>{render();showToast(text('refreshed'))});
 document.querySelectorAll('[data-attendance]').forEach(b=>b.addEventListener('click',()=>showToast(text('attendanceToast').replace('{name}',strings[language][b.dataset.attendance]))));
 $('close').addEventListener('click',()=>{$('app').hidden=true;$('closed').hidden=false;$('reopen').focus()});$('reopen').addEventListener('click',()=>{$('closed').hidden=true;$('app').hidden=false;$('close').focus()});
 const now=()=>Date.now(),resetAt=()=>{const kstDay=Math.floor((now()+9*3600000)/86400000);return(kstDay+1)*86400000-9*3600000};
 function updateCountdown(){const secs=Math.max(0,Math.ceil((resetAt()-now())/1000));$('countdown').textContent=[Math.floor(secs/3600),Math.floor(secs/60)%60,secs%60].map(n=>String(n).padStart(2,'0')).join(':')}
 new ResizeObserver(fit).observe($('stage'));setSample();render();updateCountdown();setInterval(updateCountdown,1000);
})();
</script>
