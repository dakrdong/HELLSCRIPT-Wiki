function occupied(p){if(!P[p.id])return[];return shapes[P[p.id].shape].cells.map(([q,r])=>{const [x,y]=rot(q,r,p.rot);return{q:x+p.q,r:y+p.r}})}

function regionContour(id){

 if(!regionContours.has(cacheKey)){
  const cells=D.boards[ui.weapon].filter(n=>n.region===id);
  regionContours.set(cacheKey,V.loops(cells).map(poly=>V.path(V.inset(poly,1.1))).join(' '));

function positionPopover(q,r,kind){

 const box=el.getBoundingClientRect(),gap=kind==='region'?25:Math.max(13,R*c.scale)+9;
 // Prefer the board itself; extremely short screens may use the surrounding panel.
 const panel=$('#board-panel').getBoundingClientRect();

 const left=Math.max(8,limit.left+6),right=Math.min(innerWidth-8,limit.right-6),top=Math.max(8,limit.top+6),bottom=Math.min(innerHeight-8,limit.bottom-6);

 if(px<left){px=x-box.width/2;py=y+gap;side='below';if(py+box.height>bottom){py=y-gap-box.height;side='above'}}

 el.style.left=`${Math.round(px)}px`;el.style.top=`${Math.round(py)}px`;el.dataset.side=side;

}

// Anchor to the complete rune contour, not the clicked cell, so the button never covers its shape.
function positionPiecePopover(p){
 const el=$('#board-popover'),stage=$('#board-stage').getBoundingClientRect(),cam=ui.camera;
 const screen=E.occupied(p).map(n=>{const [x,y]=xy(n.q,n.r);return{x:stage.left+stage.width/2+(x-cam.x)*cam.scale,y:stage.top+stage.height/2+(y-cam.y)*cam.scale}});
 const a={left:Math.min(...screen.map(n=>n.x))-(R-2)*cam.scale,right:Math.max(...screen.map(n=>n.x))+(R-2)*cam.scale,top:Math.min(...screen.map(n=>n.y))-(Math.sqrt(3)*R/2+V.LIFT)*cam.scale,bottom:Math.max(...screen.map(n=>n.y))+(Math.sqrt(3)*R/2+V.DEPTH-V.LIFT)*cam.scale};
 if(a.right<stage.left||a.left>stage.right||a.bottom<stage.top||a.top>stage.bottom){closePopover();return}
 const box=el.getBoundingClientRect(),gap=9,cx=(Math.max(a.left,stage.left)+Math.min(a.right,stage.right))/2,cy=(Math.max(a.top,stage.top)+Math.min(a.bottom,stage.bottom))/2;
 const panel=$('#board-panel').getBoundingClientRect(),limit={left:Math.max(8,stage.left+5),right:Math.min(innerWidth-8,stage.right-5),top:Math.max(8,stage.top+5),bottom:Math.min(innerHeight-8,stage.bottom-5)};
 let choices=[{side:'right',x:a.right+gap,y:cy-box.height/2},{side:'left',x:a.left-gap-box.width,y:cy-box.height/2},{side:'above',x:cx-box.width/2,y:a.top-gap-box.height},{side:'below',x:cx-box.width/2,y:a.bottom+gap}];
 // Clamp along the tangential axis; never push a side button into the selected shape.
 const fit=(v,l)=>{const out={...v};if(v.side==='left'||v.side==='right')out.y=Math.max(l.top,Math.min(v.y,l.bottom-box.height));else out.x=Math.max(l.left,Math.min(v.x,l.right-box.width));return out};
 const inside=(v,l)=>v.x>=l.left&&v.x+box.width<=l.right&&v.y>=l.top&&v.y+box.height<=l.bottom;
 let chosen=choices.map(v=>fit(v,limit)).find(v=>inside(v,limit));
 if(!chosen){const larger={...limit,top:Math.max(8,panel.top+5),bottom:Math.min(innerHeight-8,panel.bottom-5)};chosen=choices.map(v=>fit(v,larger)).find(v=>inside(v,larger))}
 if(!chosen){closePopover();return} // A fully zoomed/cropped piece still has the fixed detail-panel action.
 el.style.left=Math.round(chosen.x)+'px';el.style.top=Math.round(chosen.y)+'px';el.dataset.side=chosen.side;
 el.style.setProperty('--anchor-y',Math.max(10,Math.min(box.height-10,cy-chosen.y))+'px');
 el.style.setProperty('--anchor-x',Math.max(10,Math.min(box.width-10,cx-chosen.x))+'px');
}

function catalogModal(){modal('무기별 능력 도감',`<div class="catalog-controls"><select id="cat-weapon">${D.weapons.map(w=>`<option value="${w.id}" ${w.id===ui.weapon?'selected':''}>${w.name}</option>`).join('')}</select><select id="cat-region"><option value="all">모든 영역</option>${D.regions.map(r=>`<option value="${r.id}">${r.name}</option>`).join('')}</select><input id="cat-search" type="search" placeholder="능력 이름·효과 검색" aria-label="능력 검색"></div><p class="fine">기존 원본 정의와 신규 확장을 구분합니다. 모든 슬롯 수치는 밸런스 초안입니다. 각 항목은 고유한 의미 조합의 아이콘을 사용합니다.</p><div id="cat-results"></div>`,'catalog',true);renderCatalog()}
function renderCatalog(){const w=$('#cat-weapon')?.value||ui.weapon,r=$('#cat-region')?.value||'all',q=($('#cat-search')?.value||'').toLowerCase(),list=D.boards[w].filter(n=>n.ability!=='root'&&(r==='all'||n.region===r));const grouped=new Map();for(const n of list){if(!grouped.has(n.ability))grouped.set(n.ability,[]);grouped.get(n.ability).push(n)}const rows=[...grouped].filter(([id])=>{const a=E.A[id];return(a.name+' '+a.description+' '+(a.skill||'')).toLowerCase().includes(q)});$('#cat-results').innerHTML=`<p class="fine">${rows.length}종 / ${list.length}칸 배정 · 원본 미적용 3종은 보드 보상 제외</p><div class="catalog-cards">${rows.map(([id,ns])=>{const a=E.A[id],values=[...new Set(ns.map(n=>n.value))].sort((a,b)=>a-b);return`<article class="catalog-card" style="--ink:${TYPES[a.color].ink}"><div class="detail-lead"><div class="ability-art ${a.color==='elite'?'elite':''}">${icon(a.glyph)}</div><div class="ability-copy"><h3>${a.name}</h3><small>${a.statId!==null?'StatId '+a.statId:esc(a.id)} · ${ns.length}칸</small></div></div><div class="detail-tags"><span class="tag ${a.origin==='new'?'new':'existing'}">${originLabel(a)}</span><span class="tag">${values.map(v=>fmt(v,a)).join(' / ')}</span></div><p>${a.description}</p><button class="text-button" data-action="jump-node" data-id="${ns[0].id}">${icon('map')}배정 위치 보기</button></article>`}).join('')}</div>`}

function help(){modal('룬 보드 이용 안내',`<section class="help-section"><h3>직접 따라 하는 5단계 가이드</h3><p>같은 색 연결부터 회전과 능력 활성까지 연습합니다. 완료하지 않아도 자유롭게 넘길 수 있습니다.</p><button class="stone gold" data-action="tutorial">${icon('book')}플레이블 튜토리얼 열기</button></section><section class="help-section"><h3>숙련도와 개방</h3><p>Lv.1에 중앙 지름 5, 19칸이 열립니다. 레벨업마다 6P를 받고 1P로 인접 슬롯을 엽니다. 중앙 37칸 완료 후 6개 영역 중 1곳을 선택합니다. 선택한 영역의 중앙 엘리트는 즉시 무료 개방되고 나머지 36칸을 1P씩 엽니다. 중앙 엘리트가 무료로 열려도 경계에서 연결해 들어와야 하며 독립적인 슬롯 개방 출발점이 되지 않습니다. 현재 영역 37칸을 모두 열기 전에는 다른 영역을 선택할 수 없습니다.</p></section><section class="help-section"><h3>편집 / 보기</h3><p>편집 모드에서 배치한 블럭을 선택하면 바로 옆 회수 버튼으로 회수할 수 있습니다. 아래 선택 정보에서도 밝은 회수 버튼을 사용할 수 있고, 미개방 슬롯을 누르면 바로 옆 작은 팝업에서 개방합니다. 포인트가 없거나 연결 조건을 충족하지 않으면 개방 버튼이 비활성화됩니다. 보기 모드에서는 룬이 올라간 칸도 아래 능력을 확인하며 슬롯 개방 팝업은 표시하지 않습니다. 잠긴 영역의 자물쇠는 두 모드에서 모두 눌러 정보 확인·조건 충족 시 영역 개방이 가능합니다. 확대/축소·전체 보기·영역 지도는 두 모드에서 모두 사용할 수 있습니다.</p></section><section class="help-section"><h3>룬 보관함</h3><p>어느 무기에든 배치한 룬은 보관함에서 빠지고 회수하면 돌아옵니다. 색상 필터와 1~5칸 체크박스 필터를 함께 사용합니다. 전부를 켜면 모든 크기를 표시하며, 모두 해제하면 빈 목록이 됩니다. 숨긴 크기의 룬을 회수해도 해당 필터를 켜기 전에는 목록에 표시되지 않습니다.</p></section><section class="help-section"><h3>블럭의 연결</h3><p>중앙 시작점과 직접 변으로 닿는 블럭은 모두 연결된 것으로 인정합니다. 같은 색도 서로 변으로 붙지만 않으면 중앙 옆에서 각각 시작할 수 있습니다. 같은 색의 다른 블럭은 변으로 맞닿지 않고 한 변의 간격으로 연결하며, 전체 연결이 중앙까지 이어져야 합니다. 간격을 사이에 둔 두 인접 슬롯도 개방되어야 합니다. 두 칸을 단일 다른 블럭이 함께 덮어 연결변을 가리면 연결되지 않습니다. 다른 색 일반 칸을 덮어도 배치는 가능하지만 효과는 꺼집니다. 엘리트는 모든 색을 인정하되 새 시작점이 아닙니다.</p></section><section class="help-section"><h3>마우스·터치</h3><p>선택 후 빈 칸을 누르거나 끌어 놓으세요. 드래그 시 블럭은 포인터 위에 뜨고, 착지 미리보기가 실제 배치 위치입니다. 보드에 놓인 블럭은 누른 뒤 0.1초 이내에 끌면 보드가 이동하고, 0.1초 동안 누르고 있다가 끌면 블럭이 이동합니다. 한 번 보드 이동으로 결정되면 누른 채 오래 움직여도 블럭 이동으로 바뀌지 않습니다. 작은 손 떨림은 드래그로 보지 않습니다. 보관함의 터치는 0.3초 누른 뒤 끌면 배치, 짧게 쓸면 목록 스크롤입니다. 빈 공간 끌기·두 손가락 확대를 지원합니다. R: 회전 / Esc: 드래그 취소 또는 선택 해제.</p></section><section class="help-section"><h3>원본과 새 설계</h3><p>위키의 StatId 0~56과 단위를 보존했습니다. 군중 제어 지속시간 감소·최대 기력·기력 회복은 적용처가 없어 배정하지 않았습니다. 신규 효과는 도감에 따로 표시하며 전투 구현이 필요합니다. 이 HTML은 실제 전투·결제·계정과 연결되지 않습니다.</p></section><p class="fine">실제 장착 보드와 편집 대상은 다른 개념입니다. 이 시안에서 무기 탭 전환은 편집 대상을 바꾸며 게임 장비를 착용시키지 않습니다. localStorage가 차단된 브라우저는 JSON 내보내기로 보존하세요. v13은 v8~v12와 동일한 저장 형식과 저장 키를 사용합니다. v5~v9 JSON도 불러올 수 있습니다. v3/v4 JSON을 불러오면 개방된 영역의 중앙을 무료로 전환하고 이미 중앙에 사용한 포인트를 반환합니다. 기존 레벨·경험치·룬 배치·프리셋과 이전 저장 원문은 유지합니다. 파일 주소에 따라 저장소가 나뉘면 JSON으로 옮겨 주세요.</p>`,'help')}
function layout(){const width=innerWidth,height=innerHeight,orientation=ui.layout==='auto'?(height>width?'portrait':'landscape'):ui.layout;$('#game').dataset.layout=orientation;document.body.classList.toggle('device',(width<=650&&orientation==='portrait')||(height<=510&&width<=1100));$$('[data-layout-choice]').forEach(b=>b.classList.toggle('on',b.dataset.layoutChoice===ui.layout));$('#view-label').textContent=orientation==='portrait'?'02 / PORTRAIT':'01 / LANDSCAPE';requestAnimationFrame(()=>{const rect=$('#board-stage').getBoundingClientRect(),stamp=Math.round(rect.width)+','+Math.round(rect.height);if(stamp!==lastSize){lastSize=stamp;closePopover();cancelDrag();fit(ui.overview?'all':ui.focus);drawBoard();renderBoardTop()}})}
function screenWorld(x,y){const b=$('#board-svg').getBoundingClientRect(),v=$('#board-svg').viewBox.baseVal;return{x:v.x+(x-b.left)/b.width*v.width,y:v.y+(y-b.top)/b.height*v.height}}
